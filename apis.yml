- aid: tale-dev:tale-dev-automations-api
  name: Tale Automations API
  description: >-
    Versioned automations, their runs and triggers — list, read, install, bind, run, cancel and delete.
    Authoring (save, validate, test, deploy) is not on this surface: it lives on `POST /api/v1/mcp` (`save_automation`,
    `validate_automation`, `test_automation`, `deploy_automation`, `set_trigger` — the MCP endpoint page
    of the developer docs), in the app’s automation editor, and in `tale deploy` for configuration packs.
    A deleted automation comes back by saving and deploying it again there.
  humanURL: https://docs.tale.dev/develop/api-reference
  baseURL: https://your-host.example.com/api/v1
