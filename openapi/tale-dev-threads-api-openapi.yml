  /api/v1/threads/{id}/generation:
    get:
      tags:
      - Threads
      summary: Poll the running turn
      description: 'Only the key holder’s threads without a project. Project threads are available through their project URL. `queued`: the accepted send is waiting for a worker (the 202 was answered, the turn has not opened) — accepted sends form one oldest-first queue shared by the whole deployment, worked in batches of up to five turns with the next batch starting only once the running one has settled, so a burst of sends completes in waves, not in parallel. `streaming`: the model is streaming its reply to the server — `text` and `reasoning` carry what has arrived so far, so a poller sees progress; send `since` (the UTF-16 code units of `text` you already hold — JavaScript `String.length`, an emoji counting two; not code points) and `reasoningSince` (the same for `reasoning`) to receive only what arrived after them, with `textOffset`/`textLength` and `reasoningOffset`/`reasoningLength` beside them — reassemble by one rule, `held = held.slice(0, textOffset) + text`, and send `textLength` back as `since`; there is no push channel on this surface. A turn has no fixed deadline — the server abandons one only after 180 seconds of provider silence — so bound your own loop and stop a turn you no longer want with DELETE /api/v1/threads/{id}/generation. `idle`: no turn is running — `lastMessageId` and `lastStatus` name the newest assistant message and how it settled. The recipe after a send (or a lost 202): poll until `idle`, then compare `lastMessageId` with the `messageId` the 202 named — equal means your turn settled (read that message at GET /api/v1/threads/{id}/messages/{messageId}, or page the messages with `order=desc`), a different id means yours has not started yet.'
      operationId: getGeneration
      security:
      - bearerAuth: []
      parameters:
      - name: X-Organization-Slug
        in: header
        required: false
        schema:
          type: string
        description: The organization to operate on. STRICTLY REQUIRED on every call, reads included, when the key holder belongs to more than one organization — without it such requests are refused with 400 `ORG_SLUG_REQUIRED` (the dashboard’s last-active organization never steers a machine call). A slug that names no organization answers 404 `ORG_SLUG_INVALID`, one the key holder is no member of 403 `ORG_FORBIDDEN`. Single-organization keys may omit it; a blank or whitespace-only value reads as the header absent. Each of the three refusals lists the slugs the key holder may send under `data.organizations`; `GET /api/v1/me` answers them too.
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: Thread ID
      - name: since
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
        description: 'The number of UTF-16 code units (JavaScript `String.length` — an emoji counts two; not code points, not grapheme clusters) of `text` you already hold from an earlier poll: the answer carries only what arrived after them, `textOffset` says where the slice starts — the value you sent, one lower when that would have split a surrogate pair (an astral character is two units, and a slice opening on its second half would put an unpaired surrogate on the wire), or 0 when a tool round reset the reply — and `textLength` how long the whole reply is so far. Reassemble by one rule, `held = held.slice(0, textOffset) + text`, and send `textLength` back as `since`: it never falls inside a pair. Ignored unless the turn is streaming'
      - name: reasoningSince
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
        description: 'The number of UTF-16 code units (JavaScript `String.length`) of `reasoning` you already hold from an earlier poll — the `since` of the reasoning stream: the answer carries only what arrived after them, `reasoningOffset` says where the slice starts — the value you sent, one lower when that would have split a surrogate pair, or 0 when a tool round reset the reasoning with the text — and `reasoningLength` how long the whole reasoning is so far. Reassemble as `held = held.slice(0, reasoningOffset) + reasoning` and send `reasoningLength` back as `reasoningSince`. Ignored unless the turn is streaming'
      - name: X-Request-Id
        in: header
        required: false
        description: 'Your own correlation id, echoed back on the response and written to the platform’s log: up to 255 characters of letters, digits, `_`, `-` and `=`. Any other value is replaced by a fresh UUID (the response carries the id that was used), and uniqueness of an id you choose is yours to keep.'
        schema:
          type: string
          pattern: ^[A-Za-z0-9_=-]{1,255}$
      responses:
        '200':
          description: Idle when no turn is running; otherwise the live status
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                properties:
                  status:
                    type: string
                    enum:
                    - idle
                    - queued
                    - streaming
                  messageId:
                    type: string
                    description: The assistant message the turn streams into (present while queued or streaming)
                  text:
                    type: string
                    description: The reply text streamed so far — from `textOffset` on when `since` was sent, always whole characters (present while streaming)
                  textOffset:
                    type: integer
                    minimum: 0
                    description: 'Where `text` starts, in UTF-16 code units: the `since` you sent, one lower when that would have split a surrogate pair, or 0 when the reply was reset since — reassemble as `held = held.slice(0, textOffset) + text` (present while streaming)'
                  textLength:
                    type: integer
                    minimum: 0
                    description: The length of the whole reply streamed so far, in UTF-16 code units (JavaScript `String.length`) — send it back as `since` on the next poll; it never falls inside a surrogate pair (present while streaming)
                  lastMessageId:
                    type: string
                    description: The newest assistant message on the thread (present while idle, once the thread has one) — compare with the `messageId` a 202 named to know whether that turn settled
                  lastStatus:
                    type: string
                    enum:
                    - pending
                    - complete
                    - failed
                    - cancelled
                    description: How `lastMessageId` settled (present with it)
                  reasoning:
                    type: string
                    description: The model’s reasoning streamed so far — from `reasoningOffset` on when `reasoningSince` was sent, always whole characters; display-only, may be empty (present while streaming)
                  reasoningOffset:
                    type: integer
                    minimum: 0
                    description: 'Where `reasoning` starts, in UTF-16 code units: the `reasoningSince` you sent, one lower when that would have split a surrogate pair, or 0 when the reasoning was reset since (present while streaming)'
                  reasoningLength:
                    type: integer
                    minimum: 0
                    description: The length of the whole reasoning streamed so far, in UTF-16 code units — send it back as `reasoningSince` on the next poll; it never falls inside a surrogate pair (present while streaming)
                  cancelRequested:
                    type: boolean
                    description: A stop was asked for and the turn has not settled yet (present while streaming)
                  updatedAt:
                    type: integer
                    minimum: 0
                    description: Epoch ms of the last progress write (present while streaming)
