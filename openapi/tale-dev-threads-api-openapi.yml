          - PROJECT_HAS_PROTECTED_RECORDS
          - PROJECT_KEY_INVALID
          - PROJECT_KEY_TAKEN
          - PROJECT_LEGAL_HOLD
          - PROJECT_NOT_FOUND
          - PROJECT_SHARING_INVALID
          - PURGE_INCOMPLETE
          - RATE_LIMITED
          - RBAC_FORBIDDEN
          - REQUEST_TIMEOUT
          - REVIEW_COMPETENCE_REQUIRED
          - REVIEW_INDEPENDENT_REVIEWER_REQUIRED
          - ROLE_FORBIDDEN
          - RUN_ACTIVE
          - RUN_NOT_FOUND
          - RUN_QUARANTINED
          - RUN_QUARANTINE_CHANGED
          - SETUP_FOLDER_MISSING
          - SKILL_EXISTS
          - SKILL_FILE_NOT_FOUND
          - SKILL_FORBIDDEN
          - SKILL_MALFORMED
          - SKILL_NOT_FOUND
          - SKILL_PUBLISH_FORBIDDEN
          - SKILL_STALE
          - SKILL_TEAM_UNKNOWN
          - STANDARD_AGENT_OFF
          - STANDARD_AGENT_UNAVAILABLE
          - TASK_AGENT_REVIEW_REQUIRED
          - TASK_ARCHIVED
          - TASK_AUTOMATION_DISABLED
          - TASK_AUTOMATION_UNAVAILABLE
          - TASK_EXTERNAL_REF_INVALID
          - TASK_EXTERNAL_STATUS_STALE
          - TASK_HAS_LIVE_RUN
          - TASK_HAS_OPEN_SUBTASKS
          - TASK_LABEL_UNKNOWN
          - TASK_NOT_FOUND
          - TASK_NOT_IN_REVIEW
          - TASK_REVIEW_POLICY_UNAVAILABLE
          - TASK_STATUS_CONFLICT
          - TEAM_ACCESS_DENIED
          - TEAM_INHERITED_FROM_FOLDER
          - TEAM_NOT_IN_ORG
          - THREAD_NOT_FOUND
          - UNAUTHORIZED
          - UNSUPPORTED_FILE_TYPE
          - UPLOAD_FILE_MISMATCH
          - UPLOAD_INTENT_INVALID
          - UPLOAD_POLICY_REJECTED
          - UPSTREAM_UNAVAILABLE
          - URI_TOO_LONG
          - WEBSITE_DOMAIN_IMMUTABLE
          - WEBSITE_DOMAIN_INVALID
          - WEBSITE_DOMAIN_NOT_CRAWLABLE
          - WEBSITE_DUPLICATE_DOMAIN
          - WEBSITE_INVALID_LIST_URL
          - WEBSITE_NOT_FOUND
          description: 'A stable refusal code — every refusal the door itself makes carries one, and so does every domain refusal it lets through. The set is additive: a new code is a minor change, so treat a value you do not know as a generic refusal of the status you got.'
        requestId:
          type: string
          description: The response’s `X-Request-Id`, repeated on a 429, on a 500, on a body-size 413 and on a URL-size 414 so a caller can quote it
        data:
          type: object
          properties:
            retryAfterMs:
              type: number
              description: Wait in milliseconds for RATE_LIMITED
            providers:
              type: array
              items:
                type: string
              description: For CHAT_MODEL_AMBIGUOUS, the provider slugs that serve the model — name one as `providerSlug`
            lastMessageId:
              type: string
              description: 'For CHAT_TURN_NOT_RUNNING, the newest assistant message on the thread (once it has one) — the idle poll’s own disambiguation: equal to the `messageId` a 202 named means that turn already settled'
            lastStatus:
              type: string
              enum:
              - pending
              - complete
              - failed
              - cancelled
              description: For CHAT_TURN_NOT_RUNNING, how `lastMessageId` settled (present with it)
            organizations:
              type: array
              description: For ORG_SLUG_REQUIRED, ORG_SLUG_INVALID and ORG_FORBIDDEN, the organizations the key holder belongs to (a disabled membership is left out; the list is empty when none remains) — send one of the slugs as `X-Organization-Slug`
              items:
                type: object
                required:
                - slug
                - name
                properties:
                  slug:
                    type: string
                  name:
                    type: string
            issues:
              type: array
              description: For INVALID_BODY and INVALID_QUERY, every problem the schema found in the body or the query string; for INVALID_LIMIT and INVALID_CURSOR, the one parameter refused (`limit`, `cursor`); for AUTOMATION_INPUT_INVALID, every problem the automation’s inputs schema found in the run input (at most 20 either way), each naming the field and the reason; `error` repeats the first one
              items:
                type: object
                required:
                - path
                - message
                properties:
                  path:
                    type: string
                    description: The field, dotted for nesting (`address.city`, `contacts.2.email`); empty for a problem with the body as a whole
                  message:
                    type: string
            scope:
              type: string
              enum:
              - user
              - team
              - project
              - org
              - apiKey
              description: 'For BUDGET_EXCEEDED, whose cap is reached: the key holder’s own (`user`), one of their teams’ (`team`), that of the project the work belongs to (`project`), the organization’s (`org`) or this API key’s (`apiKey`)'
            period:
              type: string
              enum:
              - daily
              - weekly
              - monthly
              description: For BUDGET_EXCEEDED, what the cap counts over — a calendar day, ISO week or calendar month in UTC
            limitCode:
              type: string
              enum:
              - TOKEN_LIMIT
              - COST_LIMIT
              - REQUEST_LIMIT
              description: 'For BUDGET_EXCEEDED, which cap is reached: tokens, cost in cents, or requests'
            used:
              type: number
              description: For BUDGET_EXCEEDED, the usage the cap measured this period, in its unit (tokens, cents or requests)
            limit:
              type: number
              description: For BUDGET_EXCEEDED, the cap, in the same unit
            resetsAt:
              type: number
              description: For BUDGET_EXCEEDED, when the period resets, in epoch milliseconds — `Retry-After` names the same wait in whole seconds
    ApprovalPart:
      type: object
      required:
      - type
      - approvalId
      - question
      properties:
        type:
          type: string
          enum:
          - approval
        approvalId:
          type: string
        question:
          type: string
        decision:
          type: string
          enum:
          - approved
          - rejected
    Thread:
      type: object
      required:
      - id
      - kind
      - archived
      - createdAt
      - updatedAt
      - generating
      properties:
        id:
          type: string
        title:
          type: string
        kind:
          type: string
        harness:
          type: string
          description: The sandbox harness a thread the app started runs on (`claude-code`, …) — present only on such a thread; the direct threads this surface creates never carry it
        projectId:
          type: string
          description: Present only for a thread returned through its project URL
        archived:
          type: boolean
        archivedAt:
          type: integer
          minimum: 0
          description: Epoch ms of the archive — present on an archived thread whose archive the deployment recorded; `updatedAt` does not move on archive or restore
        isShared:
          type: boolean
          description: Whether the owner’s share link for the thread is live — present once the thread has been shared or unshared in the app, absent on one that never was
        generating:
          type: boolean
        createdAt:
          type: integer
          minimum: 0
          description: Epoch milliseconds
        updatedAt:
          type: integer
          minimum: 0
          description: Epoch ms of the last message activity — archiving, restoring and renaming leave it untouched
    MessagePart:
      description: 'One ordered piece of a message, discriminated by `type`: the `mapping` names the schema each kind validates against (`TextPart` … `ApprovalPart`), so a discriminator-honouring validator resolves every part. The kinds listed are the vocabulary as of this version; the set is additive, so a client renders a kind it does not know as opaque.'
      discriminator:
        propertyName: type
        mapping:
          text: '#/components/schemas/TextPart'
          reasoning: '#/components/schemas/ReasoningPart'
          attachment: '#/components/schemas/AttachmentPart'
          tool-call: '#/components/schemas/ToolCallPart'
          tool-result: '#/components/schemas/ToolResultPart'
          approval: '#/components/schemas/ApprovalPart'
      oneOf:
      - $ref: '#/components/schemas/TextPart'
      - $ref: '#/components/schemas/ReasoningPart'
      - $ref: '#/components/schemas/AttachmentPart'
      - $ref: '#/components/schemas/ToolCallPart'
      - $ref: '#/components/schemas/ToolResultPart'
      - $ref: '#/components/schemas/ApprovalPart'
    ToolResultPart:
      type: object
      required:
      - type
      - callId
      - capabilityId
      - output
      - structured
      properties:
        type:
          type: string
          enum:
          - tool-result
        callId:
          type: string
        capabilityId:
          type: string
        output: {}
        structured:
          type: boolean
          description: False when the capability declares no output schema
    Message:
      type: object
      required:
      - id
      - role
      - parts
      - sequence
      - status
      - createdAt
      properties:
        id:
          type: string
        role:
          type: string
          enum:
          - user
          - assistant
        parts:
          type: array
          items:
            $ref: '#/components/schemas/MessagePart'
          description: The message parts, in order
        sequence:
          type: integer
          description: The paging key
        status:
          type: string
          enum:
          - pending
          - complete
          - failed
          - cancelled
          description: '`pending` is the placeholder a running turn fills in (the row GET …/generation names as messageId); `complete` is a settled reply — a reply the output cap cut short included, so read `finishReason` for that; `cancelled` is a turn stopped through DELETE …/generation — `parts` and `usage` hold what had streamed; `failed` carries `error`, and `usage` when the turn had consumed any.'
        finishReason:
          type: string
          enum:
          - stop
          - length
          - tool-calls
          - content-filter
          - cancelled
          - other
          description: 'Why the turn stopped, on a settled assistant message, in one vocabulary over every provider: `stop` (a natural end), `length` (the `maxOutputTokens` cap or the model’s own ceiling cut a round of this reply short — the final text, or, in a tool-calling turn, the tool calls of an earlier round: every call of that round is withheld, its tool-result reads `status: "invalid_args"` — the message saying whether its arguments were cut or complete — and the final text may be whole; the status still reads `complete`), `tool-calls` (the final round ended on tool calls), `content-filter` (the provider’s or the platform’s filter), `cancelled` (stopped through DELETE …/generation), `other` (a reason the provider named that has no bucket here). Absent when the provider reported none.'
        model:
          type: string
        providerSlug:
          type: string
        blockedReason:
          type: string
        error:
          type: string
          description: Why a failed turn produced no reply
        errorCode:
          type: string
          enum:
          - missing_api_key
          - credit_exhausted
          - model_not_entitled
          - auth_error
          - model_not_found
          - unsupported_parameter
          - output_cap_too_high
          - token_limit
          - rate_limited
          - content_filter
          - context_length
          - tool_failure
          - provider_unreachable
          - provider_error
          - thread_busy
          - budget_exceeded
          - generic
          description: Stable chat error classification when available. `credit_exhausted` and `model_not_entitled` mean the provider account, not the request; neither is `rate_limited`. `budget_exceeded` means a budget cap that binds the key holder was reached after the send was accepted, so the turn never ran; a send made once a cap is reached is refused up front with 429 `BUDGET_EXCEEDED`.
        usage:
          type: object
          additionalProperties: false
          description: The token counters the finished turn recorded and the catalog cost estimate stamped beside them; absent until the turn settles. A failed turn carries what it consumed — its finished model rounds and, if the provider had already accepted the request, the round that failed; a round the provider refused (an HTTP error status, or a refusal such as a rate limit reported before any answer or positive reported usage) adds nothing, so a turn refused on its first round carries none. Counts are the provider’s own unless `estimated` is present.
          properties:
            inputTokens:
              type: integer
              description: Prompt tokens — the assistant’s instructions and tool schemas included
            outputTokens:
              type: integer
              description: Reply tokens, the reasoning share included
            cachedInputTokens:
              type: integer
              description: The share of `inputTokens` the provider served from its prompt cache
            reasoningTokens:
              type: integer
              description: The share of `outputTokens` spent thinking before the reply — absent when the provider reported no count (a `0` is a reported zero)
            costEstimateCents:
              type: number
              minimum: 0
              description: The turn’s cost in US cents (fractional) from the catalog price the organization ledger also books — the same figure as the ledger; absent when the catalog publishes no price for the model. Cached input is priced at the input rate, so on a cached turn the figure is an upper bound; estimated when the provider’s count was lost (`estimated`).
            estimated:
              type: boolean
              enum:
              - true
              description: Present when the counts are the platform’s own estimate — the provider’s usage frame was lost (a cancelled turn, or one that failed mid-stream, typically) or never sent — so the cost is an estimate too
            stepLimitHit:
              type: boolean
              enum:
              - true
              description: Present when the tool loop spent its whole round budget and the final round had tools withheld — the answer may have been forced
        createdAt:
          type: integer
          minimum: 0
          description: Epoch ms — when the row was created (for an assistant row, when its turn started)
    TextPart:
      type: object
      required:
      - type
      - text
      properties:
        type:
          type: string
          enum:
          - text
        text:
          type: string
  headers:
    XTaleApiVersion:
      description: The version of this contract (`info.version`) the serving instance implements — semver for the wire
      schema:
        type: string
        example: 3.27.0
    Location:
      description: The created resource’s own path, relative to the request URL — follow it with GET whatever shape the 201 body has
      schema:
        type: string
    Allow:
      description: The methods this path serves, comma-separated
      schema:
        type: string
        example: GET, POST, HEAD, OPTIONS
    RetryAfter:
      description: How long to wait before retrying, in whole seconds
      schema:
        type: integer
        minimum: 1
    WWWAuthenticate:
      description: 'The challenge RFC 9110 §11.6.1 requires of a 401: `Bearer`, or `Bearer error="invalid_token"` when a key was presented and refused'
      schema:
        type: string
    ETag:
      description: 'A validator: over the answer’s bytes on a JSON read, the stored object’s tag on a download. Send it back as `If-None-Match` — as received; the weak and edge-suffixed forms match too — to be told 304 when nothing changed.'
      schema:
        type: string
    CacheControl:
      description: '`private, no-cache` on a validated read and on a download: keep the answer, revalidate it before reuse, and let no shared cache keep it. Every other answer says `no-store`.'
      schema:
        type: string
    XRequestId:
      description: The request id the platform logged this call under — quote it when reporting a problem. Echoes a sane `X-Request-Id` the caller sent.
      schema:
        type: string
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: An organization API key. Create one in Settings → API. Pasted into the explorer on /docs it stays in the page’s memory only and is forgotten on reload — it is never stored.
