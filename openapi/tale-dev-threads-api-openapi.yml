  /api/v1/threads/{id}/messages:
    get:
      tags:
      - Threads
      summary: Read a thread’s messages
      description: Only the key holder’s threads without a project. Project threads are available through their project URL. Messages are in sequence order — oldest first, or newest first with `order=desc`, so the reply a turn just produced is on the first page of a long thread; use the previous continueCursor as cursor for the next page (a cursor is bound to the direction it was minted in). While a turn runs, its assistant row is already on the page with status `pending` and empty parts — the row GET /api/v1/threads/{id}/generation names as messageId — and is filled in when the turn settles; the page is complete without that row being final. One message is also readable by id at GET /api/v1/threads/{id}/messages/{messageId}.
      operationId: listMessages
      security:
      - bearerAuth: []
      parameters:
      - name: X-Organization-Slug
        in: header
        required: false
        schema:
          type: string
        description: The organization to operate on. STRICTLY REQUIRED on every call, reads included, when the key holder belongs to more than one organization — without it such requests are refused with 400 `ORG_SLUG_REQUIRED` (the dashboard’s last-active organization never steers a machine call). A slug that names no organization answers 404 `ORG_SLUG_INVALID`, one the key holder is no member of 403 `ORG_FORBIDDEN`. Single-organization keys may omit it; a blank or whitespace-only value reads as the header absent. Each of the three refusals lists the slugs the key holder may send under `data.organizations`; `GET /api/v1/me` answers them too.
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: Thread ID
      - name: cursor
        in: query
        required: false
        schema:
          type: string
        description: The previous page’s `continueCursor`, unchanged — opaque; omit for the first page. A value this list did not answer is refused with 400 `INVALID_CURSOR` rather than read as the first page
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 25
        description: Page size, 1..100 (default 25; out-of-range numbers are clamped, a value that is not a number answers 400 `INVALID_LIMIT`)
      - name: order
        in: query
        required: false
        schema:
          type: string
          enum:
          - asc
          - desc
          default: asc
        description: 'The walk’s direction: `asc` (the default) pages oldest first from sequence 0, `desc` pages newest first — the settled reply of the latest turn leads the first page. A `cursor` minted walking one direction is refused with 400 `INVALID_CURSOR` on the other'
      - name: X-Request-Id
        in: header
        required: false
        description: 'Your own correlation id, echoed back on the response and written to the platform’s log: up to 255 characters of letters, digits, `_`, `-` and `=`. Any other value is replaced by a fresh UUID (the response carries the id that was used), and uniqueness of an id you choose is yours to keep.'
        schema:
          type: string
          pattern: ^[A-Za-z0-9_=-]{1,255}$
      responses:
        '200':
          description: Paginated messages
          content:
            application/json:
              schema:
                type: object
                x-tale-pagination: keyset
                required:
                - page
                - isDone
                - continueCursor
                properties:
                  page:
                    type: array
                    items:
                      $ref: '#/components/schemas/Message'
                  isDone:
                    type: boolean
                  continueCursor:
                    type: string
                    description: Pass back as `cursor` for the next page; empty when `isDone`
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            X-Tale-Api-Version:
              $ref: '#/components/headers/XTaleApiVersion'
        '304':
          description: Not Modified — `If-None-Match` named the current `ETag`, so the body is not sent
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            X-Tale-Api-Version:
              $ref: '#/components/headers/XTaleApiVersion'
        '400':
          description: 'Invalid request: a body the schema refuses — a wrong type, an unknown key, a missing field, a NUL or an unpaired surrogate, a whole number beyond 2^53 − 1 (`INVALID_BODY`, every problem under `data.issues`); a query parameter the operation does not take, given twice or left blank (`INVALID_QUERY`); on a list, a `limit` that is not a whole number (`INVALID_LIMIT`) or a `cursor` this list did not answer (`INVALID_CURSOR`)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            X-Tale-Api-Version:
              $ref: '#/components/headers/XTaleApiVersion'
        '401':
