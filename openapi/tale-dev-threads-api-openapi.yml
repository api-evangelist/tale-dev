      summary: Cancel the running turn
      description: 'Only the key holder’s threads without a project. Project threads are available through their project URL. Asks the running turn to stop — the app’s own stop: the turn reads the flag at its next progress write and settles what it has. 202 means the stop is requested, not done; poll until idle. A send still queued (no worker has opened it) is stopped the same way: 202 naming the reply the send’s 202 promised, the model is never called, and that reply settles as `cancelled` with empty `parts`. Nothing running and nothing queued answers 404 `CHAT_TURN_NOT_RUNNING` with `data.lastMessageId` and `data.lastStatus` — the idle poll’s answer, so a stop that lost the race against a fast model needs no second call.'
