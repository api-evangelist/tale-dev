    post:
      tags:
      - Threads
      summary: Send a message and start a turn
      description: 'Only the key holder’s threads without a project. Project threads are available through their project URL. Answers 202 while the turn runs in the background; the 202 names the assistant message the reply lands in (`messageId`). Poll GET /api/v1/threads/{id}/generation until status is idle, then read the messages. Send `Idempotency-Key` to make the send safe to retry: a repeat within 24 hours answers what the first attempt answered — the same `messageId` — with `duplicate: true` and queues nothing, and a repeat with a different body answers 409 `IDEMPOTENCY_KEY_REUSED`; a refused send remembers nothing. Every turn runs the built-in workspace assistant: its instructions, safety rules and three retrieval tools ride every request (about 3,000 prompt tokens per model round, counted in `usage.inputTokens` — a turn that calls a tool runs up to five rounds, each billing its full prompt again), and a request for a deliverable is redirected to Tasks by design — this is a conversation with the workspace, not a bare model call. A budget cap that binds the key holder — their own, one of their teams’, the conversation’s project’s, the organization’s or this API key’s — refuses the send with 429 `BUDGET_EXCEEDED` before anything is queued; a cap reached while an accepted send waited settles its `messageId` as failed with errorCode `budget_exceeded`. A turn failure appears as an assistant error message. Charges the execute bucket on top of the general REST bucket.'
      operationId: postMessage
      security:
      - bearerAuth: []
      parameters:
      - name: X-Organization-Slug
        in: header
        required: false
        schema:
          type: string
        description: The organization to operate on. STRICTLY REQUIRED on every call, reads included, when the key holder belongs to more than one organization — without it such requests are refused with 400 `ORG_SLUG_REQUIRED` (the dashboard’s last-active organization never steers a machine call). A slug that names no organization answers 404 `ORG_SLUG_INVALID`, one the key holder is no member of 403 `ORG_FORBIDDEN`. Single-organization keys may omit it; a blank or whitespace-only value reads as the header absent. Each of the three refusals lists the slugs the key holder may send under `data.organizations`; `GET /api/v1/me` answers them too.
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: Thread ID
      - name: Idempotency-Key
        in: header
        required: false
        schema:
          type: string
          pattern: ^[ -~]*[!-~][ -~]*$
          maxLength: 255
        description: 'A stable key of your choosing that names this send — printable ASCII (a UUID, a job id), at most 255 characters: any other character answers 400 `INVALID_HEADER`, naming the header under `data.issues`, and no send happens — keys are compared byte for byte once surrounding whitespace is removed, so the pattern is what keeps two spellings of one key from naming two sends; a header value carrying a control character never reaches the platform, the edge refuses the request before any envelope. A repeat with the same key, thread and scope within 24 hours answers 202 with what the first attempt answered — the same `messageId` to poll for, nothing new queued and `duplicate: true`; a repeat with a different body answers 409 `IDEMPOTENCY_KEY_REUSED`. A refused send is not remembered, so the same key runs once the refusal is fixed. A header sent but left blank (spaces only), or one over 255 characters, answers 400 `INVALID_HEADER` and starts nothing — omit the header to proceed without a key; it is never silently read as "no key".'
      - name: X-Request-Id
        in: header
        required: false
        description: 'Your own correlation id, echoed back on the response and written to the platform’s log: up to 255 characters of letters, digits, `_`, `-` and `=`. Any other value is replaced by a fresh UUID (the response carries the id that was used), and uniqueness of an id you choose is yours to keep.'
        schema:
          type: string
          pattern: ^[A-Za-z0-9_=-]{1,255}$
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - content
              - model
              properties:
                content:
                  type: string
                  minLength: 1
                  maxLength: 100000
                  description: 'The prompt, trimmed before the length check — a blank prompt (nothing but whitespace and invisible format characters: zero-width spaces, joiners, bidi marks) is 400 `INVALID_BODY`, not a turn; markdown that renders as nothing, an empty code fence say, is still a prompt. The 100,000 cap counts UTF-16 code units, so an astral character — an emoji — costs two, and a body of 50,001 of them is refused. Text only: this surface takes no image or file input, on a `vision` model too — a data URI or base64 pasted here reaches the model as text and is answered as text; image attachments are the app’s composer.'
                model:
                  type: string
                  minLength: 1
                  maxLength: 200
                  description: 'Model ID from GET /api/v1/models; never auto-selected. Checked at the door: without `providerSlug`, an id the list does not carry answers 400 `CHAT_MODEL_UNKNOWN` (and an id listed under several providers `CHAT_MODEL_AMBIGUOUS`); with a `providerSlug` the pair is judged instead — an unknown provider answers `CHAT_PROVIDER_UNKNOWN`, a listed provider that does not serve the id `CHAT_MODEL_NOT_ON_PROVIDER`.'
                providerSlug:
                  type: string
                  minLength: 1
                  maxLength: 200
                  description: 'Provider slug returned with the model. Checked against GET /api/v1/models: a slug the list does not carry answers 400 `CHAT_PROVIDER_UNKNOWN`, one that does not serve the model 400 `CHAT_MODEL_NOT_ON_PROVIDER` — never a silent fallback to another provider. Optional when exactly one listed provider serves the model; a model listed under several providers answers 400 `CHAT_MODEL_AMBIGUOUS` with `data.providers` until one is named. The 202 names the provider the turn runs on either way.'
                reasoningEffort:
                  type: string
                  enum:
                  - low
                  - medium
                  - high
                  - extra
                  - max
                  description: The reasoning depth, on the same five-step scale the app offers; omitted samples the model’s default. Ignored by a model whose `capabilities.reasoning` is false. A higher step spends more of the cap and of the bill — reasoning tokens count inside `maxOutputTokens` and inside `usage.outputTokens` at the output price — and at `high` or above a slower model can think for a minute or more before any answer; a turn has no fixed deadline, so bound your poll loop.
                maxOutputTokens:
                  type: integer
                  minimum: 1
                  description: 'The largest reply this turn may produce across every model round, in tokens — a cap under the model’s own `maxOutputTokens` from GET /api/v1/models; a value above it answers 400 `INVALID_BODY`. Omitted, the model’s own ceiling applies. A tool-calling turn spends the cap round by round: a later round gets what the earlier ones left, and a round that would start with nothing left is not run. A reasoning model spends its reasoning inside the cap too, and the catalog does not say how much: a cap of a few thousand tokens can be consumed by the reasoning alone and settle an EMPTY reply — `complete`, `finishReason: "length"`, no text part, billed, the reasoning tokens counted inside `usage.outputTokens` at the output price — so give a reasoning model several thousand tokens or lower `reasoningEffort`. The one floor is the thinking-budget dialect (Anthropic-style extended thinking): there a cap under 2,048 is raised to 2,048; a model whose reasoning is set by an effort level (the GLM and DeepSeek families) has no floor and the cap bites exactly. A reply that runs into the cap still settles `complete`, cut short, and says so with `finishReason: "length"` on the message — a cut that fell on an earlier round’s tool calls included: every call of that round is withheld — it does not run and its tool-result reads `status: "invalid_args"`, the message saying whether its arguments were cut or complete.'
                locale:
                  type: string
                  minLength: 2
                  maxLength: 20
                  pattern: ^[A-Za-z]{2,3}(?:-[A-Za-z0-9]{2,8})*$
                  description: A BCP 47 language tag (`de`, `en-GB`) — the language the assistant is asked to answer in, whatever language the prompt is written in. The instruction rides the prompt as a directive, on the system prompt and on the message itself; a model may still slip (most often a reasoning model on a short prompt), and nothing on the wire marks a slip — a client that must have the language checks the reply and resends. An organization’s mandatory instructions win over `locale`. Omitted, the assistant answers in the prompt’s language.
      responses:
        '202':
          description: Turn accepted, or the send an earlier attempt under the same `Idempotency-Key` accepted
          content:
            application/json:
              schema:
                type: object
                required:
                - threadId
                - status
                - model
                - providerSlug
                - messageId
                - poll
                properties:
                  duplicate:
                    type: boolean
                    enum:
                    - true
                    description: 'Present when the `Idempotency-Key` had already accepted this send: nothing new was queued — poll for the `messageId` it names'
                  threadId:
                    type: string
                  status:
                    type: string
                    enum:
                    - accepted
                  model:
                    type: string
                  providerSlug:
                    type: string
                    description: The provider the turn runs on — named in the request, or resolved from the model list
                  messageId:
                    type: string
                    description: 'The assistant message the reply lands in — the row GET …/messages carries as `pending` until the turn settles. Keep it: a caller that loses this response finds its reply by this id.'
                  poll:
                    type: string
                    description: Poll URL under /api/v1/threads/{id}/generation
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            X-Tale-Api-Version:
              $ref: '#/components/headers/XTaleApiVersion'
        '400':
          description: Invalid body (`INVALID_BODY`), a model the list does not carry (`CHAT_MODEL_UNKNOWN`), a model listed under several providers with none named (`CHAT_MODEL_AMBIGUOUS`), an unknown providerSlug (`CHAT_PROVIDER_UNKNOWN`), or a provider that does not serve the model (`CHAT_MODEL_NOT_ON_PROVIDER`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            X-Tale-Api-Version:
              $ref: '#/components/headers/XTaleApiVersion'
        '401':
          description: Missing or invalid API key (`UNAUTHORIZED`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            X-Tale-Api-Version:
              $ref: '#/components/headers/XTaleApiVersion'
            WWW-Authenticate:
              $ref: '#/components/headers/WWWAuthenticate'
        '403':
          description: '`X-Organization-Slug` names an organization the key holder is no member of (`ORG_FORBIDDEN`, with the slugs the key holder may send under `data.organizations`)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            X-Tale-Api-Version:
              $ref: '#/components/headers/XTaleApiVersion'
        '404':
          description: Thread missing, owned by another user, or outside the visible URL scope; or `X-Organization-Slug` names no organization (`ORG_SLUG_INVALID`, with the slugs the key holder may send under `data.organizations`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            X-Tale-Api-Version:
              $ref: '#/components/headers/XTaleApiVersion'
        '405':
          description: The path exists, but not for this method (`METHOD_NOT_ALLOWED`); `Allow` names the methods it serves
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            X-Tale-Api-Version:
              $ref: '#/components/headers/XTaleApiVersion'
            Allow:
              $ref: '#/components/headers/Allow'
        '409':
          description: The thread is archived (`CHAT_THREAD_ARCHIVED`) or not a direct chat (`CHAT_THREAD_NOT_DIRECT`), a turn is already running or still queued (`CHAT_TURN_IN_PROGRESS`) — nothing is queued and the running turn keeps its `messageId` — or the `Idempotency-Key` was already used for a different request (`IDEMPOTENCY_KEY_REUSED`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            X-Tale-Api-Version:
              $ref: '#/components/headers/XTaleApiVersion'
        '413':
          description: The body exceeds this operation’s byte cap — 1 MiB unless the description says otherwise (`BODY_TOO_LARGE`); the envelope carries a `requestId`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            X-Tale-Api-Version:
              $ref: '#/components/headers/XTaleApiVersion'
        '429':
          description: 'The key holder’s request budget is spent (`RATE_LIMITED`): `Retry-After` names the wait in whole seconds and `data.retryAfterMs` in milliseconds; the envelope carries a `requestId`; or a budget cap that binds the key holder is reached (`BUDGET_EXCEEDED`): nothing is queued, `data` names the cap — `scope`, `period`, `limitCode`, `used`, `limit`, `resetsAt` — and `Retry-After` the wait in whole seconds until its period resets'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            X-Tale-Api-Version:
              $ref: '#/components/headers/XTaleApiVersion'
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
        '500':
          description: Internal error (`INTERNAL_ERROR`); the envelope carries a `requestId` to quote when reporting it
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            X-Tale-Api-Version:
              $ref: '#/components/headers/XTaleApiVersion'
        '503':
          description: 'The platform’s database is restarting or cannot be reached (`DATABASE_UNAVAILABLE`): `Retry-After` names the wait in whole seconds — retry with backoff; the envelope carries a `requestId`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            X-Tale-Api-Version:
              $ref: '#/components/headers/XTaleApiVersion'
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
