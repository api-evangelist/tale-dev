    patch:
      tags:
      - Documents
      summary: Update document
      description: Partial update; a `null` clears an optional field. Requires a documents-write role. Only Knowledge Hub documents are accepted; project files return 404. A controlled record under review, approval or legal hold refuses the change. Send `expectedUpdatedAt` — the `updatedAt` last read — to refuse a write over a concurrent edit. Answers 200 with the document as it now stands, so the next write has its `updatedAt`. `metadata` MERGES per RFC 7396 — sent keys are set, omitted keys stay, a key sent as `null` is removed, the whole field sent as `null` clears it. A patch that changes nothing — an empty body, or every field already at its value — writes nothing and leaves `updatedAt` alone, so it never spends another client’s `expectedUpdatedAt`. A document that backs an active knowledge entry keeps its title, content, MIME type and extension through the entry (update the entry instead); a folder, team or metadata change goes through. The body may run to 32 MiB — this operation’s own cap, sized for the 5,000,000-character inline `content`; past it the answer is 413 `BODY_TOO_LARGE`.
      operationId: updateDocument
      security:
      - bearerAuth: []
      parameters:
      - name: X-Organization-Slug
        in: header
        required: false
        schema:
          type: string
        description: The organization to operate on. STRICTLY REQUIRED on every call, reads included, when the key holder belongs to more than one organization — without it such requests are refused with 400 `ORG_SLUG_REQUIRED` (the dashboard’s last-active organization never steers a machine call). A slug that names no organization answers 404 `ORG_SLUG_INVALID`, one the key holder is no member of 403 `ORG_FORBIDDEN`. Single-organization keys may omit it; a blank or whitespace-only value reads as the header absent. Each of the three refusals lists the slugs the key holder may send under `data.organizations`; `GET /api/v1/me` answers them too.
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: Document ID
      - name: If-Match
        in: header
        required: false
        schema:
          type: string
        description: 'The `ETag` you last read from `GET /api/v1/documents/{id}` — strong comparison, so a `W/` tag never matches — or `*`: the update applies only while the document’s current representation still carries that tag; otherwise 412 `PRECONDITION_FAILED`, `data.etag` naming the current tag, nothing written. The tag covers the whole read, `indexing` included, so a document mid-index answers 412 until it settles; `expectedUpdatedAt` in the body remains the row-level precondition (409 `DOCUMENT_STALE`). Absent, the header is not evaluated.'
      - name: X-Request-Id
        in: header
        required: false
        description: 'Your own correlation id, echoed back on the response and written to the platform’s log: up to 255 characters of letters, digits, `_`, `-` and `=`. Any other value is replaced by a fresh UUID (the response carries the id that was used), and uniqueness of an id you choose is yours to keep.'
        schema:
          type: string
          pattern: ^[A-Za-z0-9_=-]{1,255}$
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DocumentPatch'
      responses:
        '200':
          description: The document as it now stands — the shape `GET` answers, `updatedAt` included — with the `ETag` of that representation, the value the next `If-Match` sends
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            X-Tale-Api-Version:
