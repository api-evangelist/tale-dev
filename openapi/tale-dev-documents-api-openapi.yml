          type: array
          items:
            type: string
          description: 'The audience: the teams that may read the document, by id; empty = organization-wide. Owners and admins read every team library regardless.'
        teamId:
          type:
          - string
          - 'null'
          deprecated: true
          description: The first team of `teamIds`, or null — the pre-1.17.0 single-team spelling; read `teamIds`
        folderId:
          type:
          - string
          - 'null'
        metadata:
          type:
          - object
          - 'null'
          additionalProperties: true
        contentHash:
          type:
          - string
          - 'null'
