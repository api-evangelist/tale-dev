        createdBy:
          type: string
        createdAt:
          type: integer
          minimum: 0
          description: Epoch milliseconds
        updatedAt:
          type: integer
          minimum: 0
          description: Epoch milliseconds
        indexing:
          type: object
          required:
          - status
          additionalProperties: false
          description: Where a file-backed document stands in the search corpus — absent for a content-only document (never indexed) and for a blob the platform does not track. Poll it after a create or a `retry-indexing`.
          properties:
            status:
              type: string
              enum:
              - pending
              - queued
              - running
              - completed
              - failed
              - unsupported
              - skipped
              description: '`pending` — never queued; `skipped` — the file opts out of indexing; `unsupported` — TERMINAL: the platform cannot index these bytes and a retry reproduces the answer, `errorCode` says why (`unsupported_type`, `image_no_vision`, `empty`, `not_text`, `malformed`); `failed` — see `error` / `errorCode`: the job retries `embedding_upstream`, `indexer_error` and `index_rebuilding` by itself, `usage_limit` resumes by itself once the usage limit allows it, the rest wait for an admin (a provider account, the organization’s policy) and a `retry-indexing`; a `failed` with no `errorCode` is a failure the platform settled without classifying it, usually an indexing run that stopped before it finished (a lost job, a stopped worker) — request a `retry-indexing` rather than wait for one'
            indexedAt:
              type: integer
              minimum: 0
              description: Epoch ms of the last completed indexing
            error:
              type: string
              description: A sentence for a person, present with `failed` and `unsupported`; never a storage-engine diagnostic — the raw cause stays in the platform log.
            errorCode:
              type: string
              enum:
              - unsupported_type
              - image_no_vision
              - empty
              - not_text
              - malformed
              - secret_detected
              - pii_blocked
              - embedding_not_configured
              - embedding_provider_refused
              - embedding_upstream
              - index_rebuilding
              - index_repair_failed
              - usage_limit
              - indexer_error
              description: 'The stable cause to branch on, present with `unsupported`, and with `failed` whenever the platform classified the cause — a `failed` without one was settled unclassified, usually after its indexing run stopped before it finished; request a `retry-indexing` for it. Terminal (`unsupported`): `unsupported_type` — no extractor for the type; `image_no_vision` — an image and no OCR lane; `empty` — no text to index; `not_text` — binary bytes behind a text extension, re-export as UTF-8; `malformed` — the bytes do not parse as the format the extension claims. Retried by the job (`failed`): `embedding_upstream` — the provider was unreachable, rate-limited or 5xx; `indexer_error` — a platform-side store fault; `index_rebuilding` — the search index is being rebuilt. Waits for a usage limit (`failed`): `usage_limit` — a limit that binds whoever the file is indexed for (its uploader, a synced drive’s owner, the organization for an emailed attachment) has too little room for its embeddings; indexing resumes by itself within the hour after the limit resets or is raised, after what it already embedded. Waits for an admin (`failed`): `embedding_not_configured`, `embedding_provider_refused` (the provider refused the account or credential, the model answers vectors of another width than the settings state, or the platform cannot use the embedding credential — none configured, deleted, disabled or unreadable), `index_repair_failed`, `secret_detected`, `pii_blocked`. Saving corrected embedding settings, or adding or repairing the credential the embedding model uses, re-queues every document that failed on the embedding model.'
    DocumentInput:
      type: object
      additionalProperties: false
      required:
      - title
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 512
        content:
          type: string
          maxLength: 5000000
        fileId:
          type: string
          maxLength: 2048
          description: The metadata ID of the key holder’s own unbound upload in this organization
        mimeType:
          type: string
          maxLength: 255
        extension:
          type: string
          maxLength: 32
        sourceProvider:
          type: string
          maxLength: 64
        metadata:
          type: object
          additionalProperties: true
          maxProperties: 500
          description: Free-form. At most 64 KiB of JSON, 8 levels of nesting and 500 keys in total (every nested object counted); a larger value answers 400 `INVALID_BODY` naming the path.
        teamIds:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 128
          maxItems: 64
          description: 'The audience: teams of this organization the key holder may assign (their own, unless they are an admin — `TEAM_ACCESS_DENIED`; an id that is not the organization’s is `TEAM_NOT_IN_ORG`). Omitted or empty = organization-wide. Inside a team folder the folder’s audience applies; naming a team outside it is `TEAM_INHERITED_FROM_FOLDER`.'
        teamId:
          type: string
          maxLength: 128
          description: The single-team spelling of `teamIds` (still accepted)
        folderId:
          type: string
          maxLength: 64
    RetryIndexingResult:
      type: object
      required:
      - status
      description: What a retry-indexing request did — the one answer the Hub document door and the project-file door share.
      properties:
        status:
          type: string
          enum:
          - indexing
          - skipped
          description: '`indexing` — the blob was queued (an opt-out lifted); `skipped` — nothing was queued, `reason` says why'
        reason:
          type: string
          enum:
          - content-only
          - untracked-blob
          - unsupported
          - in-progress
          description: 'Why indexing was skipped; absent when `status` is `indexing`. `content-only`: inline text never enters the search corpus (a Hub document without a file — never a project file); `untracked-blob`: the platform does not track the blob; `unsupported`: terminal — the platform cannot index these bytes and a retry reproduces the answer; the row’s `indexing.errorCode` names the cause (`unsupported_type`, `image_no_vision`, `empty`, `not_text`, `malformed`); `in-progress`: a fresh index job is already queued or running — poll `indexing` instead.'
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: An organization API key. Create one in Settings → API. Pasted into the explorer on /docs it stays in the page’s memory only and is forgotten on reload — it is never stored.
