  /api/v1/projects/{id}/runs/{runId}/asks/{askId}:
    post:
      tags:
      - Runs
      summary: Answer the question a run is waiting on
      description: 'The run must belong to the URL project, and the key holder must have project read access. Requires write access to an active project. Records the answer and resumes the run in the same transaction, then mirrors the answer onto the task timeline as the answerer’s own comment when the run works on a task. The agent asked a person, so the record names one: send `actor` to answer FOR a verified member (the caller then needs `capabilities.actAs` from `/me` — 403 `ROLE_FORBIDDEN` without it; the member is resolved by e-mail, see `Actor`), or send none to answer as the key (`answeredBy: "api-key:"`). A question already answered or closed answers 409 `HUMAN_ASK_NOT_PENDING`, one past its deadline 409 `HUMAN_ASK_EXPIRED` (the run then fails with `failureCode: "ask_expired"`), one this run did not ask 404 `HUMAN_ASK_NOT_FOUND`. Charges the execute bucket on top of the general REST bucket.'
      operationId: answerProjectRunAsk
      security:
      - bearerAuth: []
      parameters:
      - name: X-Organization-Slug
        in: header
        required: false
        schema:
          type: string
        description: The organization to operate on. STRICTLY REQUIRED on every call, reads included, when the key holder belongs to more than one organization — without it such requests are refused with 400 `ORG_SLUG_REQUIRED` (the dashboard’s last-active organization never steers a machine call). A slug that names no organization answers 404 `ORG_SLUG_INVALID`, one the key holder is no member of 403 `ORG_FORBIDDEN`. Single-organization keys may omit it; a blank or whitespace-only value reads as the header absent. Each of the three refusals lists the slugs the key holder may send under `data.organizations`; `GET /api/v1/me` answers them too.
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: Project ID
      - name: runId
        in: path
        required: true
        schema:
          type: string
        description: Run ID returned by a start request
      - name: askId
        in: path
        required: true
        schema:
          type: string
        description: The question’s `askId`, as `GET …/ask` named it
      - name: X-Request-Id
        in: header
        required: false
        description: 'Your own correlation id, echoed back on the response and written to the platform’s log: up to 255 characters of letters, digits, `_`, `-` and `=`. Any other value is replaced by a fresh UUID (the response carries the id that was used), and uniqueness of an id you choose is yours to keep.'
        schema:
          type: string
          pattern: ^[A-Za-z0-9_=-]{1,255}$
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - answer
              properties:
                answer:
                  type: string
                  minLength: 1
                  maxLength: 20000
                  description: 'The answer as the agent reads it. For a `questions` set, one line per question in the form the app sends: `<question> → <picked label>; <typed text> (in their own words)`'
                actor:
                  $ref: '#/components/schemas/Actor'
      responses:
        '200':
          description: The answer was recorded and the run resumes
          content:
            application/json:
              schema:
                type: object
                required:
                - ok
                - askId
                - runId
                - answeredBy
                - taskId
                properties:
                  ok:
                    type: boolean
                    enum:
                    - true
                  askId:
                    type: string
                  runId:
                    type: string
                  answeredBy:
                    type: string
                    description: 'What `answered_by` records: the actor’s user id, or `api-key:<userId>` when the key answered as itself'
                  actorUserId:
                    type: string
                    description: 'Present when `actor` was sent: the member the e-mail resolved to — pin it as `actor.userId` on later calls so a reassigned address refuses instead of acting as its new holder'
                  taskId:
                    type:
                    - string
                    - 'null'
                    description: The task the run works on, whose timeline carries the answer as a comment; null for a run without a task
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            X-Tale-Api-Version:
              $ref: '#/components/headers/XTaleApiVersion'
        '400':
          description: 'Invalid request: a body the schema refuses — a wrong type, an unknown key, a missing field, a NUL or an unpaired surrogate, a whole number beyond 2^53 − 1 (`INVALID_BODY`, every problem under `data.issues`); a query parameter the operation does not take, given twice or left blank (`INVALID_QUERY`); on a list, a `limit` that is not a whole number (`INVALID_LIMIT`) or a `cursor` this list did not answer (`INVALID_CURSOR`); or an answer that is blank once trimmed (`EMPTY_ANSWER`)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            X-Tale-Api-Version:
              $ref: '#/components/headers/XTaleApiVersion'
        '401':
          description: Missing or invalid API key (`UNAUTHORIZED`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            X-Tale-Api-Version:
              $ref: '#/components/headers/XTaleApiVersion'
            WWW-Authenticate:
              $ref: '#/components/headers/WWWAuthenticate'
        '403':
          description: Project is read-only or archived; an `actor` sent without `capabilities.actAs` (`ROLE_FORBIDDEN`); an actor whose e-mail is unverified (`ACTOR_UNVERIFIED`), whose membership is disabled (`ACTOR_DISABLED`) or who may not see this project (`ACTOR_FORBIDDEN`); or `X-Organization-Slug` names an organization the key holder is no member of (`ORG_FORBIDDEN`, with the slugs the key holder may send under `data.organizations`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            X-Tale-Api-Version:
              $ref: '#/components/headers/XTaleApiVersion'
        '404':
          description: Run missing or outside the visible URL scope (`RUN_NOT_FOUND`); the question is not this run’s (`HUMAN_ASK_NOT_FOUND`); no member carries the actor’s e-mail (`ACTOR_NOT_FOUND`); or `X-Organization-Slug` names no organization (`ORG_SLUG_INVALID`, with the slugs the key holder may send under `data.organizations`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
