components:
  schemas:
    ConversationDelivery:
      type: object
      description: One native Inbox reply in a source’s delivery queue, as the listing shows it — never the claim token or the body
      required:
      - messageId
      - conversationId
      - externalId
      - status
      - attempts
      - availableAt
      - retryAt
      - claimedAt
      - failedAt
      - lastErrorCode
      - acknowledgedAt
      - receiptId
      additionalProperties: false
      properties:
        messageId:
          type: string
        conversationId:
          type: string
        externalId:
          type: string
        status:
          type: string
          enum:
          - queued
          - leased
          - failed
          - delivered
