openapi: 3.2.0
info:
  title: Tale Dev Conversations API
  version: 3.27.0
  contact:
    name: Tale
    url: https://tale.dev
  description: 'Operations tagged Conversations across 2 of this provider''s published API definitions: tale-dev-openapi-original.json, tale-dev-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: '{origin}'
  description: The deployment this document describes — `GET /openapi.json` on a running instance fills it in
  variables:
    origin:
      default: https://your-host.example.com
      description: Scheme and host of the Tale deployment
security:
- bearerAuth: []
tags:
- name: Conversations
  description: Mirroring external conversations into Inbox — versioned snapshots, reply claims, delivery receipts and staged uploads.
paths:
  /api/v1/conversations/sync:
    get:
      tags:
      - Conversations
      security:
      - bearerAuth: []
      parameters:
      - name: X-Organization-Slug
        in: header
        required: false
        schema:
          type: string
        description: The organization to operate on. STRICTLY REQUIRED on every call, reads included, when the key holder belongs to more than one organization — without it such requests are refused with 400 `ORG_SLUG_REQUIRED` (the dashboard’s last-active organization never steers a machine call). A slug that names no organization answers 404 `ORG_SLUG_INVALID`, one the key holder is no member of 403 `ORG_FORBIDDEN`. Single-organization keys may omit it; a blank or whitespace-only value reads as the header absent. Each of the three refusals lists the slugs the key holder may send under `data.organizations`; `GET /api/v1/me` answers them too.
      - name: source
        in: query
        required: true
        schema:
          type: string
          pattern: ^[a-z][a-z0-9_-]{0,59}$
        description: Stable source slug, e.g. vatplus
      - name: externalId
        in: query
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 256
        description: Stable source conversation ID
      - name: X-Request-Id
        in: header
        required: false
        description: 'Your own correlation id, echoed back on the response and written to the platform’s log: up to 255 characters of letters, digits, `_`, `-` and `=`. Any other value is replaced by a fresh UUID (the response carries the id that was used), and uniqueness of an id you choose is yours to keep.'
        schema:
          type: string
          pattern: ^[A-Za-z0-9_=-]{1,255}$
      operationId: getConversationSourceState
      summary: Read an integration snapshot receipt
      description: Returns the current source revision, the bound contact (`contactId`, the row; `externalContactId`, its current external id), its `contactStatus` (`active` | `trashed` | `missing`), whether the source tore the mirror down (`sourceDeleted`, with the Inbox `status`) and attachment refs for safe crash recovery — an engine that resumes reads `sourceDeleted` before pushing its next snapshot, because a content snapshot onto a torn-down mirror answers 409 `CONVERSATION_CLOSED` at any version. A `trashed` status means the contact was deleted and further content snapshots answer 409 `CONVERSATION_CONTACT_TRASHED` until it is restored (`POST /api/v1/contacts/{id}/restore`). `GET /api/v1/conversations?source=` lists every mirror. An unknown or differently owned source returns a null snapshot.
      responses:
        '200':
          description: Current source state
          content:
            application/json:
              schema:
                type: object
                required:
                - snapshot
                properties:
                  snapshot:
                    type:
                    - object
                    - 'null'
                    required:
                    - conversationId
                    - organizationId
                    - version
                    - externalContactId
                    - contactId
                    - contactStatus
                    - sourceDeleted
                    - status
                    - attachments
                    properties:
                      conversationId:
                        type: string
                      organizationId:
                        type: string
                      version:
                        type: integer
                      externalContactId:
                        type: string
                        description: 'The bound contact’s current `externalId`: the one named on first mirror, following a rename of that same contact (a PATCH of its `externalId`, or a snapshot naming the new id) — never re-resolved to a different row.'
                      contactId:
                        type:
                        - string
                        - 'null'
                        description: 'The bound contact row — `GET /api/v1/contacts/{id}` takes it; null when no contact row is linked (`contactStatus: "missing"`).'
                      contactStatus:
                        type: string
                        enum:
                        - active
                        - trashed
                        - missing
                        description: 'The linked contact’s state: `active`, `trashed` (a `DELETE /contacts/{id}` retired it — further content snapshots answer 409 `CONVERSATION_CONTACT_TRASHED` until it is restored with `POST /api/v1/contacts/{id}/restore` or in the app; a `deleted` teardown closes the mirror but does not lift the refusal), or `missing` (no contact row is linked).'
                      sourceDeleted:
                        type: boolean
                        description: 'The source tore the mirror down with a `deleted` snapshot: the Inbox thread is closed, keeps its messages, and a later content snapshot answers 409 `CONVERSATION_CLOSED` at any version — mirror the source conversation under a new `externalId` to start again. An engine that resumes from this receipt reads it before pushing its next snapshot; it is the one field that says a teardown landed.'
                      status:
                        type:
                        - string
                        - 'null'
                        description: 'The Inbox conversation’s status — `closed` once torn down; null only when the Inbox row itself is gone (`contactStatus: "missing"`).'
                      attachments:
                        type: array
                        items:
                          type: object
                          required:
                          - id
                          - storageId
                          properties:
                            id:
                              type: string
                            storageId:
                              type: string
                              description: Opaque — persist and echo it unchanged; its shape is not part of the contract
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            X-Tale-Api-Version:
              $ref: '#/components/headers/XTaleApiVersion'
        '304':
          description: Not Modified — `If-None-Match` named the current `ETag`, so the body is not sent
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            X-Tale-Api-Version:
              $ref: '#/components/headers/XTaleApiVersion'
        '400':
          description: 'Invalid request: a body the schema refuses — a wrong type, an unknown key, a missing field, a NUL or an unpaired surrogate, a whole number beyond 2^53 − 1 (`INVALID_BODY`, every problem under `data.issues`); a query parameter the operation does not take, given twice or left blank (`INVALID_QUERY`); on a list, a `limit` that is not a whole number (`INVALID_LIMIT`) or a `cursor` this list did not answer (`INVALID_CURSOR`)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            X-Tale-Api-Version:
              $ref: '#/components/headers/XTaleApiVersion'
        '401':
          description: Missing or invalid API key (`UNAUTHORIZED`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            X-Tale-Api-Version:
              $ref: '#/components/headers/XTaleApiVersion'
            WWW-Authenticate:
              $ref: '#/components/headers/WWWAuthenticate'
        '403':
          description: A read-only role (`ROLE_FORBIDDEN`); or `X-Organization-Slug` names an organization the key holder is no member of (`ORG_FORBIDDEN`, with the slugs the key holder may send under `data.organizations`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            X-Tale-Api-Version:
              $ref: '#/components/headers/XTaleApiVersion'
        '404':
          description: '`X-Organization-Slug` names no organization (`ORG_SLUG_INVALID`, with the slugs the key holder may send under `data.organizations`)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            X-Tale-Api-Version:
              $ref: '#/components/headers/XTaleApiVersion'
        '405':
          description: The path exists, but not for this method (`METHOD_NOT_ALLOWED`); `Allow` names the methods it serves
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            X-Tale-Api-Version:
              $ref: '#/components/headers/XTaleApiVersion'
            Allow:
              $ref: '#/components/headers/Allow'
        '429':
          description: 'The key holder’s request budget is spent (`RATE_LIMITED`): `Retry-After` names the wait in whole seconds and `data.retryAfterMs` in milliseconds; the envelope carries a `requestId`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            X-Tale-Api-Version:
              $ref: '#/components/headers/XTaleApiVersion'
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
        '500':
          description: Internal error (`INTERNAL_ERROR`); the envelope carries a `requestId` to quote when reporting it
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            X-Tale-Api-Version:
              $ref: '#/components/headers/XTaleApiVersion'
        '503':
          description: 'The platform’s database is restarting or cannot be reached (`DATABASE_UNAVAILABLE`): `Retry-After` names the wait in whole seconds — retry with backoff; the envelope carries a `requestId`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            X-Tale-Api-Version:
              $ref: '#/components/headers/XTaleApiVersion'
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
    post:
      tags:
      - Conversations
      security:
      - bearerAuth: []
      parameters:
      - name: X-Organization-Slug
        in: header
        required: false
        schema:
          type: string
        description: The organization to operate on. STRICTLY REQUIRED on every call, reads included, when the key holder belongs to more than one organization — without it such requests are refused with 400 `ORG_SLUG_REQUIRED` (the dashboard’s last-active organization never steers a machine call). A slug that names no organization answers 404 `ORG_SLUG_INVALID`, one the key holder is no member of 403 `ORG_FORBIDDEN`. Single-organization keys may omit it; a blank or whitespace-only value reads as the header absent. Each of the three refusals lists the slugs the key holder may send under `data.organizations`; `GET /api/v1/me` answers them too.
      - name: X-Request-Id
        in: header
        required: false
        description: 'Your own correlation id, echoed back on the response and written to the platform’s log: up to 255 characters of letters, digits, `_`, `-` and `=`. Any other value is replaced by a fresh UUID (the response carries the id that was used), and uniqueness of an id you choose is yours to keep.'
        schema:
          type: string
          pattern: ^[A-Za-z0-9_=-]{1,255}$
      operationId: synchronizeConversationSource
      summary: Apply a complete native Inbox source snapshot
      description: 'Creates an API-channel Inbox conversation linked to exactly one contact.externalId — a contact that must already exist: `externalContactId` names the `externalId` of a contact in this organization (create it through `POST /api/v1/contacts` first); an id no contact carries answers 404 `CONTACT_NOT_FOUND` and one that more than one contact carries 409 `CONTACT_AMBIGUOUS`, nothing applied. A snapshot never re-homes a conversation: it is bound to a contact ROW, so a contact re-keyed in the CRM (a PATCH of its `externalId`) keeps its conversations — a snapshot naming the contact’s current id applies and the receipt follows it — while an `externalContactId` that names a different contact, or no live one, answers 409 `CONVERSATION_CONTACT_CONFLICT` naming the id the conversation is bound to; deleting the contact and recreating it under the same `externalId` (a common CRM re-import) is a different row and never transfers the thread to the new person. A content snapshot for a conversation whose contact has been moved to the trash answers 409 `CONVERSATION_CONTACT_TRASHED` — restore the contact (`POST /api/v1/contacts/{id}/restore`) to continue it; a `deleted` teardown closes the mirror but does not reopen it, so a later content snapshot answers the same 409 while the contact stays in the trash; the `contactStatus` on the `GET` receipt reports this. Source + externalId is owned by the API key user; key rotation preserves ownership. A newer integer version replaces only source-receipted messages; an older version does nothing; the same version with different content returns 409. Message IDs must be unique. A message that began life as a native Inbox reply — one this integration claimed through the deliveries lane — carries `taleMessageId`, that reply’s `messageId`, and must have been acknowledged under its `externalId` first (409 `DELIVERY_UNACKNOWLEDGED` otherwise); a message without `taleMessageId` is the source’s own, whatever `isCustomer` says. Every attachment a message names must have been staged through `POST /api/v1/conversations/uploads` by this key user and still be within its window — one never staged, lapsed, malformed or another organization’s answers 400 `ATTACHMENT_NOT_STAGED`, another service user’s upload in this organization 403 `ATTACHMENT_NOT_OWNED` — at the declared `size` (400 `ATTACHMENT_SIZE_MISMATCH` when the landed bytes disagree) — nothing of the snapshot is applied on any of these refusals. `replyConstraints` bounds what a person’s Inbox reply to the conversation may carry — body length, attachment count, size and extensions — and is enforced when that reply is written, never against a snapshot. A deleted snapshot closes the source and has no messages: it is not content, so it applies at the stored version or any higher one (a source whose versions ran out can still tear its mirror down) and replays as a no-op once the source is torn down; the messages the source mirrored stay in the Inbox as the closed conversation’s record — a teardown never deletes them (`DELETE /api/v1/contacts/{id}` and the erasure lane are the deletion doors). A torn-down mirror stays down: a later content snapshot at any version answers 409 `CONVERSATION_CLOSED` (the receipt’s `sourceDeleted` says so) — mirror the source conversation under a new `externalId` to start again. Unacknowledged office replies are preserved. Unknown keys are refused. JSON is limited to 8 MiB.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                source:
                  type: string
                  pattern: ^[a-z][a-z0-9_-]{0,59}$
                externalId:
                  type: string
                  minLength: 1
                  maxLength: 256
                externalContactId:
                  type: string
                  minLength: 1
                  maxLength: 256
                  description: 'The `externalId` of an EXISTING contact in this organization — the snapshot links its conversation to that contact and never creates one: create the contact through `POST /api/v1/contacts` first. An id no contact carries answers 404 `CONTACT_NOT_FOUND`; one more than one contact carries 409 `CONTACT_AMBIGUOUS`. A trashed contact does not count.'
                version:
                  type: integer
                  minimum: 0
                  maximum: 9007199254740991
                subject:
                  type: string
                  minLength: 1
                  maxLength: 1000
                status:
                  type: string
                  enum:
                  - open
                  - closed
                deleted:
                  default: false
                  type: boolean
                replyConstraints:
                  default: {}
                  type: object
                  properties:
                    minBodyChars:
                      default: 1
                      type: integer
                      minimum: 0
                      maximum: 100
                    maxBodyChars:
                      default: 20000
                      type: integer
                      minimum: 1
                      maximum: 20000
                    maxAttachments:
                      default: 10
                      type: integer
                      minimum: 0
                      maximum: 10
                    maxAttachmentBytes:
                      default: 31457280
                      type: integer
                      minimum: 1
                      maximum: 31457280
                    attachmentExtensions:
                      maxItems: 100
                      type: array
                      items:
                        type: string
                        pattern: ^[a-z0-9]+$
                  additionalProperties: false
                  description: What a person’s Inbox reply to this conversation may carry — body length (`minBodyChars`, `maxBodyChars`), attachment count, size and file extensions. The Inbox enforces it when the reply is written and refuses one that breaks it; no snapshot is ever refused by it. Omitted, the defaults shown apply.
                messages:
                  maxItems: 200
                  type: array
                  items:
                    type: object
                    properties:
                      externalId:
                        type: string
                        minLength: 1
                        maxLength: 256
                      taleMessageId:
                        type: string
                        minLength: 1
                        maxLength: 256
                      content:
                        type: string
                        maxLength: 20000
                      format:
                        default: plain
                        type: string
                        enum:
                        - plain
                        - markdown
                      isCustomer:
                        type: boolean
                      authorName:
                        type: string
                        maxLength: 300
                      createdAt:
                        type: integer
                        minimum: 0
                        maximum: 8640000000000000
                      attachments:
                        default: []
                        maxItems: 10
                        type: array
                        items:
                          type: object
                          properties:
                            externalId:
                              type: string
                              minLength: 1
                              maxLength: 256
                            storageId:
                              type: string
                              minLength: 1
                              maxLength: 1024
                            fileName:
                              type: string
                              minLength: 1
                              maxLength: 300
                            contentType:
                              type: string
                              minLength: 1
                              maxLength: 255
                            size:
                              type: integer
                              minimum: 0
                              maximum: 31457280
                          required:
                          - storageId
                          - fileName
                          - contentType
                          - size
                          additionalProperties: false
                    required:
                    - externalId
                    - content
                    - isCustomer
                    - authorName
                    - createdAt
                    additionalProperties: false
              required:
              - source
              - externalId
              - externalContactId
              - version
              - subject
              - status
              - messages
              additionalProperties: false
      responses:
        '200':
          description: Applied or replayed snapshot
          content:
            application/json:
              schema:
                type: object
                required:
                - conversationId
                - applied
                properties:
                  conversationId:
                    type:
                    - string
                    - 'null'
                  applied:
                    type: boolean
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            X-Tale-Api-Version:
              $ref: '#/components/headers/XTaleApiVersion'
        '400':
          description: Invalid body (`INVALID_BODY`), an attachment never staged, whose window lapsed or whose `storageId` this door never handed out (`ATTACHMENT_NOT_STAGED`), or one whose declared size the landed bytes contradict (`ATTACHMENT_SIZE_MISMATCH`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            X-Tale-Api-Version:
              $ref: '#/components/headers/XTaleApiVersion'
        '401':
          description: Missing or invalid API key (`UNAUTHORIZED`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            X-Tale-Api-Version:
              $ref: '#/components/headers/XTaleApiVersion'
            WWW-Authenticate:
              $ref: '#/components/headers/WWWAuthenticate'
        '403':
          description: A read-only role (`ROLE_FORBIDDEN`), an integration another service user owns (`INTEGRATION_NOT_OWNED`), an attachment that is not this integration’s upload (`ATTACHMENT_NOT_OWNED`), or an unverified author (`AUTHOR_UNVERIFIED`); or `X-Organization-Slug` names an organization the key holder is no member of (`ORG_FORBIDDEN`, with the slugs the key holder may send under `data.organizations`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            X-Tale-Api-Version:
              $ref: '#/components/headers/XTaleApiVersion'
        '404':
          description: The contact `externalContactId` names does not exist (`CONTACT_NOT_FOUND`), no snapshot ever named the source (`CONVERSATION_SOURCE_NOT_FOUND`), or the delivery or attachment is absent (`DELIVERY_NOT_FOUND`, `ATTACHMENT_NOT_FOUND`); or `X-Organization-Slug` names no organization (`ORG_SLUG_INVALID`, with the slugs the key holder may send under `data.organizations`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            X-Tale-Api-Version:
              $ref: '#/components/headers/XTaleApiVersion'
        '405':
          description: The path exists, but not for this method (`METHOD_NOT_ALLOWED`); `Allow` names the methods it serves
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            X-Tale-Api-Version:
              $ref: '#/components/headers/XTaleApiVersion'
            Allow:
              $ref: '#/components/headers/Allow'
        '409':
          description: 'Conflicting identity, revision, or receipt: `CONVERSATION_SNAPSHOT_CONFLICT`, `CONVERSATION_CONTACT_CONFLICT`, `CONVERSATION_CONTACT_TRASHED` (the linked contact is in the trash — restore it or send a `deleted` teardown), `CONTACT_AMBIGUOUS`, `DELIVERY_UNACKNOWLEDGED`, `DELIVERY_RECEIPT_CONFLICT`, `DELIVERY_RETRY_UNAVAILABLE`, `CONVERSATION_CLOSED` (the source tore the mirror down — a content snapshot onto it, or an Inbox reply to it)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            X-Tale-Api-Version:
              $ref: '#/components/headers/XTaleApiVersion'
        '413':
          description: The body exceeds 8 MiB — this operation’s own cap, above the door’s 1 MiB default, sized for a whole source snapshot (`BODY_TOO_LARGE`); the envelope carries a `requestId`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            X-Tale-Api-Version:
              $ref: '#/components/headers/XTaleApiVersion'
        '429':
          description: 'The key holder’s request budget is spent (`RATE_LIMITED`): `Retry-After` names the wait in whole seconds and `data.retryAfterMs` in milliseconds; the envelope carries a `requestId`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            X-Tale-Api-Version:
              $ref: '#/components/headers/XTaleApiVersion'
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
        '500':
          description: Internal error (`INTERNAL_ERROR`); the envelope carries a `requestId` to quote when reporting it
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            X-Tale-Api-Version:
              $ref: '#/components/headers/XTaleApiVersion'
        '503':
          description: 'The platform’s database is restarting or cannot be reached (`DATABASE_UNAVAILABLE`): `Retry-After` names the wait in whole seconds — retry with backoff; the envelope carries a `requestId`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            X-Tale-Api-Version:
              $ref: '#/components/headers/XTaleApiVersion'
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
    servers:
    - url: '{origin}'
      description: The deployment this document describes — `GET /openapi.json` on a running instance fills it in
      variables:
        origin:
          default: https://your-host.example.com
          description: Scheme and host of the Tale deployment
  /api/v1/conversations/assignment:
    post:
      tags:
      - Conversations
      security:
      - bearerAuth: []
      parameters:
      - name: X-Organization-Slug
        in: header
        required: false
        schema:
          type: string
        description: The organization to operate on. STRICTLY REQUIRED on every call, reads included, when the key holder belongs to more than one organization — without it such requests are refused with 400 `ORG_SLUG_REQUIRED` (the dashboard’s last-active organization never steers a machine call). A slug that names no organization answers 404 `ORG_SLUG_INVALID`, one the key holder is no member of 403 `ORG_FORBIDDEN`. Single-organization keys may omit it; a blank or whitespace-only value reads as the header absent. Each of the three refusals lists the slugs the key holder may send under `data.organizations`; `GET /api/v1/me` answers them too.
      - name: X-Request-Id
        in: header
        required: false
        description: 'Your own correlation id, echoed back on the response and written to the platform’s log: up to 255 characters of letters, digits, `_`, `-` and `=`. Any other value is replaced by a fresh UUID (the response carries the id that was used), and uniqueness of an id you choose is yours to keep.'
        schema:
          type: string
          pattern: ^[A-Za-z0-9_=-]{1,255}$
      operationId: assignConversationTeam
      summary: Queue a mirrored conversation to a team
      description: 'Sets the team a conversation this key user mirrored is queued to, or clears it with `teamId: null` — the team’s members can then open it in the Inbox, and each of them is notified. The conversation is named like every mirror route, by `source` and its `externalId`; team ids come from `GET /api/v1/teams`. Admin and owner keys only — the Inbox’s own rule for who may assign; an editor key answers 403 `ROLE_FORBIDDEN` and can route by a governance rule for its source instead. A team outside the organization answers 400 `TEAM_NOT_IN_ORG`; a mirror no snapshot created answers 404 `CONVERSATION_NOT_FOUND`, one another service user owns 403 `INTEGRATION_NOT_OWNED`. Setting the team it already has changes nothing. The person assignee is not touched. Unknown keys are refused.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - source
              - externalId
              - teamId
              additionalProperties: false
              properties:
                source:
                  type: string
                  pattern: ^[a-z][a-z0-9_-]{0,59}$
                externalId:
                  type: string
                  minLength: 1
                  maxLength: 256
                teamId:
                  type:
                  - string
                  - 'null'
                  minLength: 1
                  maxLength: 128
                  description: A team id from `GET /api/v1/teams`; `null` clears the team
