    - url: '{origin}'
      description: The deployment this document describes — `GET /openapi.json` on a running instance fills it in
      variables:
        origin:
          default: https://your-host.example.com
          description: Scheme and host of the Tale deployment
components:
  schemas:
    Team:
      type: object
      required:
      - id
      - name
      - member
      description: 'One team of the organization: the `id` an audience names, the `name` the app shows for it, and whether the key holder is a member.'
      properties:
        id:
          type: string
          description: The id `teamIds` and `teams` take
        name:
          type: string
          description: The team’s display name
        member:
          type: boolean
          description: Whether the key holder belongs to the team — an organization admin may assign any team, another role only the teams it is a member of
    Error:
      type: object
      required:
      - error
      - code
      properties:
        error:
          type: string
          description: What went wrong
        code:
          type: string
          enum:
          - ACTOR_AMBIGUOUS
          - ACTOR_DISABLED
          - ACTOR_FORBIDDEN
          - ACTOR_NOT_FOUND
          - ACTOR_REBOUND
          - ACTOR_UNVERIFIED
