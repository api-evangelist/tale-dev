          description: 'A stable refusal code — every refusal the door itself makes carries one, and so does every domain refusal it lets through. The set is additive: a new code is a minor change, so treat a value you do not know as a generic refusal of the status you got.'
        requestId:
          type: string
          description: The response’s `X-Request-Id`, repeated on a 429, on a 500, on a body-size 413 and on a URL-size 414 so a caller can quote it
        data:
          type: object
          properties:
            retryAfterMs:
              type: number
              description: Wait in milliseconds for RATE_LIMITED
            providers:
              type: array
              items:
                type: string
              description: For CHAT_MODEL_AMBIGUOUS, the provider slugs that serve the model — name one as `providerSlug`
            lastMessageId:
              type: string
              description: 'For CHAT_TURN_NOT_RUNNING, the newest assistant message on the thread (once it has one) — the idle poll’s own disambiguation: equal to the `messageId` a 202 named means that turn already settled'
            lastStatus:
              type: string
              enum:
              - pending
              - complete
              - failed
              - cancelled
              description: For CHAT_TURN_NOT_RUNNING, how `lastMessageId` settled (present with it)
            organizations:
              type: array
              description: For ORG_SLUG_REQUIRED, ORG_SLUG_INVALID and ORG_FORBIDDEN, the organizations the key holder belongs to (a disabled membership is left out; the list is empty when none remains) — send one of the slugs as `X-Organization-Slug`
              items:
                type: object
                required:
                - slug
                - name
                properties:
                  slug:
                    type: string
                  name:
                    type: string
            issues:
              type: array
              description: For INVALID_BODY and INVALID_QUERY, every problem the schema found in the body or the query string; for INVALID_LIMIT and INVALID_CURSOR, the one parameter refused (`limit`, `cursor`); for AUTOMATION_INPUT_INVALID, every problem the automation’s inputs schema found in the run input (at most 20 either way), each naming the field and the reason; `error` repeats the first one
              items:
                type: object
                required:
                - path
                - message
                properties:
                  path:
                    type: string
                    description: The field, dotted for nesting (`address.city`, `contacts.2.email`); empty for a problem with the body as a whole
                  message:
                    type: string
            scope:
              type: string
              enum:
              - user
              - team
              - project
              - org
              - apiKey
              description: 'For BUDGET_EXCEEDED, whose cap is reached: the key holder’s own (`user`), one of their teams’ (`team`), that of the project the work belongs to (`project`), the organization’s (`org`) or this API key’s (`apiKey`)'
            period:
              type: string
              enum:
              - daily
              - weekly
              - monthly
              description: For BUDGET_EXCEEDED, what the cap counts over — a calendar day, ISO week or calendar month in UTC
            limitCode:
              type: string
              enum:
              - TOKEN_LIMIT
              - COST_LIMIT
              - REQUEST_LIMIT
              description: 'For BUDGET_EXCEEDED, which cap is reached: tokens, cost in cents, or requests'
            used:
              type: number
              description: For BUDGET_EXCEEDED, the usage the cap measured this period, in its unit (tokens, cents or requests)
            limit:
              type: number
              description: For BUDGET_EXCEEDED, the cap, in the same unit
            resetsAt:
              type: number
              description: For BUDGET_EXCEEDED, when the period resets, in epoch milliseconds — `Retry-After` names the same wait in whole seconds
    ProductInput:
      type: object
      description: '`name` is required on create; every field is optional on update. Strings are trimmed, and a blank optional field — or one sent as `null` — reads as left out. Unknown keys are refused (`INVALID_BODY`).'
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
          description: Trimmed; a blank name is refused
        description:
          type:
          - string
          - 'null'
          maxLength: 4000
          description: Trimmed
        imageUrl:
          type:
          - string
          - 'null'
          format: uri
          maxLength: 2048
          description: 'An absolute http(s) URL, trimmed; any other value (a relative path, a `javascript:` or `ftp:` URL) answers 400. The host is held to the crawl-target rule by name and by IP literal — loopback, link-local, private-network (RFC 1918, CGNAT, ULA, `.internal`/`.lan`-style suffixes, single-label names) and cloud metadata hosts answer 400 `INVALID_BODY` — as a string, without a DNS lookup: a public name that resolves to a private address passes here. The platform never fetches the URL; the rule keeps a stored URL from becoming a server-side request later. `TALE_ALLOW_PRIVATE_CRAWL_HOSTS=1` lifts the private-network half, never the metadata half. Exception: an exact managed product-image URL returned by this deployment may be replayed, including on a private deployment. It must name registered image metadata in this organization that the caller uploaded or a current product already uses; a missing or inaccessible image answers 404 `FILE_NOT_FOUND`. The app accepts inspected PNG, JPEG, WebP, GIF, or SVG uploads up to 5 MiB. Its bytes require an authorized app session; an API key does not authorize this app route.'
        stock:
          type:
          - number
          - 'null'
          minimum: -9007199254740991
          maximum: 9007199254740991
        price:
          type:
          - number
          - 'null'
          minimum: -9007199254740991
          maximum: 9007199254740991
        currency:
          type:
          - string
          - 'null'
          pattern: ^[A-Za-z]{3}$
          minLength: 3
          maxLength: 3
          description: An ISO 4217 code (`USD`, `EUR`) — any case in, stored uppercase; a code the platform does not know answers 400
        category:
          type:
          - string
          - 'null'
          maxLength: 100
          description: Trimmed
        tags:
          type:
          - array
          - 'null'
          items:
            type: string
            maxLength: 60
            description: Trimmed
          maxItems: 50
        status:
          type:
          - string
          - 'null'
          enum:
          - active
          - inactive
          - draft
          - archived
          - null
        externalId:
          type:
          - string
          - 'null'
          maxLength: 256
          description: Trimmed
        metadata:
          type:
          - object
          - 'null'
          additionalProperties: true
          maxProperties: 500
          description: Free-form. On PATCH it MERGES per RFC 7396 — sent keys are set, omitted keys stay, a key sent as `null` is removed, and the whole field sent as `null` clears it. At most 64 KiB of JSON, 8 levels of nesting and 500 keys in total (every nested object counted); a larger value answers 400 `INVALID_BODY` naming the path.
    Product:
      type: object
      required:
      - id
      - organizationId
      - name
      - tags
      - createdAt
      - updatedAt
      properties:
        id:
          type: string
        organizationId:
          type: string
        name:
          type: string
        description:
          type:
          - string
          - 'null'
        imageUrl:
          type:
          - string
          - 'null'
          format: uri
          description: An absolute image URL. App-uploaded images use a stable, organization-protected app URL and require an authorized app session to view; external image URLs keep their original access rules.
        stock:
          type:
          - number
          - 'null'
        price:
          type:
          - number
          - 'null'
        currency:
          type:
          - string
          - 'null'
        category:
          type:
          - string
          - 'null'
        tags:
          type: array
          items:
            type: string
        status:
          type:
          - string
          - 'null'
        translations:
          type:
          - array
          - 'null'
          readOnly: true
          description: 'Reserved: per-language overrides of the catalog fields. Read-only and always null on this surface today — no input schema takes it and nothing writes it; a localized catalog is a later addition, and the field is declared so a client generated now keeps its shape then.'
          items:
            type: object
            required:
            - language
            properties:
              language:
                type: string
                description: A BCP 47 language tag (`de`, `fr-CH`)
              name:
                type: string
              description:
                type: string
              category:
                type: string
              tags:
                type: array
                items:
                  type: string
              metadata:
                type: object
                additionalProperties: true
        externalId:
          type:
          - string
          - 'null'
        metadata:
          type:
          - object
          - 'null'
          additionalProperties: true
        createdAt:
          type: integer
          minimum: 0
          description: Epoch milliseconds
        updatedAt:
          type: integer
          minimum: 0
          description: Epoch milliseconds
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: An organization API key. Create one in Settings → API. Pasted into the explorer on /docs it stays in the page’s memory only and is forgotten on reload — it is never stored.
