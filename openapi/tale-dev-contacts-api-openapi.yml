          - api_import
          - conversation
          - shopify
          - woocommerce
          - magento
          - bigcommerce
          - prestashop
          - chargebee
          - stripe
          - recurly
          - salesforce
          - hubspot
          - pipedrive
          - zoho
          - sap
          - oracle
          - netsuite
          - mailchimp
          - klaviyo
          - sendgrid
          - webhook
          - zapier
          - custom
          description: Where the contact came from — one of the platform’s data sources; defaults to `api_import`, and `custom` is the catch-all for anything not listed
        locale:
          type:
          - string
          - 'null'
          maxLength: 20
          description: Trimmed
        address:
          type:
          - object
          - 'null'
          additionalProperties: true
          maxProperties: 500
          description: Free-form. On PATCH it is REPLACED whole — an address is a unit. At most 64 KiB of JSON, 8 levels of nesting and 500 keys in total (every nested object counted); a larger value answers 400 `INVALID_BODY` naming the path.
        externalId:
          oneOf:
          - type:
            - string
            - 'null'
            maxLength: 256
          - type:
            - integer
            - 'null'
            minimum: -9007199254740991
            maximum: 9007199254740991
          description: 'Stored as a trimmed string. Send a source system’s id as a string: a number beyond 2^53 − 1 cannot be carried exactly and is refused'
        tags:
          type:
          - array
          - 'null'
          items:
            type: string
            maxLength: 60
            description: Trimmed
          maxItems: 50
        metadata:
          type:
          - object
          - 'null'
          additionalProperties: true
          maxProperties: 500
          description: Free-form. On PATCH it MERGES per RFC 7396 — sent keys are set, omitted keys stay, a key sent as `null` is removed, and the whole field sent as `null` clears it. At most 64 KiB of JSON, 8 levels of nesting and 500 keys in total (every nested object counted); a larger value answers 400 `INVALID_BODY` naming the path.
        notes:
          type:
          - string
          - 'null'
          maxLength: 10000
          description: Trimmed
        expectedUpdatedAt:
          type: integer
          minimum: 0
          maximum: 8640000000000000
          description: The `updatedAt` of the revision this update is based on
  headers:
    RetryAfter:
      description: How long to wait before retrying, in whole seconds
      schema:
        type: integer
        minimum: 1
    WWWAuthenticate:
      description: 'The challenge RFC 9110 §11.6.1 requires of a 401: `Bearer`, or `Bearer error="invalid_token"` when a key was presented and refused'
      schema:
        type: string
    XTaleApiVersion:
      description: The version of this contract (`info.version`) the serving instance implements — semver for the wire
      schema:
        type: string
        example: 3.27.0
    ETag:
      description: 'A validator: over the answer’s bytes on a JSON read, the stored object’s tag on a download. Send it back as `If-None-Match` — as received; the weak and edge-suffixed forms match too — to be told 304 when nothing changed.'
      schema:
        type: string
    Location:
      description: The created resource’s own path, relative to the request URL — follow it with GET whatever shape the 201 body has
      schema:
        type: string
    Allow:
      description: The methods this path serves, comma-separated
      schema:
        type: string
        example: GET, POST, HEAD, OPTIONS
    XRequestId:
      description: The request id the platform logged this call under — quote it when reporting a problem. Echoes a sane `X-Request-Id` the caller sent.
      schema:
        type: string
    CacheControl:
      description: '`private, no-cache` on a validated read and on a download: keep the answer, revalidate it before reuse, and let no shared cache keep it. Every other answer says `no-store`.'
      schema:
        type: string
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: An organization API key. Create one in Settings → API. Pasted into the explorer on /docs it stays in the page’s memory only and is forgotten on reload — it is never stored.
