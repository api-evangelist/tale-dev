      summary: Get or create a folder
      description: 'GET-OR-CREATE semantics: a folder of the same name under the same parent — compared without regard to case, the way sibling names are unique — answers 200 with `created: false` and the STORED spelling; otherwise the folder is created and answered 201 with `created: true`. Two concurrent creates of one name yield one folder (the sibling rule is database-enforced). `name` is trimmed and NFC-normalized; a name that is a path (`a/b`, `a\b`, `.`, `..`) or carries a control character is refused (`FOLDER_NAME_INVALID` — the sentence names the rule broken and `data.issues` names `name`) — the rule a file name and a WebDAV segment follow — and a parent 20 levels deep refuses a child (`FOLDER_DEPTH_EXCEEDED`). `parentId` must name a folder of THIS project (an opaque 404 otherwise); omit it for a root folder — a blank id is a 400 `INVALID_BODY`. Requires the org editor role and project edit access. Charged against the general REST bucket (120/min) and the per-org `folder:mutate` budget the in-app folder actions share.'
      operationId: getOrCreateProjectFolder
      security:
      - bearerAuth: []
      parameters:
      - name: X-Organization-Slug
        in: header
        required: false
        schema:
          type: string
