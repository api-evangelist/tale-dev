        in: header
        required: false
        description: 'Your own correlation id, echoed back on the response and written to the platform’s log: up to 255 characters of letters, digits, `_`, `-` and `=`. Any other value is replaced by a fresh UUID (the response carries the id that was used), and uniqueness of an id you choose is yours to keep.'
        schema:
          type: string
          pattern: ^[A-Za-z0-9_=-]{1,255}$
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - uploadId
              - fileId
              - folderId
              - fileName
              properties:
                uploadId:
                  type: string
                  minLength: 1
                  maxLength: 64
                fileId:
                  type: string
                  minLength: 1
                  maxLength: 2048
                folderId:
                  type: string
                  minLength: 1
                  maxLength: 64
                fileName:
                  type: string
                  minLength: 1
                  maxLength: 1024
                contentType:
                  type: string
                  maxLength: 255
                skipRagIndexing:
