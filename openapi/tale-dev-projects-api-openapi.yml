            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            X-Tale-Api-Version:
              $ref: '#/components/headers/XTaleApiVersion'
        '503':
          description: 'No object store is configured for this deployment (`OBJECT_STORE_UNCONFIGURED`); or the platform’s database is restarting or cannot be reached (`DATABASE_UNAVAILABLE`): `Retry-After` names the wait in whole seconds — retry with backoff; the envelope carries a `requestId`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            X-Tale-Api-Version:
              $ref: '#/components/headers/XTaleApiVersion'
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
components:
  headers:
    XTaleApiVersion:
      description: The version of this contract (`info.version`) the serving instance implements — semver for the wire
      schema:
        type: string
        example: 3.27.0
    ContentDisposition:
      description: The stored file name as an RFC 6266 attachment (`filename` and `filename*`)
      schema:
        type: string
    Location:
      description: The created resource’s own path, relative to the request URL — follow it with GET whatever shape the 201 body has
      schema:
        type: string
    Allow:
      description: The methods this path serves, comma-separated
      schema:
        type: string
        example: GET, POST, HEAD, OPTIONS
    AcceptRanges:
      description: '`bytes` — `Range` requests are honoured'
      schema:
        type: string
        example: bytes
    RetryAfter:
      description: How long to wait before retrying, in whole seconds
      schema:
        type: integer
        minimum: 1
    WWWAuthenticate:
      description: 'The challenge RFC 9110 §11.6.1 requires of a 401: `Bearer`, or `Bearer error="invalid_token"` when a key was presented and refused'
      schema:
        type: string
    ContentLength:
      description: The byte length of the response body
      schema:
        type: integer
        minimum: 0
    ContentRange:
      description: The satisfied range on a 206 (`bytes <start>-<end>/<size>`); on a 416, `bytes */<size>` names the file’s size
      schema:
        type: string
    CacheControl:
      description: '`private, no-cache` on a validated read and on a download: keep the answer, revalidate it before reuse, and let no shared cache keep it. Every other answer says `no-store`.'
      schema:
        type: string
    ETag:
      description: 'A validator: over the answer’s bytes on a JSON read, the stored object’s tag on a download. Send it back as `If-None-Match` — as received; the weak and edge-suffixed forms match too — to be told 304 when nothing changed.'
      schema:
        type: string
    XRequestId:
      description: The request id the platform logged this call under — quote it when reporting a problem. Echoes a sane `X-Request-Id` the caller sent.
      schema:
        type: string
    LastModified:
      description: When the stored object was last written (HTTP date)
      schema:
        type: string
  schemas:
    RetryIndexingResult:
      type: object
      required:
      - status
      description: What a retry-indexing request did — the one answer the Hub document door and the project-file door share.
      properties:
        status:
          type: string
          enum:
          - indexing
          - skipped
          description: '`indexing` — the blob was queued (an opt-out lifted); `skipped` — nothing was queued, `reason` says why'
        reason:
          type: string
          enum:
          - content-only
          - untracked-blob
          - unsupported
          - in-progress
          description: 'Why indexing was skipped; absent when `status` is `indexing`. `content-only`: inline text never enters the search corpus (a Hub document without a file — never a project file); `untracked-blob`: the platform does not track the blob; `unsupported`: terminal — the platform cannot index these bytes and a retry reproduces the answer; the row’s `indexing.errorCode` names the cause (`unsupported_type`, `image_no_vision`, `empty`, `not_text`, `malformed`); `in-progress`: a fresh index job is already queued or running — poll `indexing` instead.'
    ProjectUploadHandoff:
      type: object
      required:
      - uploadId
      - url
      - method
      - s3Ref
      - expiresAt
      - maxBytes
      properties:
        maxBytes:
          type: integer
          description: The largest file this organization accepts for the declared type, in bytes — the platform ceiling (104,857,600, 100 MiB) or the organization’s lower cap; the bind refuses more (`FILE_TOO_LARGE` / `UPLOAD_POLICY_REJECTED`, `data.limitBytes`)
        uploadId:
          type: string
          description: Single-use intent to present at the bind step
        url:
          type: string
          description: Where to send the bytes
        method:
          type: string
          enum:
          - PUT
        s3Ref:
          type: string
          description: The blob reference to bind as `fileId`
        expiresAt:
          type: integer
          minimum: 0
          description: Epoch ms; the intent AND the signed `url` both die of old age after this (30 minutes from the mint)
    ProjectFolder:
      type: object
      required:
      - id
      - name
      - parentId
      properties:
        id:
          type: string
        name:
          type: string
        parentId:
          type:
          - string
          - 'null'
          description: The folder this one sits in; null for a root folder
    ProjectFile:
      type: object
      required:
      - id
      - createdAt
      - size
      properties:
        id:
          type: string
        fileName:
          type:
          - string
          - 'null'
        folderId:
          type:
          - string
          - 'null'
        mimeType:
          type:
          - string
          - 'null'
          description: Resolved from the file name’s extension at the bind — a declared `contentType` never stands in for it — and the `Content-Type` the download carries
        size:
          type:
          - integer
          - 'null'
          description: The landed bytes, from the blob’s metadata row — the size the upload policy judged; null when the platform does not track the blob
        indexing:
          type: object
          required:
          - status
          additionalProperties: false
          description: 'Where the file stands in the search corpus — the vocabulary `Document.indexing` speaks. A file bound with the default `skipRagIndexing: true` reads `skipped` until someone indexes it (**Index now** on the project’s Knowledge tab, `POST …/files/{documentId}/retry-indexing`, or a bind with `skipRagIndexing: false`) and is not found by `POST …/knowledge/search` until then; absent when the platform does not track the blob.'
          properties:
            status:
              type: string
              enum:
              - pending
              - queued
              - running
              - completed
              - failed
              - unsupported
              - skipped
              description: '`pending` — never queued; `skipped` — the file opts out of indexing; `unsupported` — TERMINAL: the platform cannot index these bytes and a retry reproduces the answer, `errorCode` says why (`unsupported_type`, `image_no_vision`, `empty`, `not_text`, `malformed`); `failed` — see `error` / `errorCode`: the job retries `embedding_upstream`, `indexer_error` and `index_rebuilding` by itself, `usage_limit` resumes by itself once the usage limit allows it, the rest wait for an admin (a provider account, the organization’s policy) and a `retry-indexing`; a `failed` with no `errorCode` is a failure the platform settled without classifying it, usually an indexing run that stopped before it finished (a lost job, a stopped worker) — request a `retry-indexing` rather than wait for one'
            indexedAt:
              type: integer
              minimum: 0
              description: Epoch ms of the last completed indexing
            error:
              type: string
              description: A sentence for a person, present with `failed` and `unsupported`; never a storage-engine diagnostic — the raw cause stays in the platform log.
            errorCode:
              type: string
              enum:
              - unsupported_type
              - image_no_vision
              - empty
              - not_text
              - malformed
              - secret_detected
              - pii_blocked
              - embedding_not_configured
              - embedding_provider_refused
              - embedding_upstream
              - index_rebuilding
              - index_repair_failed
              - usage_limit
              - indexer_error
              description: 'The stable cause to branch on, present with `unsupported`, and with `failed` whenever the platform classified the cause — a `failed` without one was settled unclassified, usually after its indexing run stopped before it finished; request a `retry-indexing` for it. Terminal (`unsupported`): `unsupported_type` — no extractor for the type; `image_no_vision` — an image and no OCR lane; `empty` — no text to index; `not_text` — binary bytes behind a text extension, re-export as UTF-8; `malformed` — the bytes do not parse as the format the extension claims. Retried by the job (`failed`): `embedding_upstream` — the provider was unreachable, rate-limited or 5xx; `indexer_error` — a platform-side store fault; `index_rebuilding` — the search index is being rebuilt. Waits for a usage limit (`failed`): `usage_limit` — a limit that binds whoever the file is indexed for (its uploader, a synced drive’s owner, the organization for an emailed attachment) has too little room for its embeddings; indexing resumes by itself within the hour after the limit resets or is raised, after what it already embedded. Waits for an admin (`failed`): `embedding_not_configured`, `embedding_provider_refused` (the provider refused the account or credential, the model answers vectors of another width than the settings state, or the platform cannot use the embedding credential — none configured, deleted, disabled or unreadable), `index_repair_failed`, `secret_detected`, `pii_blocked`. Saving corrected embedding settings, or adding or repairing the credential the embedding model uses, re-queues every document that failed on the embedding model.'
        createdAt:
          type: integer
          minimum: 0
          description: Epoch milliseconds
    Project:
      type: object
      required:
      - id
      - name
      - teamIds
      - createdAt
      - updatedAt
      properties:
        id:
          type: string
        name:
          type: string
        key:
          type: string
          description: Immutable task-identifier prefix
        description:
          type: string
        externalItemId:
          type: string
          description: Caller-owned external key, unique per organization — stored NFC-normalized and trimmed
        archivedAt:
          type: integer
          minimum: 0
          description: Epoch ms — present when the project is archived — the archived marker for lookups and the list
        createdAt:
          type: integer
          minimum: 0
          description: Epoch ms — the list is ordered on it, newest first
        updatedAt:
          type: integer
          minimum: 0
          description: Epoch ms of the last change to the project itself
        teamIds:
          type: array
          items:
            type: string
          description: 'The audience: the teams that may see the project, by id; empty = organization-wide (every member). Owners and admins see every project regardless.'
    ProjectFolderResult:
      type: object
      required:
      - folder
      - created
      properties:
        folder:
          $ref: '#/components/schemas/ProjectFolder'
        created:
          type: boolean
          description: false when an exact-name sibling already existed (200)
    Error:
      type: object
      required:
      - error
      - code
      properties:
        error:
          type: string
          description: What went wrong
        code:
          type: string
          enum:
          - ACTOR_AMBIGUOUS
          - ACTOR_DISABLED
          - ACTOR_FORBIDDEN
          - ACTOR_NOT_FOUND
          - ACTOR_REBOUND
          - ACTOR_UNVERIFIED
          - API_KEY_SCOPE_FORBIDDEN
          - ATTACHMENT_NOT_FOUND
          - ATTACHMENT_NOT_OWNED
          - ATTACHMENT_NOT_STAGED
          - ATTACHMENT_SIZE_MISMATCH
          - AUTHOR_UNVERIFIED
          - AUTOMATION_DELIVERY_SCOPE_MISMATCH
          - AUTOMATION_HAS_ACTIVE_RUNS
          - AUTOMATION_INPUT_INVALID
          - AUTOMATION_NOT_DEPLOYED
