      summary: Delete a project
      description: 'The app’s project delete, for an organization admin (403 `ROLE_FORBIDDEN` otherwise). The optional body chooses what happens to the project’s content: `mode: "cascade"` (the default) destroys it — every document expires into the retention pipeline (purged after the organization’s grace window), the key holder’s own chats are trashed, every task is retired and its live runs cancelled; `mode: "detach"` releases the documents and chats into the organization instead. Agents, folders and the project’s run history — finished runs included, unlike an automation delete, which keeps its runs — go with the project either way, and its `externalItemId` becomes free again. The app’s confirmation phrase (the project name) is supplied by the door. A cascade is charged against the per-user `project:delete-cascade` budget the app charges too (5/min). Refused as a 409, before anything is written, while an automation is installed in the project (`PROJECT_HAS_BOUND_AUTOMATIONS` — `data.automations` names them; uninstall each with `DELETE /api/v1/projects/{id}/automations/{name}` first), while a cascade would destroy a controlled record that is in review, approved or retains an approved version (`PROJECT_HAS_PROTECTED_RECORDS` — `data.documents` names them), or while a legal hold covers one of its documents (`PROJECT_LEGAL_HOLD`). An invisible or absent project answers the opaque 404.'
