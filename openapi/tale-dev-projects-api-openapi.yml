              $ref: '#/components/headers/RetryAfter'
    patch:
      tags:
      - Projects
      summary: Update a project — archive, restore, rename, re-describe, re-attach its…
      description: 'The project’s mutable surface, every field optional and at least one required. `archived: true` archives the project, `false` restores it — the same action as the app, so it requires an organization admin (403 `ROLE_FORBIDDEN` otherwise); a project already in the requested state is left unchanged, and a body that changes nothing — every field already at its value — writes nothing and leaves `updatedAt` alone. Archiving keeps the project and everything in it readable through this door and refuses every write on it (403 `PROJECT_ARCHIVED`); its `externalItemId` stays taken until the project is deleted. `name`, `description` and `externalItemId` are the identity a mirror propagates when the source record changes: for the org editor role with project edit access (403 `ROLE_FORBIDDEN` / `RBAC_FORBIDDEN` otherwise) on an active project — a body that restores and edits applies the restore first, one that edits and archives applies the archive last, and identity edits on an archived project the body does not restore answer 403 `PROJECT_ARCHIVED`. `name` is trimmed and never blank; `description: null` clears it; `externalItemId` is stored canonical (NFC, trimmed), must be free within the organization (409 `PROJECT_DUPLICATE_EXTERNAL_ID`, the key in `data`), and `null` releases it. An invisible or absent project answers the opaque 404. Answers the project as it now stands.'
      operationId: setProjectArchived
      security:
      - bearerAuth: []
      parameters:
      - name: X-Organization-Slug
        in: header
        required: false
        schema:
          type: string
        description: The organization to operate on. STRICTLY REQUIRED on every call, reads included, when the key holder belongs to more than one organization — without it such requests are refused with 400 `ORG_SLUG_REQUIRED` (the dashboard’s last-active organization never steers a machine call). A slug that names no organization answers 404 `ORG_SLUG_INVALID`, one the key holder is no member of 403 `ORG_FORBIDDEN`. Single-organization keys may omit it; a blank or whitespace-only value reads as the header absent. Each of the three refusals lists the slugs the key holder may send under `data.organizations`; `GET /api/v1/me` answers them too.
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: Project ID
      - name: X-Request-Id
        in: header
        required: false
        description: 'Your own correlation id, echoed back on the response and written to the platform’s log: up to 255 characters of letters, digits, `_`, `-` and `=`. Any other value is replaced by a fresh UUID (the response carries the id that was used), and uniqueness of an id you choose is yours to keep.'
        schema:
          type: string
          pattern: ^[A-Za-z0-9_=-]{1,255}$
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              description: At least one of the fields; a body with none is refused (`INVALID_BODY`)
              properties:
                archived:
                  type: boolean
                name:
                  type: string
                  minLength: 1
                  maxLength: 80
                  description: Trimmed, never blank
                description:
                  type:
                  - string
                  - 'null'
                  maxLength: 500
                  description: '`null` clears it'
                externalItemId:
                  type:
                  - string
                  - 'null'
                  minLength: 1
                  maxLength: 256
                  description: The caller-owned key, stored NFC-normalized and trimmed, unique per organization; `null` releases it
                teamIds:
                  type: array
                  items:
                    type: string
                    minLength: 1
                    maxLength: 128
                  maxItems: 21
                  description: 'The audience, replaced whole: the teams that may see the project, by id (teams of this organization — `GET /api/v1/teams` lists them); `[]` makes it organization-wide, a repeated id collapses to one, and the audience the project already carries is a no-op that leaves `updatedAt` alone. An organization admin verb, like `archived` — a lesser role answers 403 `RBAC_FORBIDDEN` — and, like every other write, refused on an archived project the body does not restore (403 `PROJECT_ARCHIVED`).'
      responses:
        '200':
          description: The project as it now stands
          content:
            application/json:
              schema:
                type: object
                required:
                - project
                properties:
                  project:
                    $ref: '#/components/schemas/Project'
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            X-Tale-Api-Version:
              $ref: '#/components/headers/XTaleApiVersion'
        '400':
          description: 'A body the schema refuses (`INVALID_BODY`): no field, an unknown key, a blank `name` or `externalItemId`, a value past its cap (`teamIds` past its `maxItems` included); or a `teamIds` that names a team that is not this organization’s (`PROJECT_SHARING_INVALID`, the unknown ids in `data.unknownTeamIds`)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            X-Tale-Api-Version:
              $ref: '#/components/headers/XTaleApiVersion'
        '401':
          description: Missing or invalid API key (`UNAUTHORIZED`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            X-Tale-Api-Version:
              $ref: '#/components/headers/XTaleApiVersion'
            WWW-Authenticate:
              $ref: '#/components/headers/WWWAuthenticate'
        '403':
