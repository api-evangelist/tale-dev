  /api/v1/projects/{id}/files/{documentId}/retry-indexing:
    post:
      tags:
      - Projects
      summary: Index a project file now
      description: 'The REST twin of **Index now** on the project’s Knowledge tab: re-queues the file’s blob for indexing through the core behind `POST /api/v1/documents/{id}/retry-indexing` (which answers 404 for a project file) and answers the same `{status, reason}`. A file bound with the default `skipRagIndexing: true` is opted back in by this request — the explicit ask is the opt-in — and answers `indexing`; poll its `indexing` on `GET /api/v1/projects/{id}/files/{documentId}` (304 while unchanged) until `completed`, from when `POST …/knowledge/search` finds it, or `unsupported` — terminal, `indexing.errorCode` says why. `skipped` names its `reason`: a blob the platform does not track (`untracked-blob`), a file type no extractor can read (`unsupported` — terminal; the row’s `indexing.error` says why), or a fresh index job already queued or running (`in-progress` — poll instead); `content-only` cannot occur here, a project file always has a blob. Requires the org editor role and project edit access on an active project — the gate `DELETE …/files/{documentId}` runs — plus a role that can write documents (403 `RBAC_FORBIDDEN`); the same budget as the Hub door, 10 retries per user per minute, answers 429 `RATE_LIMITED` with `Retry-After`. A file of another project or organization, a document without a file, and a trashed or absent one answer the same opaque 404 (`FILE_NOT_FOUND`).'
      operationId: retryProjectFileIndexing
      security:
      - bearerAuth: []
      parameters:
      - name: X-Organization-Slug
        in: header
        required: false
        schema:
          type: string
        description: The organization to operate on. STRICTLY REQUIRED on every call, reads included, when the key holder belongs to more than one organization — without it such requests are refused with 400 `ORG_SLUG_REQUIRED` (the dashboard’s last-active organization never steers a machine call). A slug that names no organization answers 404 `ORG_SLUG_INVALID`, one the key holder is no member of 403 `ORG_FORBIDDEN`. Single-organization keys may omit it; a blank or whitespace-only value reads as the header absent. Each of the three refusals lists the slugs the key holder may send under `data.organizations`; `GET /api/v1/me` answers them too.
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: Project ID
      - name: documentId
        in: path
        required: true
        schema:
          type: string
        description: File (document) ID
      - name: X-Request-Id
        in: header
        required: false
        description: 'Your own correlation id, echoed back on the response and written to the platform’s log: up to 255 characters of letters, digits, `_`, `-` and `=`. Any other value is replaced by a fresh UUID (the response carries the id that was used), and uniqueness of an id you choose is yours to keep.'
        schema:
          type: string
          pattern: ^[A-Za-z0-9_=-]{1,255}$
      responses:
        '200':
          description: Whether indexing was queued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetryIndexingResult'
