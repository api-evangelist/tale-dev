  /api/v1/projects/{id}/uploads:
    post:
      tags:
      - Projects
      summary: Mint an upload handoff
      description: 'Answers where to send the bytes: a presigned `PUT` URL for the organization’s bucket (every 0.5 blob is S3-backed) plus the `s3Ref` to bind afterwards as `fileId` — a declared `contentType` is signed into the URL, so the PUT must carry that exact `Content-Type` header (omit `contentType` and the PUT has no header requirement). The `uploadId` is a single-use intent valid until `expiresAt` (30 minutes); complete the upload with `POST /api/v1/projects/{id}/files`. The signed URL is valid for exactly as long as the intent — `expiresAt` is the one deadline for both. Send `fileName` to have the bind’s type rules run here too: the organization’s extension and MIME allowlists and the platform’s format allowlist refuse a name they would refuse at the bind — a name without an extension included, whatever `contentType` says — 400 `UPLOAD_POLICY_REJECTED` / `UNSUPPORTED_FILE_TYPE` before anything is presigned, so the bytes never travel. The answer names `maxBytes`, the largest file this organization accepts for the declared type (the platform ceiling, 100 MiB, or the organization’s lower cap); declare `size` and the size and volume caps are judged here too — 400 `FILE_TOO_LARGE` / `UPLOAD_POLICY_REJECTED` with `data.limitBytes` — where they were discoverable only by uploading past them (the bind judges the landed bytes against the same caps; the declared size is a pre-check, never compared with what landed, so understating it buys nothing). A handoff never bound — or bound and refused — is reclaimed lazily: 24 hours after its 30-minute expiry, on the next mint into the organization, the blob is deleted with the intent, so a crashed worker leaves no permanent orphan and needs no delete call. Requires the org editor role and project edit access. Uses the upload lane bucket (240/min — one logical upload is several calls; keyed on the key holder like every REST budget).'
      operationId: createProjectUpload
      security:
      - bearerAuth: []
      parameters:
      - name: X-Organization-Slug
        in: header
        required: false
        schema:
          type: string
        description: The organization to operate on. STRICTLY REQUIRED on every call, reads included, when the key holder belongs to more than one organization — without it such requests are refused with 400 `ORG_SLUG_REQUIRED` (the dashboard’s last-active organization never steers a machine call). A slug that names no organization answers 404 `ORG_SLUG_INVALID`, one the key holder is no member of 403 `ORG_FORBIDDEN`. Single-organization keys may omit it; a blank or whitespace-only value reads as the header absent. Each of the three refusals lists the slugs the key holder may send under `data.organizations`; `GET /api/v1/me` answers them too.
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: Project ID
      - name: X-Request-Id
        in: header
        required: false
        description: 'Your own correlation id, echoed back on the response and written to the platform’s log: up to 255 characters of letters, digits, `_`, `-` and `=`. Any other value is replaced by a fresh UUID (the response carries the id that was used), and uniqueness of an id you choose is yours to keep.'
        schema:
          type: string
          pattern: ^[A-Za-z0-9_=-]{1,255}$
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                fileName:
                  type: string
                  minLength: 1
                  maxLength: 1024
                  description: Optional. Checked against the bind’s own rules — a file name (no path separators, no `..`, no control characters; trimmed and NFC-normalized first) ending in an extension the upload policy and the format allowlist accept (a name without one is refused whatever `contentType` says) — so a bad name fails here, before the bytes are uploaded; the bind’s `fileName` is what is stored.
                contentType:
                  type: string
                  maxLength: 255
                size:
                  type: integer
                  minimum: 0
                  description: 'Optional. The bytes about to be uploaded: a size the bind would refuse — over the platform ceiling (`FILE_TOO_LARGE`), over the organization’s cap for the type, or past the key holder’s volume quota (`UPLOAD_POLICY_REJECTED`) — fails here, before anything is presigned. The bind judges the landed size regardless.'
      responses:
        '200':
          description: The upload handoff
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectUploadHandoff'
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            X-Tale-Api-Version:
              $ref: '#/components/headers/XTaleApiVersion'
        '400':
          description: Malformed body (`INVALID_BODY`); `fileName` names a type the organization’s upload policy (`UPLOAD_POLICY_REJECTED`) or the platform’s format allowlist (`UNSUPPORTED_FILE_TYPE`) refuses; or `size` is over the platform ceiling (`FILE_TOO_LARGE`, `data.limitBytes`), the organization’s cap or the volume quota (`UPLOAD_POLICY_REJECTED`, `data.reasonCode` `file_too_large` / `volume_exceeded`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            X-Tale-Api-Version:
              $ref: '#/components/headers/XTaleApiVersion'
        '401':
          description: Missing or invalid API key (`UNAUTHORIZED`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
