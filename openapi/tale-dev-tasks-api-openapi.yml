      description: 'How a task repeats: which calendar days, never a time of day, read in `timezone` — the IANA zone of the person who set the rule. `daily` steps days; `weekly` names `weekdays` (0 is Sunday … 6 is Saturday; weeks run Monday to Sunday); `monthly` a `monthDay` (a shorter month uses its last day); `yearly` a `month` (1 is January) and a `monthDay` (29 February falls on the 28th in a common year); `interval` repeats every N of them. `createOn` is present, as `dueDate`, when the next task is also created at the start of the due date (midnight in `timezone`) while this one is still open; absent, the next task is created when this one is done or cancelled. Set in the app; read-only on this API.'
