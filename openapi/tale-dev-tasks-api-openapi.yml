    post:
      tags:
      - Tasks
      summary: Decide a task’s review for a member
      description: 'Requires an active project, the task’s work gate for the key holder and a task in `in_review` (409 `TASK_NOT_IN_REVIEW` otherwise). The decision is a person’s own gesture relayed from another application, so `actor` is required and the caller needs `capabilities.actAs` from `/me` (403 `ROLE_FORBIDDEN` without it); the member is resolved by verified e-mail (see `Actor`) and it is THEIR access and the organization’s `review_policy` that decide, exactly as on the board: an editor of the project decides any task’s review, any other member only one of a task they created or are the person assignee of — 403 `REVIEW_INDEPENDENT_REVIEWER_REQUIRED` or `REVIEW_COMPETENCE_REQUIRED` when the policy refuses them. `approve` is the move to Done: the pending review is recorded as approved by the member and audited, and the task’s status becomes `done` (a task with open subtasks answers 409 `TASK_HAS_OPEN_SUBTASKS`). `request_changes` withdraws the review, puts the member’s `comment` on the timeline and starts `workflowSlug` again on the task — the workflow reads the comment as operator feedback — so both fields are required for it, and a member who is not an editor may name only an automation built for tasks or the one that owns the task (403 `RBAC_FORBIDDEN`); the task’s status becomes `in_progress` and the answer carries the run to poll (`started: false` with `reason` semantics as on `…/start`: a live run is reused). Charges the execute bucket on top of the general REST bucket.'
      operationId: decideTaskReview
      security:
      - bearerAuth: []
      parameters:
      - name: X-Organization-Slug
        in: header
        required: false
        schema:
          type: string
        description: The organization to operate on. STRICTLY REQUIRED on every call, reads included, when the key holder belongs to more than one organization — without it such requests are refused with 400 `ORG_SLUG_REQUIRED` (the dashboard’s last-active organization never steers a machine call). A slug that names no organization answers 404 `ORG_SLUG_INVALID`, one the key holder is no member of 403 `ORG_FORBIDDEN`. Single-organization keys may omit it; a blank or whitespace-only value reads as the header absent. Each of the three refusals lists the slugs the key holder may send under `data.organizations`; `GET /api/v1/me` answers them too.
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: Project ID
      - name: taskId
        in: path
        required: true
        schema:
          type: string
        description: Task ID in this project
      - name: X-Request-Id
        in: header
        required: false
        description: 'Your own correlation id, echoed back on the response and written to the platform’s log: up to 255 characters of letters, digits, `_`, `-` and `=`. Any other value is replaced by a fresh UUID (the response carries the id that was used), and uniqueness of an id you choose is yours to keep.'
        schema:
          type: string
          pattern: ^[A-Za-z0-9_=-]{1,255}$
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - decision
              - actor
              properties:
                decision:
                  type: string
                  enum:
                  - approve
                  - request_changes
                comment:
                  type: string
                  minLength: 1
                  maxLength: 20000
                  description: The member’s feedback — required for `request_changes`, ignored for `approve`
                workflowSlug:
                  type: string
                  minLength: 1
                  maxLength: 200
                  description: The automation to start again with the feedback — required for `request_changes`; the `/` form (`billing/dunning`), as on `…/start`
                actor:
                  $ref: '#/components/schemas/Actor'
      responses:
        '200':
          description: The decision was applied
          content:
            application/json:
              schema:
                type: object
                required:
                - task
                - decision
                - approvalId
                - actorUserId
                properties:
                  task:
                    type: object
                    required:
                    - id
                    - status
                    properties:
                      id:
                        type: string
                      status:
                        type: string
                        enum:
                        - done
                        - in_progress
                  decision:
                    type: string
                    enum:
                    - approve
                    - request_changes
                  approvalId:
                    type:
                    - string
                    - 'null'
                    description: The review the decision closed, or null when the task was in review without a recorded review row
                  actorUserId:
                    type: string
                    description: The member the e-mail resolved to — pin it as `actor.userId` on later calls
                  started:
                    type: boolean
                    description: 'Present for `request_changes`: true when THIS call started the run, false when a live run was reused'
                  runId:
                    type:
                    - string
                    - 'null'
                    description: 'Present for `request_changes`: the run to poll at GET /api/v1/projects/{id}/runs/{runId}'
                  executionId:
                    type:
                    - string
                    - 'null'
                    deprecated: true
                    description: Alias of `runId`
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            X-Tale-Api-Version:
              $ref: '#/components/headers/XTaleApiVersion'
        '400':
          description: 'Invalid request: a body the schema refuses — a wrong type, an unknown key, a missing field, a NUL or an unpaired surrogate, a whole number beyond 2^53 − 1 (`INVALID_BODY`, every problem under `data.issues`); a query parameter the operation does not take, given twice or left blank (`INVALID_QUERY`); on a list, a `limit` that is not a whole number (`INVALID_LIMIT`) or a `cursor` this list did not answer (`INVALID_CURSOR`); or a `request_changes` without `comment` or `workflowSlug` (`INVALID_BODY`, the field named under `data.issues`)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            X-Tale-Api-Version:
              $ref: '#/components/headers/XTaleApiVersion'
        '401':
          description: Missing or invalid API key (`UNAUTHORIZED`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            X-Tale-Api-Version:
              $ref: '#/components/headers/XTaleApiVersion'
            WWW-Authenticate:
              $ref: '#/components/headers/WWWAuthenticate'
        '403':
          description: The key holder may not change this task (`RBAC_FORBIDDEN`), the project is archived (`PROJECT_ARCHIVED`), the task is archived (`TASK_ARCHIVED`), an `actor` sent without `capabilities.actAs` (`ROLE_FORBIDDEN`), an actor whose e-mail is unverified (`ACTOR_UNVERIFIED`), whose membership is disabled (`ACTOR_DISABLED`) or who may not change this task (`ACTOR_FORBIDDEN`), a member requesting changes through an automation not built for tasks (`RBAC_FORBIDDEN`), a member the review policy refuses (`REVIEW_INDEPENDENT_REVIEWER_REQUIRED`, `REVIEW_COMPETENCE_REQUIRED`), or a task held by the organization’s standard agent while its `standard_agent` policy is off (`STANDARD_AGENT_OFF`); or `X-Organization-Slug` names an organization the key holder is no member of (`ORG_FORBIDDEN`, with the slugs the key holder may send under `data.organizations`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            X-Tale-Api-Version:
              $ref: '#/components/headers/XTaleApiVersion'
        '404':
          description: The project is missing or invisible (`PROJECT_NOT_FOUND`), the task is missing or outside this project (`TASK_NOT_FOUND`), no member carries the actor’s e-mail (`ACTOR_NOT_FOUND`), or `workflowSlug` names an automation nobody saved (`AUTOMATION_NOT_FOUND`); or `X-Organization-Slug` names no organization (`ORG_SLUG_INVALID`, with the slugs the key holder may send under `data.organizations`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            X-Tale-Api-Version:
              $ref: '#/components/headers/XTaleApiVersion'
        '405':
          description: The path exists, but not for this method (`METHOD_NOT_ALLOWED`); `Allow` names the methods it serves
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            X-Tale-Api-Version:
              $ref: '#/components/headers/XTaleApiVersion'
            Allow:
              $ref: '#/components/headers/Allow'
        '409':
          description: The task is not in review (`TASK_NOT_IN_REVIEW`); approval belongs to an agent and needs an explicit eligible-person handoff (`TASK_AGENT_REVIEW_REQUIRED`); approval cannot read a valid current review policy (`TASK_REVIEW_POLICY_UNAVAILABLE`, including after a human handoff); it has open subtasks (`TASK_HAS_OPEN_SUBTASKS`); two members carry the actor’s e-mail (`ACTOR_AMBIGUOUS`); the e-mail now belongs to another member than the pinned `userId` (`ACTOR_REBOUND`); `workflowSlug` is saved but not deployed (`AUTOMATION_NOT_DEPLOYED`); the task is held by the organization’s standard agent, which cannot run for the member (`STANDARD_AGENT_UNAVAILABLE`, `data.reason` saying why)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            X-Tale-Api-Version:
              $ref: '#/components/headers/XTaleApiVersion'
        '413':
          description: The body exceeds this operation’s byte cap — 1 MiB unless the description says otherwise (`BODY_TOO_LARGE`); the envelope carries a `requestId`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            X-Tale-Api-Version:
              $ref: '#/components/headers/XTaleApiVersion'
        '429':
          description: 'The key holder’s request budget is spent (`RATE_LIMITED`): `Retry-After` names the wait in whole seconds and `data.retryAfterMs` in milliseconds; the envelope carries a `requestId`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            X-Tale-Api-Version:
              $ref: '#/components/headers/XTaleApiVersion'
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
        '500':
          description: Internal error (`INTERNAL_ERROR`); the envelope carries a `requestId` to quote when reporting it
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            X-Tale-Api-Version:
              $ref: '#/components/headers/XTaleApiVersion'
        '503':
          description: 'The platform’s database is restarting or cannot be reached (`DATABASE_UNAVAILABLE`): `Retry-After` names the wait in whole seconds — retry with backoff; the envelope carries a `requestId`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            X-Tale-Api-Version:
              $ref: '#/components/headers/XTaleApiVersion'
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
    servers:
    - url: '{origin}'
      description: The deployment this document describes — `GET /openapi.json` on a running instance fills it in
      variables:
        origin:
          default: https://your-host.example.com
          description: Scheme and host of the Tale deployment
components:
  schemas:
    TaskReview:
      type: object
      required:
      - approvalId
      - taskId
      - round
      - requestedFor
      - reviewer
      - agentSlug
      - runId
      - implementationAgentId
      - evidenceRevision
      - agentReviewBlockedReason
      - createdAt
      description: A task’s ordinary pending review, owned by the captured person or agent. Native agent verdicts use task_review; the public review POST relays a person’s decision.
      properties:
        approvalId:
          type: string
        taskId:
          type: string
        round:
          type: integer
          description: Which review of this task this is; 0 when unrecorded
        requestedFor:
          type:
          - string
          - 'null'
          description: Human reviewer compatibility field; null for an agent or absent recipient. Use reviewer for typed ownership.
        reviewer:
          anyOf:
          - type:
            - object
            - 'null'
            additionalProperties: false
            required:
            - kind
            - userId
            properties:
              kind:
                type: string
                enum:
                - user
              userId:
                type: string
          - type:
            - object
            - 'null'
            additionalProperties: false
            required:
            - kind
            - agentId
            properties:
              kind:
                type: string
                enum:
                - agent
              agentId:
                type: string
          description: The recipient captured by this pending review.
        agentSlug:
          type:
          - string
          - 'null'
          description: Compatibility display text for the implementation driver, not its identity; use implementationAgentId for the actual native source agent.
        runId:
          type:
          - string
          - 'null'
          description: The run whose settle parked the task in review, if any
        implementationAgentId:
          type:
          - string
          - 'null'
          description: The exact source run’s agent in this organization, project and task; null without a matching native source.
        evidenceRevision:
          type:
          - string
          - 'null'
          pattern: ^[a-f0-9]{64}$
          description: Opaque compare-and-set digest of local task, source result and discussion evidence. Null without a settled native source. It does not verify external pull-request heads or checks.
        agentReviewBlockedReason:
          type:
          - string
          - 'null'
          enum:
          - reviewer_unavailable
          - permission_missing
          - source_required
          - source_changed
          - self_review
          - human_policy
          - policy_unavailable
          - null
          description: Current reason a captured agent cannot decide; null for a human review or an eligible agent. Derived from current project scope, permission, policy and source; it never changes review ownership. Restore the indicated condition or explicitly transfer to an eligible reviewer.
        createdAt:
          type: integer
          minimum: 0
          description: Epoch milliseconds
    Error:
      type: object
      required:
      - error
      - code
      properties:
        error:
