  /api/v1/projects/{id}/tasks/{taskId}/external-status:
    put:
      tags:
      - Tasks
      summary: Project an accepted custom-source business lifecycle
      description: Explicit opt-in for a custom mirror whose source validates every business transition before calling. Requires exact custom external binding, existing task work permission and an active project; issue importers cannot opt in. Atomically compares expectedRevision, orders source lifecycle by sourceStatusAt and records external evidence without a native human approval. A captured native agent review refuses TASK_AGENT_REVIEW_REQUIRED, including on replay; pending human review is withdrawn on leave. Creates no agent run, second review or repeat copy. Status and optional archival apply together even on an archived task; other fields are preserved. Ordinary intake then preserves this accepted lifecycle. An identical lost-reply replay is a no-op only while still the latest lifecycle revision. Optional workflow replaces the source-declared form, bounded to 256 KiB, 16 actions and 30 fields per action; omission preserves it. Optional requestId and decision must appear together and settle that exact immutable native request. A refusal requires a reason. An older request may be acknowledged as a source fact under a fresh CAS after reconciling newer intent, but cannot replace the newest visible request or change an already recorded decision. Source ordering still refuses older lifecycle data. Source services cannot choose a native human actor.
      operationId: projectExternalTaskStatus
      security:
      - bearerAuth: []
      parameters:
      - name: X-Organization-Slug
        in: header
        required: false
        schema:
          type: string
        description: The organization to operate on. STRICTLY REQUIRED on every call, reads included, when the key holder belongs to more than one organization — without it such requests are refused with 400 `ORG_SLUG_REQUIRED` (the dashboard’s last-active organization never steers a machine call). A slug that names no organization answers 404 `ORG_SLUG_INVALID`, one the key holder is no member of 403 `ORG_FORBIDDEN`. Single-organization keys may omit it; a blank or whitespace-only value reads as the header absent. Each of the three refusals lists the slugs the key holder may send under `data.organizations`; `GET /api/v1/me` answers them too.
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: Project ID
      - name: taskId
        in: path
        required: true
        schema:
          type: string
        description: Task ID in this project
      - name: X-Request-Id
        in: header
        required: false
        description: 'Your own correlation id, echoed back on the response and written to the platform’s log: up to 255 characters of letters, digits, `_`, `-` and `=`. Any other value is replaced by a fresh UUID (the response carries the id that was used), and uniqueness of an id you choose is yours to keep.'
        schema:
          type: string
          pattern: ^[A-Za-z0-9_=-]{1,255}$
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - externalSystem
              - externalId
              - expectedRevision
              - sourceRevision
              - sourceStatusAt
              - status
              properties:
                externalSystem:
                  type: string
                  minLength: 1
                  maxLength: 100
                externalId:
                  type: string
                  minLength: 1
                  maxLength: 500
                expectedRevision:
                  type: string
                  pattern: ^(0|[1-9]\d{0,18})$
                  description: The `/status` snapshot revision that was read and validated at the source
                sourceRevision:
                  type: string
                  minLength: 1
                  maxLength: 512
                  description: Opaque identity of the accepted source snapshot
                sourceStatusAt:
                  type: integer
                  minimum: 0
                  maximum: 8640000000000000
                  description: Monotonically increasing source lifecycle epoch ms, including for status and archival changes
                status:
                  type: string
                  enum:
                  - backlog
                  - todo
                  - in_progress
                  - in_review
                  - done
                  - cancelled
                archived:
                  type: boolean
                  description: Optional accepted source archival; absent preserves current archival
                workflow:
                  $ref: '#/components/schemas/ExternalStatusWorkflow'
                requestId:
                  type: string
                  format: uuid
                  description: Immutable native request being acknowledged; supply decision as well
                decision:
                  $ref: '#/components/schemas/ExternalStatusDecision'
      responses:
        '200':
          description: The accepted lifecycle snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskStatusSnapshot'
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            X-Tale-Api-Version:
              $ref: '#/components/headers/XTaleApiVersion'
        '400':
          description: 'Invalid request: a body the schema refuses — a wrong type, an unknown key, a missing field, a NUL or an unpaired surrogate, a whole number beyond 2^53 − 1 (`INVALID_BODY`, every problem under `data.issues`); a query parameter the operation does not take, given twice or left blank (`INVALID_QUERY`); on a list, a `limit` that is not a whole number (`INVALID_LIMIT`) or a `cursor` this list did not answer (`INVALID_CURSOR`)'
          content:
