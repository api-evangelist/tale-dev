  /api/v1/websites/{id}/search:
    post:
      tags:
      - Websites
      summary: Search content
      description: 'A POST because it carries a body, not because it writes: keyword (BM25) search over this website’s crawled content — no dense leg, so no `similarity`; for that, `POST /api/v1/knowledge/search` with `corpus: "web"`. Answers `{results, total}` — each result its `url`, `title`, `content`, `chunkIndex` and `score` — a shape of its own, not the `{hits, diagnostics}` of the two knowledge-search doors (a different corpus); `limit` is a body field, so a value outside 1..100 is refused with 400 `INVALID_BODY` naming it, never clamped — the rule every body number follows.'
      operationId: searchWebsite
      security:
      - bearerAuth: []
      parameters:
      - name: X-Organization-Slug
        in: header
        required: false
        schema:
          type: string
        description: The organization to operate on. STRICTLY REQUIRED on every call, reads included, when the key holder belongs to more than one organization — without it such requests are refused with 400 `ORG_SLUG_REQUIRED` (the dashboard’s last-active organization never steers a machine call). A slug that names no organization answers 404 `ORG_SLUG_INVALID`, one the key holder is no member of 403 `ORG_FORBIDDEN`. Single-organization keys may omit it; a blank or whitespace-only value reads as the header absent. Each of the three refusals lists the slugs the key holder may send under `data.organizations`; `GET /api/v1/me` answers them too.
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: Website ID
      - name: X-Request-Id
        in: header
        required: false
        description: 'Your own correlation id, echoed back on the response and written to the platform’s log: up to 255 characters of letters, digits, `_`, `-` and `=`. Any other value is replaced by a fresh UUID (the response carries the id that was used), and uniqueness of an id you choose is yours to keep.'
        schema:
          type: string
          pattern: ^[A-Za-z0-9_=-]{1,255}$
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - query
              additionalProperties: false
              properties:
                query:
                  type: string
                  minLength: 1
                  maxLength: 1000
                limit:
                  type: integer
                  minimum: 1
                  maximum: 100
                  description: Matches to return, 1..100 (default 10); a value outside the range, or not a whole number, answers 400 `INVALID_BODY` naming `limit` — a body field is never clamped
      responses:
        '200':
          description: Matches
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebsiteSearchResults'
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            X-Tale-Api-Version:
              $ref: '#/components/headers/XTaleApiVersion'
        '400':
          description: 'A body the schema refuses (`INVALID_BODY`, the field named under `data.issues`): a blank `query`, an unknown key, or a `limit` outside 1..100 or not a whole number'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            X-Tale-Api-Version:
              $ref: '#/components/headers/XTaleApiVersion'
        '401':
          description: Missing or invalid API key (`UNAUTHORIZED`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            X-Tale-Api-Version:
              $ref: '#/components/headers/XTaleApiVersion'
            WWW-Authenticate:
              $ref: '#/components/headers/WWWAuthenticate'
        '403':
          description: '`X-Organization-Slug` names an organization the key holder is no member of (`ORG_FORBIDDEN`, with the slugs the key holder may send under `data.organizations`)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            X-Tale-Api-Version:
              $ref: '#/components/headers/XTaleApiVersion'
        '404':
          description: Website not found (`WEBSITE_NOT_FOUND`); or `X-Organization-Slug` names no organization (`ORG_SLUG_INVALID`, with the slugs the key holder may send under `data.organizations`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            X-Tale-Api-Version:
              $ref: '#/components/headers/XTaleApiVersion'
        '405':
          description: The path exists, but not for this method (`METHOD_NOT_ALLOWED`); `Allow` names the methods it serves
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            X-Tale-Api-Version:
              $ref: '#/components/headers/XTaleApiVersion'
            Allow:
              $ref: '#/components/headers/Allow'
        '413':
          description: The body exceeds this operation’s byte cap — 1 MiB unless the description says otherwise (`BODY_TOO_LARGE`); the envelope carries a `requestId`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            X-Tale-Api-Version:
              $ref: '#/components/headers/XTaleApiVersion'
        '429':
          description: 'The key holder’s request budget is spent (`RATE_LIMITED`): `Retry-After` names the wait in whole seconds and `data.retryAfterMs` in milliseconds; the envelope carries a `requestId`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            X-Tale-Api-Version:
              $ref: '#/components/headers/XTaleApiVersion'
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
        '500':
          description: Internal error (`INTERNAL_ERROR`); the envelope carries a `requestId` to quote when reporting it
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            X-Tale-Api-Version:
              $ref: '#/components/headers/XTaleApiVersion'
        '503':
          description: 'The platform’s database is restarting or cannot be reached (`DATABASE_UNAVAILABLE`): `Retry-After` names the wait in whole seconds — retry with backoff; the envelope carries a `requestId`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            X-Tale-Api-Version:
              $ref: '#/components/headers/XTaleApiVersion'
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
components:
  schemas:
    WebsitePage:
      type: object
      required:
      - url
      - title
      - wordCount
      - status
      - contentHash
      - lastCrawledAt
      - discoveredAt
      - chunksCount
      - indexed
      - failCount
      - lastError
      - lastErrorKind
      - lastErrorAt
      properties:
        url:
          type: string
        title:
          type:
          - string
          - 'null'
        wordCount:
          type: integer
        status:
          type: string
          enum:
          - discovered
          - active
          description: '`discovered`: the crawler knows the URL but no fetch has stored it yet — never attempted, or every attempt failed (then `failCount` and `lastError` say so); `active`: a fetch stored the page at least once (`indexed` says whether its chunks are in the corpus). A DISCOVERED page the site answered 404/410 for leaves the listing, and so does one `robots.txt` has come to disallow; a LISTED one the site answers 404/410 for stays `discovered` with `http_error` naming the answer and is probed again next scan.'
        contentHash:
          type:
          - string
          - 'null'
        lastCrawledAt:
          type:
          - integer
          - 'null'
          minimum: 0
          description: Epoch milliseconds of the last ATTEMPT, stored or not
        discoveredAt:
          type:
          - integer
          - 'null'
          minimum: 0
          description: Epoch milliseconds
        chunksCount:
          type: integer
        indexed:
          type: boolean
        failCount:
          type: integer
          description: 'Failed attempts in a row since the last stored fetch (or since the operator re-listed the URL); 0 when the last attempt stored the page. A discovered page stops being fetched after 5, and is probed once more after seven days; a listed one never stops. A failure of the render sandbox itself (its egress proxy refusing the connection, its browser stopping) counts nothing: the scan ends with that reason on the website'
        lastError:
          type:
          - string
          - 'null'
          description: Why the last attempt stored nothing; `null` once a fetch stores the page again
        lastErrorKind:
          type:
          - string
          - 'null'
          enum:
          - invalid_url
          - unsupported_protocol
          - insecure_public_http
          - private_ip
          - host_not_allowed
          - dns_failed
          - redirect_missing_location
          - redirect_limit_exceeded
          - response_too_large
          - response_too_small
          - network_error
          - tls_error
          - timeout
          - aborted
          - http_error
          - render_failed
          - extraction_failed
          - unsupported_content
          - robots_noindex
          - null
          description: 'The last failure’s kind: a fetch refusal (`insecure_public_http` — a redirect to a plaintext URL, a loopback included, is refused before it is dialed; `private_ip` — a redirect that resolves to a private, loopback or metadata address; `host_not_allowed` — a redirect off the registered site, which the crawler does not follow (it used to wear the `private_ip` label); `dns_failed`; `tls_error` — the certificate is expired, self-signed, untrusted or for another host, permanent until the operator fixes it; `timeout` — the page did not finish downloading within the 30-second budget, or the browser could not load it within 20 seconds; `response_too_large`; `redirect_limit_exceeded` — more than five redirects; `network_error` — any other connection failure, naming its cause; …), `http_error` (a 4xx/5xx other than 404/410; for a listed URL 404/410 too), `render_failed` (the sandboxed browser gave up), `extraction_failed` (a linked document no extractor could read), `unsupported_content` (the crawler looked and stored nothing: a content type it cannot turn into text — JSON, XML, an image, a binary download — the row stays `discovered` and its `failCount` counts the attempt), or `robots_noindex` (the origin answered `X-Robots-Tag: noindex` or carries `<meta name="robots" content="noindex">`, honoured — what an earlier scan stored is dropped); `null` when the last attempt succeeded. `lastError` is one line naming the cause, never a framework call log'
        lastErrorAt:
          type:
          - integer
          - 'null'
          minimum: 0
          description: Epoch milliseconds of the last failure
    WebsiteSearchResults:
      type: object
      required:
      - results
      - total
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/WebsiteSearchHit'
        total:
          type: integer
          description: 'How many chunks match, across the whole site — not the size of this answer: it can exceed `results.length`, which `limit` caps. This door returns only the first `limit` hits and has no pagination, so `total` is the count, not a cursor.'
    Website:
      type: object
      required:
      - id
      - organizationId
      - domain
      - scanInterval
      - createdAt
      - updatedAt
      properties:
        id:
          type: string
        organizationId:
          type: string
        domain:
          type: string
        kind:
          type:
          - string
          - 'null'
          enum:
          - site
          - list
          - null
        title:
          type:
          - string
          - 'null'
        description:
          type:
          - string
          - 'null'
        scanInterval:
          type: string
        lastScannedAt:
          type:
          - integer
          - 'null'
          minimum: 0
          description: 'When the last scan ENDED, epoch ms; `null` until the first scan finishes — `status: "scanning"` is the in-flight signal, and the page counts move while it runs'
        status:
          type:
          - string
          - 'null'
          enum:
          - scanning
          - active
          - error
          - deleting
          - null
          description: 'The SCAN’s lifecycle, not the content’s health: `scanning` — in flight (a registered site starts here); `active` — the last scan finished and stored at least one page; `error` — the last scan failed or stored no page (`metadata.lastSyncError` says why; a domain that does not resolve or an expired certificate lands here, never on `active`); `deleting` — mid removal. The obvious health check is `status === "active"`; `crawledPageCount - failedPageCount` says how many pages it holds.'
        pageCount:
          type:
          - integer
          - 'null'
          description: 'Pages the crawler knows on this site, as of the last corpus → row sync (`metadata.lastStatusSyncAt` says when): during a scan the sync runs after discovery and after every stored batch, at each link’s end and at the scan’s end, and `POST /api/v1/websites/{id}/sync` forces one'
        crawledPageCount:
          type:
          - integer
          - 'null'
          description: Pages the crawler ATTEMPTED in its scans so far — stored or not; a page whose every attempt failed counts here too (see `failedPageCount`), and `indexed` per page is on `GET /api/v1/websites/{id}/pages`. Stamped by the corpus → row sync like `pageCount`
        failedPageCount:
          type:
          - integer
          - 'null'
          description: Pages whose LAST attempt failed — each carries its `lastError` in the pages list. A page the crawler skipped on purpose (`lastErrorKind` `robots_noindex`, `unsupported_content` or `host_not_allowed`) keeps its reason but is not counted here; `null` until the next corpus → row sync stamps the row
        metadata:
          type:
          - object
          - 'null'
          additionalProperties: true
        createdAt:
          type: integer
          minimum: 0
          description: Epoch milliseconds
        updatedAt:
          type: integer
          minimum: 0
          description: Epoch milliseconds
    WebsitePatch:
      type: object
      additionalProperties: false
      description: 'The domain is immutable after create (the crawl registration is keyed by it): a body carrying a `domain` other than the stored one is refused with 400 `WEBSITE_DOMAIN_IMMUTABLE` — delete the website and re-add it under the new domain. The stored value itself may be echoed, as a client that sends the resource it read does.'
      properties:
        title:
          type: string
          maxLength: 200
        description:
          type: string
          maxLength: 2000
        scanInterval:
          type: string
          enum:
          - 60m
          - 6h
          - 12h
          - 1d
          - 5d
          - 7d
          - 30d
        domain:
          type: string
          description: 'Echo only: the stored value, as a client that sends the resource it read does (compared without regard to case or surrounding whitespace). Any other value is refused with 400 `WEBSITE_DOMAIN_IMMUTABLE`; the domain itself never changes.'
    WebsiteSearchHit:
      type: object
      required:
      - url
      - title
      - content
      - chunkIndex
      - score
      properties:
        url:
          type: string
        title:
          type:
          - string
          - 'null'
        content:
          type: string
          description: The matching passage
        chunkIndex:
          type: integer
        score:
          type: number
          description: 'The BM25 weight of the keyword match (ParadeDB `paradedb.score`): unbounded and comparable only within one response — never a cosine or a confidence, and never comparable across sites or calls. `0` on every hit when the knowledge database lacks ParadeDB and the door fell back to a substring match. This door has no dense leg; for `similarity` and `minSimilarity`, use `POST /api/v1/knowledge/search` with `corpus: "web"`.'
    WebsitePageList:
      type: object
      x-tale-pagination: offset
      required:
      - pages
      - total
      - offset
      - hasMore
      - isDone
      - continueCursor
      properties:
        pages:
          type: array
          items:
            $ref: '#/components/schemas/WebsitePage'
        total:
          type: integer
        offset:
          type: integer
        hasMore:
          type: boolean
        isDone:
          type: boolean
          description: True when the window reached the end (`!hasMore`)
        continueCursor:
          type: string
          description: Pass back as `cursor` for the next window — the next `offset`, signed; empty when `isDone`
    Error:
      type: object
      required:
      - error
      - code
      properties:
        error:
          type: string
          description: What went wrong
        code:
          type: string
          enum:
          - ACTOR_AMBIGUOUS
          - ACTOR_DISABLED
          - ACTOR_FORBIDDEN
          - ACTOR_NOT_FOUND
          - ACTOR_REBOUND
          - ACTOR_UNVERIFIED
          - API_KEY_SCOPE_FORBIDDEN
          - ATTACHMENT_NOT_FOUND
          - ATTACHMENT_NOT_OWNED
          - ATTACHMENT_NOT_STAGED
          - ATTACHMENT_SIZE_MISMATCH
          - AUTHOR_UNVERIFIED
          - AUTOMATION_DELIVERY_SCOPE_MISMATCH
          - AUTOMATION_HAS_ACTIVE_RUNS
          - AUTOMATION_INPUT_INVALID
          - AUTOMATION_NOT_DEPLOYED
