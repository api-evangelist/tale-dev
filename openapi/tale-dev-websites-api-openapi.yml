    get:
      tags:
      - Websites
      summary: Fetch pages
      description: 'The crawled pages of a website — OFFSET-paginated (`offset` + `limit`, default 100), answering `{pages, total, offset, hasMore}` and, beside them, the keyset pair every other list answers: `isDone`, and a `continueCursor` that stands for the next `offset` — pass it back as `cursor` until `isDone`, the one loop for every list. `cursor` and `offset` together answer 400 `INVALID_QUERY`.'
      operationId: listWebsitePages
      security:
      - bearerAuth: []
      parameters:
      - name: X-Organization-Slug
        in: header
        required: false
        schema:
          type: string
        description: The organization to operate on. STRICTLY REQUIRED on every call, reads included, when the key holder belongs to more than one organization — without it such requests are refused with 400 `ORG_SLUG_REQUIRED` (the dashboard’s last-active organization never steers a machine call). A slug that names no organization answers 404 `ORG_SLUG_INVALID`, one the key holder is no member of 403 `ORG_FORBIDDEN`. Single-organization keys may omit it; a blank or whitespace-only value reads as the header absent. Each of the three refusals lists the slugs the key holder may send under `data.organizations`; `GET /api/v1/me` answers them too.
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: Website ID
      - name: cursor
        in: query
        required: false
        schema:
          type: string
        description: The previous window’s `continueCursor`, unchanged — opaque; the alternative to `offset`, never beside it. A value this list did not answer is refused with 400 `INVALID_CURSOR`
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
        description: 'Rows to skip (default 0). A whole number: a negative value is clamped to 0, while a fractional or non-numeric one answers 400 `INVALID_QUERY`'
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 500
