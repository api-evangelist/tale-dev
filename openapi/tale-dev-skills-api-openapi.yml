openapi: 3.2.0
info:
  title: Tale Dev Skills API
  version: 3.27.0
  contact:
    name: Tale
    url: https://tale.dev
  description: 'Operations tagged Skills across 2 of this provider''s published API definitions: tale-dev-openapi-original.json, tale-dev-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: '{origin}'
  description: The deployment this document describes — `GET /openapi.json` on a running instance fills it in
  variables:
    origin:
      default: https://your-host.example.com
      description: Scheme and host of the Tale deployment
security:
- bearerAuth: []
tags:
- name: Skills
  description: The organization’s skills.
paths:
  /api/v1/skills:
    get:
      tags:
      - Skills
      summary: List skills
      description: The skills the key holder can see (their own, their teams’, the organization’s) — a complete set, not paginated. `failures` names skill bundles that could not be read.
      operationId: listSkills
      security:
      - bearerAuth: []
      responses:
        '200':
          description: The organization’s skills
          content:
            application/json:
              schema:
                type: object
                description: 'The complete set under `skills` — never paginated: no `isDone`, no cursor to follow'
                x-tale-pagination: none
                required:
                - skills
                - failures
                properties:
                  skills:
                    type: array
                    items:
                      $ref: '#/components/schemas/SkillSummary'
                  failures:
                    type: array
                    description: Skill bundles on disk that could not be read — each names the bundle and why
                    items:
                      type: object
                      required:
                      - slug
                      - path
                      - message
                      properties:
                        slug:
                          type: string
                        path:
                          type: string
                          description: The bundle’s path inside the organization’s skills tree
                        message:
                          type: string
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            X-Tale-Api-Version:
              $ref: '#/components/headers/XTaleApiVersion'
        '304':
          description: Not Modified — `If-None-Match` named the current `ETag`, so the body is not sent
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            X-Tale-Api-Version:
              $ref: '#/components/headers/XTaleApiVersion'
        '400':
          description: 'Invalid request: a body the schema refuses — a wrong type, an unknown key, a missing field, a NUL or an unpaired surrogate, a whole number beyond 2^53 − 1 (`INVALID_BODY`, every problem under `data.issues`); a query parameter the operation does not take, given twice or left blank (`INVALID_QUERY`); on a list, a `limit` that is not a whole number (`INVALID_LIMIT`) or a `cursor` this list did not answer (`INVALID_CURSOR`)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            X-Tale-Api-Version:
              $ref: '#/components/headers/XTaleApiVersion'
        '401':
          description: Missing or invalid API key (`UNAUTHORIZED`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            X-Tale-Api-Version:
              $ref: '#/components/headers/XTaleApiVersion'
            WWW-Authenticate:
              $ref: '#/components/headers/WWWAuthenticate'
        '403':
          description: '`X-Organization-Slug` names an organization the key holder is no member of (`ORG_FORBIDDEN`, with the slugs the key holder may send under `data.organizations`)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            X-Tale-Api-Version:
              $ref: '#/components/headers/XTaleApiVersion'
        '404':
          description: '`X-Organization-Slug` names no organization (`ORG_SLUG_INVALID`, with the slugs the key holder may send under `data.organizations`)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            X-Tale-Api-Version:
              $ref: '#/components/headers/XTaleApiVersion'
        '405':
          description: The path exists, but not for this method (`METHOD_NOT_ALLOWED`); `Allow` names the methods it serves
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            X-Tale-Api-Version:
              $ref: '#/components/headers/XTaleApiVersion'
            Allow:
              $ref: '#/components/headers/Allow'
        '429':
          description: 'The key holder’s request budget is spent (`RATE_LIMITED`): `Retry-After` names the wait in whole seconds and `data.retryAfterMs` in milliseconds; the envelope carries a `requestId`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            X-Tale-Api-Version:
              $ref: '#/components/headers/XTaleApiVersion'
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
        '500':
          description: Internal error (`INTERNAL_ERROR`); the envelope carries a `requestId` to quote when reporting it
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            X-Tale-Api-Version:
              $ref: '#/components/headers/XTaleApiVersion'
        '503':
          description: 'The platform’s database is restarting or cannot be reached (`DATABASE_UNAVAILABLE`): `Retry-After` names the wait in whole seconds — retry with backoff; the envelope carries a `requestId`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            X-Tale-Api-Version:
              $ref: '#/components/headers/XTaleApiVersion'
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
      parameters:
      - name: X-Organization-Slug
        in: header
        required: false
        schema:
          type: string
        description: The organization to operate on. STRICTLY REQUIRED on every call, reads included, when the key holder belongs to more than one organization — without it such requests are refused with 400 `ORG_SLUG_REQUIRED` (the dashboard’s last-active organization never steers a machine call). A slug that names no organization answers 404 `ORG_SLUG_INVALID`, one the key holder is no member of 403 `ORG_FORBIDDEN`. Single-organization keys may omit it; a blank or whitespace-only value reads as the header absent. Each of the three refusals lists the slugs the key holder may send under `data.organizations`; `GET /api/v1/me` answers them too.
      - name: X-Request-Id
        in: header
        required: false
        description: 'Your own correlation id, echoed back on the response and written to the platform’s log: up to 255 characters of letters, digits, `_`, `-` and `=`. Any other value is replaced by a fresh UUID (the response carries the id that was used), and uniqueness of an id you choose is yours to keep.'
        schema:
          type: string
          pattern: ^[A-Za-z0-9_=-]{1,255}$
    servers:
    - url: '{origin}'
      description: The deployment this document describes — `GET /openapi.json` on a running instance fills it in
      variables:
        origin:
          default: https://your-host.example.com
          description: Scheme and host of the Tale deployment
  /api/v1/skills/{slug}:
    get:
      tags:
      - Skills
      summary: Get skill
      operationId: getSkill
      description: 'One skill bundle: the summary fields plus the body and the file list, with the document’s entity tag as `ETag` — send it back as `If-Match` on a save, or as `If-None-Match` on the next read to get 304 while the document is unchanged. The tag covers the SKILL.md content only: `canEdit`, `ownerName`, `updatedBy` and `updatedByName` can change while it stands (a member leaves or is renamed, an edit changes only the sharing), so a 304 does not revalidate them — read without `If-None-Match` when you need them current. A malformed slug answers 404 like an unknown one.'
      security:
      - bearerAuth: []
      parameters:
      - name: X-Organization-Slug
        in: header
        required: false
        schema:
          type: string
        description: The organization to operate on. STRICTLY REQUIRED on every call, reads included, when the key holder belongs to more than one organization — without it such requests are refused with 400 `ORG_SLUG_REQUIRED` (the dashboard’s last-active organization never steers a machine call). A slug that names no organization answers 404 `ORG_SLUG_INVALID`, one the key holder is no member of 403 `ORG_FORBIDDEN`. Single-organization keys may omit it; a blank or whitespace-only value reads as the header absent. Each of the three refusals lists the slugs the key holder may send under `data.organizations`; `GET /api/v1/me` answers them too.
      - name: slug
        in: path
        required: true
        schema:
          type: string
          pattern: ^[a-z0-9]+(-[a-z0-9]+)*$
          maxLength: 64
        description: The skill slug — at most 64 characters of lowercase letters, digits and single hyphens; `anthropic` and `claude` are reserved. Reads and the delete answer a malformed slug as absent (404 `SKILL_NOT_FOUND`); the save refuses it with 400 `INVALID_SKILL_SLUG`, naming the rule it breaks.
      - name: If-None-Match
        in: header
        required: false
        schema:
          type: string
        description: 'The `etag` you hold (or a list, or `*`): when it names the current document — weak comparison, so a `W/` prefix counts — the answer is 304 with the tag and no body'
      - name: X-Request-Id
        in: header
        required: false
        description: 'Your own correlation id, echoed back on the response and written to the platform’s log: up to 255 characters of letters, digits, `_`, `-` and `=`. Any other value is replaced by a fresh UUID (the response carries the id that was used), and uniqueness of an id you choose is yours to keep.'
        schema:
          type: string
          pattern: ^[A-Za-z0-9_=-]{1,255}$
      responses:
        '200':
          description: The skill
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Skill'
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            X-Tale-Api-Version:
              $ref: '#/components/headers/XTaleApiVersion'
        '304':
          description: 'Not modified: `If-None-Match` named the current document (weakly — the `W/` and the edge-suffixed `"…-gzip"` forms match); `ETag` repeats the tag, `Cache-Control` says `private, no-cache` as the 200 does, no body'
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            X-Tale-Api-Version:
              $ref: '#/components/headers/XTaleApiVersion'
        '400':
          description: 'Invalid request: a body the schema refuses — a wrong type, an unknown key, a missing field, a NUL or an unpaired surrogate, a whole number beyond 2^53 − 1 (`INVALID_BODY`, every problem under `data.issues`); a query parameter the operation does not take, given twice or left blank (`INVALID_QUERY`); on a list, a `limit` that is not a whole number (`INVALID_LIMIT`) or a `cursor` this list did not answer (`INVALID_CURSOR`)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            X-Tale-Api-Version:
              $ref: '#/components/headers/XTaleApiVersion'
        '401':
          description: Missing or invalid API key (`UNAUTHORIZED`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            X-Tale-Api-Version:
              $ref: '#/components/headers/XTaleApiVersion'
            WWW-Authenticate:
              $ref: '#/components/headers/WWWAuthenticate'
        '403':
          description: '`X-Organization-Slug` names an organization the key holder is no member of (`ORG_FORBIDDEN`, with the slugs the key holder may send under `data.organizations`)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            X-Tale-Api-Version:
              $ref: '#/components/headers/XTaleApiVersion'
        '404':
          description: No such skill, none this key may see, or a malformed slug (`SKILL_NOT_FOUND`); or `X-Organization-Slug` names no organization (`ORG_SLUG_INVALID`, with the slugs the key holder may send under `data.organizations`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            X-Tale-Api-Version:
              $ref: '#/components/headers/XTaleApiVersion'
        '405':
          description: The path exists, but not for this method (`METHOD_NOT_ALLOWED`); `Allow` names the methods it serves
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            X-Tale-Api-Version:
              $ref: '#/components/headers/XTaleApiVersion'
            Allow:
              $ref: '#/components/headers/Allow'
        '429':
          description: 'The key holder’s request budget is spent (`RATE_LIMITED`): `Retry-After` names the wait in whole seconds and `data.retryAfterMs` in milliseconds; the envelope carries a `requestId`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            X-Tale-Api-Version:
              $ref: '#/components/headers/XTaleApiVersion'
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
        '500':
          description: Internal error (`INTERNAL_ERROR`); the envelope carries a `requestId` to quote when reporting it
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            X-Tale-Api-Version:
              $ref: '#/components/headers/XTaleApiVersion'
        '503':
          description: 'The platform’s database is restarting or cannot be reached (`DATABASE_UNAVAILABLE`): `Retry-After` names the wait in whole seconds — retry with backoff; the envelope carries a `requestId`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            X-Tale-Api-Version:
              $ref: '#/components/headers/XTaleApiVersion'
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
    put:
      tags:
      - Skills
      summary: Create or update skill
      description: 'Creates the bundle when the slug is free — **201** — and updates it in place otherwise — **200** — so the status is the create-or-update signal (the same convention as a task materialisation) and a sync that mirrors bundles from elsewhere needs no read first: `description` and `body` are required; an omitted `icon`, `labels`, `teams`, `visibility` or `disableModelInvocation` keeps its stored value, `null` clears `icon` or `labels`, and `disableModelInvocation: false` drops the flag. A body that does not end with a newline gets one appended. The save rewrites `SKILL.md` only — every other file of the bundle stays, and frontmatter keys the body does not carry (`license`, `recommended-packages`, community keys) are preserved; replacing a whole bundle is the app’s zip upload. Guard an update with `If-Match`: the `etag` you last read (the GET’s `ETag`) — a document that changed since, or is not there, answers 412 `SKILL_STALE` with the current tag in `data.etag` and nothing is written. Send `If-None-Match: *` to create only — a slug that already has a bundle then answers 412 `SKILL_EXISTS` and nothing is written. The body is validated before the preconditions are evaluated. A save whose composed `SKILL.md` is byte-identical to the stored document writes nothing — 200 with the stored `etag` and `updatedAt`, no history entry — the preconditions still evaluated first, so a stale `If-Match` on an identical body is still 412. Every skill carries `canEdit`: whether this key may edit the bundle; shipped skills are organization bundles an administrator may overwrite, so check it before a save that means to replace one. A save that changes the document is recorded in the organization’s audit log as the key’s user — `skill.created`, `skill.updated`, and `skill.sharing_changed` when `visibility` or `teams` moved — and an update makes that user the skill’s `updatedBy`; a save that writes nothing records nothing. An organization may reserve organization-wide skills (its `skill_sharing` policy: Editors and above, or owners and administrators, plus members granted `tale:skills.publish`): a key holder outside that set gets 403 `SKILL_PUBLISH_FORBIDDEN` for a save that would create a `visibility: org` skill, widen one to `org`, or change an `org` skill in place, and the refusal is audited as `skill.publish_denied`; narrowing to `team`, a byte-identical save and deleting the skill stay open, and `GET /api/v1/me` answers `capabilities.skillPublish`. The body may run to 4 MiB — this operation’s own cap, so the worst JSON escaping of a full-size `body` still fits; past it the answer is 413 `BODY_TOO_LARGE`.'
      operationId: saveSkill
      security:
      - bearerAuth: []
      parameters:
      - name: X-Organization-Slug
        in: header
        required: false
        schema:
          type: string
        description: The organization to operate on. STRICTLY REQUIRED on every call, reads included, when the key holder belongs to more than one organization — without it such requests are refused with 400 `ORG_SLUG_REQUIRED` (the dashboard’s last-active organization never steers a machine call). A slug that names no organization answers 404 `ORG_SLUG_INVALID`, one the key holder is no member of 403 `ORG_FORBIDDEN`. Single-organization keys may omit it; a blank or whitespace-only value reads as the header absent. Each of the three refusals lists the slugs the key holder may send under `data.organizations`; `GET /api/v1/me` answers them too.
      - name: slug
        in: path
        required: true
        schema:
          type: string
          pattern: ^[a-z0-9]+(-[a-z0-9]+)*$
          maxLength: 64
        description: The skill slug — at most 64 characters of lowercase letters, digits and single hyphens; `anthropic` and `claude` are reserved. Reads and the delete answer a malformed slug as absent (404 `SKILL_NOT_FOUND`); the save refuses it with 400 `INVALID_SKILL_SLUG`, naming the rule it breaks.
      - name: If-Match
        in: header
        required: false
        schema:
          type: string
        description: 'The `etag` you last read — strong comparison, so a `W/` tag never matches — or `*`: the save proceeds only when the stored SKILL.md still carries that tag (`*`: when one is stored at all); otherwise 412 `SKILL_STALE`, `data.etag` naming the current tag (`null` when nothing is stored), nothing written. Evaluated before `If-None-Match`, inside the same lock as the write.'
      - name: If-None-Match
        in: header
        required: false
        schema:
          type: string
        description: 'Send `*` to create only: a slug that already has a bundle answers 412 `SKILL_EXISTS` and nothing is written. A tag list refuses the same way when the stored document weakly matches one of its tags (its current `etag`, with or without `W/`); any other value matches nothing and the write goes ahead.'
      - name: X-Request-Id
        in: header
        required: false
        description: 'Your own correlation id, echoed back on the response and written to the platform’s log: up to 255 characters of letters, digits, `_`, `-` and `=`. Any other value is replaced by a fresh UUID (the response carries the id that was used), and uniqueness of an id you choose is yours to keep.'
        schema:
          type: string
          pattern: ^[A-Za-z0-9_=-]{1,255}$
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - description
              - body
              additionalProperties: false
              properties:
                description:
                  type: string
                  minLength: 1
                  maxLength: 1024
                body:
                  type: string
                  maxLength: 507893
                  description: 'Markdown, at most 507893 bytes of UTF-8 (bytes, not characters — the maxLength here is the byte budget): the composed SKILL.md, frontmatter included, is capped at 512 KiB, and this budget always fits inside it'
                visibility:
                  type: string
                  enum:
                  - team
                  - org
                  description: 'Who sees the skill; omitted keeps the stored value (a new skill is `org`, which an organization that reserves organization-wide skills refuses with 403 `SKILL_PUBLISH_FORBIDDEN` when the key holder may not publish — send `team` with `teams` instead). `private` is retired: it cannot be set, only kept by omission on a bundle that already carries it'
                teams:
                  type: array
                  items:
                    type: string
                    minLength: 1
                    maxLength: 128
                  maxItems: 32
                  description: Team ids a `team` skill is shared with; each must be a team of this organization (400 `SKILL_TEAM_UNKNOWN` otherwise)
                icon:
                  type:
                  - string
                  - 'null'
                  maxLength: 128
                  description: An Iconify id (`lucide:book-open`); `null` clears it, omitted keeps it
                labels:
                  type:
                  - array
                  - 'null'
                  items:
                    type: string
                    minLength: 1
                    maxLength: 40
                  maxItems: 8
                  description: '`null` clears them, omitted keeps them'
                disableModelInvocation:
                  type: boolean
                  description: True keeps the model from reaching for the skill on its own (it stays available by explicit name); omitted keeps the stored value, `false` drops the flag
      responses:
        '200':
          description: The skill this save updated in place — its `etag` names the version just written, or the stored one when the body changed nothing (then `updatedAt` stays too)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Skill'
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            X-Tale-Api-Version:
              $ref: '#/components/headers/XTaleApiVersion'
        '201':
          description: The skill this save created (the slug was free) — its `etag` names the version just written
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Skill'
          headers:
            Location:
              $ref: '#/components/headers/Location'
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            X-Tale-Api-Version:
              $ref: '#/components/headers/XTaleApiVersion'
        '400':
          description: Invalid body (`INVALID_BODY` — an unknown key, a body over the byte budget, a visibility outside `team`/`org`), a malformed slug (`INVALID_SKILL_SLUG`, naming the rule it breaks), an invalid skill (`INVALID_SKILL`), or a team id the organization does not have (`SKILL_TEAM_UNKNOWN`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            X-Tale-Api-Version:
              $ref: '#/components/headers/XTaleApiVersion'
        '401':
          description: Missing or invalid API key (`UNAUTHORIZED`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            X-Tale-Api-Version:
              $ref: '#/components/headers/XTaleApiVersion'
            WWW-Authenticate:
              $ref: '#/components/headers/WWWAuthenticate'
        '403':
          description: Not editable with this key (`SKILL_FORBIDDEN`), a team this key holder is not in (`TEAM_ACCESS_DENIED`), or an organization-wide skill the organization reserves and this key holder may not publish (`SKILL_PUBLISH_FORBIDDEN` — see `capabilities.skillPublish` on `GET /api/v1/me`); or `X-Organization-Slug` names an organization the key holder is no member of (`ORG_FORBIDDEN`, with the slugs the key holder may send under `data.organizations`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            X-Tale-Api-Version:
              $ref: '#/components/headers/XTaleApiVersion'
        '404':
          description: '`X-Organization-Slug` names no organization (`ORG_SLUG_INVALID`, with the slugs the key holder may send under `data.organizations`)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            X-Tale-Api-Version:
              $ref: '#/components/headers/XTaleApiVersion'
        '405':
          description: The path exists, but not for this method (`METHOD_NOT_ALLOWED`); `Allow` names the methods it serves
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            X-Tale-Api-Version:
              $ref: '#/components/headers/XTaleApiVersion'
            Allow:
              $ref: '#/components/headers/Allow'
        '412':
          description: 'A precondition failed and nothing was written: `If-Match` named no tag matching the stored SKILL.md, or `*` with nothing stored (`SKILL_STALE` — `data.etag` carries the current tag, `null` when nothing is stored); or `If-None-Match: *` was sent and the slug already has a bundle, or a tag list named its current tag (`SKILL_EXISTS`)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
