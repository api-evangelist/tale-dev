  /api/v1/skills/{slug}/files/{path}:
    get:
      tags:
      - Skills
      summary: Download a bundle file
      operationId: downloadSkillFile
      description: 'The bytes of one file of the bundle — `SKILL.md` included — exactly as the organization’s tree holds it: `application/octet-stream`, `Content-Length`, the file’s own name in an RFC 6266 `Content-Disposition`, private and uncacheable; a HEAD request answers the headers alone. The skill’s `files[]` is the only legitimate source of paths: a path it would never list — a traversal, a dot-entry, `node_modules/…` — reads as a file the bundle does not have (404 `SKILL_FILE_NOT_FOUND`), where an unknown, invisible or malformed slug is 404 `SKILL_NOT_FOUND`. A raw dot-segment in the URL (`../`, or `%2e%2e/` — the dots encoded, the slash not) never reaches this operation: the edge refuses it first with its own 404 `NOT_FOUND`, without `X-Tale-Api-Version`; a spelling whose slashes are encoded too (`%2e%2e%2f…`) does, and reads as `SKILL_FILE_NOT_FOUND`. A bundle the file layer refuses to read — a planted symlink, a file over the 4 MiB staging cap — answers 422 `SKILL_MALFORMED`.'
      security:
      - bearerAuth: []
      parameters:
      - name: X-Organization-Slug
        in: header
        required: false
        schema:
          type: string
        description: The organization to operate on. STRICTLY REQUIRED on every call, reads included, when the key holder belongs to more than one organization — without it such requests are refused with 400 `ORG_SLUG_REQUIRED` (the dashboard’s last-active organization never steers a machine call). A slug that names no organization answers 404 `ORG_SLUG_INVALID`, one the key holder is no member of 403 `ORG_FORBIDDEN`. Single-organization keys may omit it; a blank or whitespace-only value reads as the header absent. Each of the three refusals lists the slugs the key holder may send under `data.organizations`; `GET /api/v1/me` answers them too.
      - name: slug
        in: path
        required: true
        schema:
          type: string
          pattern: ^[a-z0-9]+(-[a-z0-9]+)*$
          maxLength: 64
        description: The skill slug — at most 64 characters of lowercase letters, digits and single hyphens; `anthropic` and `claude` are reserved. Reads and the delete answer a malformed slug as absent (404 `SKILL_NOT_FOUND`); the save refuses it with 400 `INVALID_SKILL_SLUG`, naming the rule it breaks.
      - name: path
        in: path
        required: true
        schema:
          type: string
        description: The file’s bundle-relative path exactly as `files[].path` lists it — nested segments separated by `/`, raw or percent-encoded (`%2F`)
      - name: If-None-Match
        in: header
        required: false
        schema:
          type: string
        description: 'The `ETag` a previous answer carried (the tag is over the file’s bytes; the weak `W/` form matches too): unchanged bytes answer 304 with no body. Takes precedence over `If-Modified-Since`.'
      - name: If-Modified-Since
        in: header
        required: false
        schema:
          type: string
        description: 'The `Last-Modified` a previous answer carried: a file not modified since answers 304, judged at whole-second precision. Ignored when `If-None-Match` is present.'
      - name: X-Request-Id
        in: header
        required: false
        description: 'Your own correlation id, echoed back on the response and written to the platform’s log: up to 255 characters of letters, digits, `_`, `-` and `=`. Any other value is replaced by a fresh UUID (the response carries the id that was used), and uniqueness of an id you choose is yours to keep.'
        schema:
          type: string
          pattern: ^[A-Za-z0-9_=-]{1,255}$
      responses:
        '200':
          description: The bytes, named by `Content-Disposition`
          headers:
            Content-Disposition:
              $ref: '#/components/headers/ContentDisposition'
            Content-Length:
              $ref: '#/components/headers/ContentLength'
            ETag:
              $ref: '#/components/headers/ETag'
            Last-Modified:
              $ref: '#/components/headers/LastModified'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            X-Tale-Api-Version:
              $ref: '#/components/headers/XTaleApiVersion'
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '304':
          description: Not Modified — `If-None-Match` named the current `ETag` (or `If-Modified-Since` the current `Last-Modified`), so no bytes are sent; `ETag`, `Last-Modified` and `Cache-Control` ride along
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Last-Modified:
              $ref: '#/components/headers/LastModified'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            X-Tale-Api-Version:
              $ref: '#/components/headers/XTaleApiVersion'
        '400':
          description: 'Invalid request: a body the schema refuses — a wrong type, an unknown key, a missing field, a NUL or an unpaired surrogate, a whole number beyond 2^53 − 1 (`INVALID_BODY`, every problem under `data.issues`); a query parameter the operation does not take, given twice or left blank (`INVALID_QUERY`); on a list, a `limit` that is not a whole number (`INVALID_LIMIT`) or a `cursor` this list did not answer (`INVALID_CURSOR`)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            X-Tale-Api-Version:
              $ref: '#/components/headers/XTaleApiVersion'
        '401':
