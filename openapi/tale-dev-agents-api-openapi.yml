          content:
            application/json:
              schema:
                type: object
                required:
                - agent
                properties:
                  agent:
                    $ref: '#/components/schemas/ProjectAgent'
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            X-Tale-Api-Version:
              $ref: '#/components/headers/XTaleApiVersion'
        '304':
