components:
  schemas:
    AutomationVersion:
      type: object
      required:
      - version
      - testsPassed
      - testsCheckedAt
      - createdBy
      - createdAt
      - deployed
      properties:
        version:
          type: integer
        message:
          type:
          - string
          - 'null'
        testsPassed:
          type:
          - boolean
          - 'null'
          description: The last run of this version’s tests — null while none was recorded (no tests, or never run), else the save’s or the deploy gate’s verdict, the latest winning; a gate refusal persists its `false`
        testsCheckedAt:
          type:
          - integer
          - 'null'
          minimum: 0
          description: When `testsPassed` was last judged; null beside a null verdict, and null beside a verdict recorded before the time was kept (0.5.23 and earlier) — a known verdict of unknown age, never backfilled. Branch on `testsPassed` for the verdict and on this field for its freshness only.
        createdBy:
          type: string
          description: 'Who saved the version: `api-key:<userId>` for a save through the MCP endpoint, the bare user id for a save from the product or its builder, or `system:provisioning` for a version the platform seeded when it provisioned the organization (the built-in connector automations). Split on the first `:`; a value without one is a user id.'
        createdAt:
          type: integer
          minimum: 0
          description: Epoch milliseconds
        deployed:
          type: boolean
          description: Whether this is the version live runs execute
    LegacyRunQuarantine:
      type: object
      additionalProperties: false
      description: A legacy execution whose external effects or termination cannot be proven. Present on held runs. A recorded stop request does not resolve the hold or establish that work stopped.
      required:
      - reason
      - observedAt
      - claimEpoch
      - priorStatus
      - resolution
      properties:
        reason:
          type: string
          enum:
          - legacy_execution_unproven
        observedAt:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        claimEpoch:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        priorStatus:
          type: string
          enum:
          - queued
          - running
          - waiting
        resolution:
          type:
          - object
          - 'null'
          additionalProperties: false
          required:
          - action
          - actor
          - at
          properties:
            action:
              type: string
              enum:
              - stop
            actor:
              type: string
              minLength: 1
              maxLength: 200
            at:
              type: integer
              minimum: 0
              maximum: 9007199254740991
    RunSummary:
      type: object
      description: One run as a listing reports it — identity, scope, status and timing. The input, output, trace, effects and checkpoints of the full `Run` are inlined only when `include` names them; the single read answers the full row.
      required:
      - id
      - runId
      - name
      - version
      - projectId
      - status
      - mode
      - startedBy
      - startedAt
      properties:
        id:
          type: string
          description: The run id — the name the full read uses; `runId` carries the same value
        runId:
          type: string
          description: The run id again, under the name the start answered — one value under both names
        name:
          type: string
          description: 'The automation the run was started as. Runs outlive their automation: after `DELETE /api/v1/automations/{name}` the rows stay listed and readable by id under this name, which `GET /api/v1/automations/{name}` then answers 404 for.'
        version:
          type: integer
        projectId:
          type:
          - string
          - 'null'
          description: URL project for a project run; null for an organization run
        status:
          type: string
          enum:
          - queued
          - running
          - waiting
          - quarantined
          - success
          - failed
          - cancelled
        mode:
          type: string
          enum:
          - mock
          - live
        startedBy:
          type: string
          description: 'What started the run — one of four forms: `api-key:<userId>` (a start through this API or the MCP endpoint), `user:<userId>` (a start from the product), `trigger:<triggerId>` (a schedule, webhook or event — the id the trigger read answers), or a bare user id on runs the in-product builder recorded before it prefixed them. Split on the first `:`; treat a value without one as a user id.'
        startedVia:
          type: string
          enum:
          - schedule
          - webhook
          - event
          description: Which kind of trigger started a `trigger:<id>` run — read off the run’s own input, so it stays true after the binding changes kind. Absent on a run a person or an API key started.
        detail:
          type: string
          description: 'The failure or wait reason, when the run has one. While `waiting` it names the park: `approval:<approvalId>`, `agent:<nodeId>`, `room:<nodeId>`, `repeat:<nodeId>` or `in_doubt:<nodeId>` — `waitingFor` is the field to branch on; when `failed`, the failure sentence, and `failureCode` the stable cause — the sentence is not contractual.'
        failureCode:
          type: string
          enum:
          - node_error
          - connector_error
          - llm_output_invalid
          - approval_rejected
          - execution_limit
          - automation_deleted
          - engine_incompatible
          - effect_in_doubt
          - missing_api_key
          - credit_exhausted
          - model_not_entitled
          - auth_error
          - model_not_found
          - unsupported_parameter
          - output_cap_too_high
          - token_limit
          - rate_limited
          - content_filter
          - context_length
          - provider_unreachable
          - provider_error
          - budget_exceeded
          - harness_error
          - turn_crashed
          - session_gone
          - start_failed
          - harvest_failed
          - resume_failed
          - deadline
          - ask_expired
          description: 'Why a `failed` run failed — present only with `status: "failed"` on a run that failed on a build that records it. See `Run.failureCode` for the vocabulary and which codes are worth a retry.'
        waitingFor:
          type: string
          enum:
          - approval
          - ask
          - in_doubt
          - agent
          - room
          - repeat
          description: 'Present only while `status` is `waiting`: what the run is parked on. `approval` — a person’s decision on a gate; `ask` — a question a person has to answer; `in_doubt` — a write the run was making when its server stopped may or may not have reached its service, and a person must decide how to continue (in the app: run it again, skip it, or fail the run); `agent` — an agent turn still running, no one to page; `room` — an agent turn whose start waits for sandbox room, no one to page; `repeat` — a node polling until its `repeatUntil` condition holds, no one to page. "Runs that need a human" is `waitingFor` in (`approval`, `ask`, `in_doubt`), never `status=waiting` alone.'
        legacyQuarantine:
          $ref: '#/components/schemas/LegacyRunQuarantine'
        resumeCount:
          type: integer
          minimum: 0
          description: 'How often the run moved to another server: a server that was being updated or restarted handed it on, or another one took it over after its own stopped responding. Steps it had finished never run again. `Run` always carries it; `RunSummary` omits it while it is 0.'
        lastResume:
          type: object
          required:
          - reason
          - at
          additionalProperties: false
          description: Why and when the run last moved to another server; absent while it never did. `shutdown` — its server was being updated or restarted and handed it on; `lease_expired` — its server stopped responding and another one took it over.
          properties:
            reason:
              type: string
              enum:
              - shutdown
              - lease_expired
            at:
              type: integer
              minimum: 0
              description: Epoch milliseconds
        stalled:
          type: boolean
          description: 'True while a `running` run waits for a server to take it over after its own stopped (the app reads it as “Interrupted — resuming”): nothing is working on it right now, and another server picks it up within about a minute and a half. `Run` always carries it; `RunSummary` carries it only while true.'
        startedAt:
          type: integer
          minimum: 0
          description: Epoch milliseconds
        finishedAt:
          type: integer
          minimum: 0
          description: Epoch ms; absent while the run is not terminal
        input:
          description: With `include=input`
        output:
          description: With `include=output`
        trace:
          description: With `include=trace`
        effects:
          description: With `include=effects`
        checkpoints:
          description: With `include=checkpoints`
    Automation:
      type: object
      required:
      - name
      - version
      - document
      - testsPassed
      - testsCheckedAt
      - deployedVersion
      - projectIds
      - createdBy
      - createdAt
      properties:
        name:
          type: string
        version:
          type: integer
        document:
          type: object
          description: 'The authored content: `name`, optional `description`, `inputs`, `nodes` (the node grammar the MCP `get_docs` tool documents), optional `output` and `tests`.'
          properties:
            version:
              type: integer
            name:
              type: string
            description:
              type: string
            inputs:
              type: object
              additionalProperties: true
            nodes:
              type: array
              items:
                type: object
                additionalProperties: true
            output: {}
            tests:
              type: array
              items:
                type: object
                additionalProperties: true
            ui:
              type: object
              additionalProperties: true
          additionalProperties: true
        message:
          type: string
        testsPassed:
          type:
          - boolean
          - 'null'
          description: 'The last run of this version’s tests: null — no verdict (a document without tests, or one never run); true — they passed, at the save that ran them (an MCP save of a document with tests) or at the deploy gate; false — they failed, at the save or at the gate, which persists its refusal. The latest verdict wins; `testsCheckedAt` says when it was reached.'
        testsCheckedAt:
          type:
          - integer
          - 'null'
          minimum: 0
          description: When `testsPassed` was last judged; null beside a null verdict, and null beside a verdict recorded before the time was kept (0.5.23 and earlier) — a known verdict of unknown age, never backfilled. Branch on `testsPassed` for the verdict and on this field for its freshness only.
        deployedVersion:
          type:
          - integer
          - 'null'
          description: null while nothing is deployed
        projectIds:
          type: array
          items:
            type: string
          description: The projects this automation is installed in, limited to those the key holder can see
        createdBy:
          type: string
          description: Who created the automation — the same vocabulary as `AutomationVersion.createdBy`, `system:provisioning` included for the built-in connector automations.
        createdAt:
          type: integer
          minimum: 0
          description: Epoch milliseconds
    AutomationSummary:
      type: object
      additionalProperties: false
      required:
      - name
      - latestVersion
      - deployedVersion
      - description
      - inputs
      - projectIds
      - trigger
      properties:
        name:
          type: string
          description: The real `/`-slug
        latestVersion:
          type: integer
        deployedVersion:
          type:
          - integer
          - 'null'
          description: null while nothing is deployed
        description:
          type:
          - string
          - 'null'
          description: The document’s `description` — the deployed version’s, else the newest saved one’s; null when neither declares one
        inputs:
          type:
          - object
          - 'null'
          additionalProperties: true
          description: The document’s `inputs` JSON Schema, chosen the same way — what a run input must match; null when the automation declares none
        presentation:
          description: The newest version’s display block, if authored
        trigger:
          type:
          - object
          - 'null'
          required:
          - kind
          - enabled
          - lastFiredAt
          - lastSkippedAt
          - lastSkipReason
          properties:
            kind:
              type: string
              enum:
              - schedule
              - webhook
              - event
            enabled:
              type: boolean
            lastFiredAt:
              type:
              - integer
              - 'null'
              minimum: 0
              description: The last time this binding started a run (`GET …/triggers` names that run as `lastRunId`); null until it has. For a schedule this is the occurrence the run fired for (the minute the cron named); for a webhook or an event, the moment the delivery or the event was accepted. A rebind to another kind starts it afresh.
            lastSkippedAt:
              type:
              - integer
              - 'null'
              minimum: 0
              description: The last time the binding came due (a schedule occurrence, an event, a webhook delivery) and started nothing — `lastSkipReason` says why; null until it has. With `paused_after_failures`, the moment the schedule paused itself.
            lastSkipReason:
              type:
              - string
              - 'null'
              enum:
              - not_deployed
              - unusable_cron
              - start_refused
              - paused_after_failures
              - null
              description: '`not_deployed`: the automation had no deployed version to run — deploy one. `unusable_cron`: the schedule’s expression or time zone could not be read; the scheduler leaves the binding alone until it is edited. `start_refused`: the deployed version’s `inputs` schema refused the run’s input (`{trigger, firedAt}` for a schedule). `paused_after_failures`: the schedule turned itself off (`enabled: false`) after 5 runs in a row failed for a reason the next occurrence would repeat — fix the automation, then save the trigger with `enabled: true`. Saving the trigger clears this reason, whatever `enabled` it sets.'
          description: 'What starts the automation, if a trigger is bound: its kind, whether it is switched on, and its health — the same `lastFiredAt`, `lastSkippedAt` and `lastSkipReason` that `GET …/triggers` reads, so one listing call finds every binding that is enabled and not firing (a `lastSkipReason` of `not_deployed` beside a null `deployedVersion` is a trigger waiting for a deploy); null when none is bound. `GET …/triggers` has the rest — the cron, the event, `lastRunId`.'
        projectIds:
          type: array
          items:
            type: string
          description: The projects this automation is installed in, limited to those the key holder can see. Empty for an organization-wide automation — and for one installed only in projects hidden from the key holder, which then refuses to start at the organization URL. A project-bound automation runs at `/api/v1/projects/{id}/automations/{name}/runs`.
