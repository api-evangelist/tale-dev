            resetsAt:
              type: number
              description: For BUDGET_EXCEEDED, when the period resets, in epoch milliseconds — `Retry-After` names the same wait in whole seconds
    Trigger:
      type: object
      description: 'The binding, and its health: `lastFiredAt` and `lastRunId` name the last run it started, `lastSkippedAt` and `lastSkipReason` the last time it came due and started nothing. A binding is alive when `lastFiredAt` keeps pace with its cadence; one whose `lastSkippedAt` is the newer stamp is coming due and not running — the reason says what to fix. `consecutiveFailures` counts the runs it started that failed in a row, and `lastFailedAt`, `lastFailureCode` and `lastFailedRunId` name the last of them — a schedule that reaches the threshold pauses itself.'
      required:
      - id
      - name
      - kind
      - hasToken
      - enabled
      - lastFiredAt
      - lastRunId
      - lastSkippedAt
      - lastSkipReason
      - consecutiveFailures
      - lastFailedAt
      - lastFailureCode
      - lastFailedRunId
      properties:
        id:
          type: string
          description: The binding’s id — what a run’s `startedBy` (`trigger:<id>`) names
        name:
          type: string
        kind:
          type: string
          enum:
          - schedule
          - webhook
          - event
        cron:
          type:
          - string
          - 'null'
        timezone:
          type:
          - string
          - 'null'
        event:
          type:
          - string
          - 'null'
        hasToken:
          type: boolean
          description: A webhook secret exists (never returned here)
        enabled:
          type: boolean
        lastRunId:
          type:
          - string
          - 'null'
          description: The run `lastFiredAt` started; null until one has, and again once that run is deleted.
        lastFiredAt:
          type:
          - integer
          - 'null'
          minimum: 0
          description: The last time this binding started a run (`GET …/triggers` names that run as `lastRunId`); null until it has. For a schedule this is the occurrence the run fired for (the minute the cron named); for a webhook or an event, the moment the delivery or the event was accepted. A rebind to another kind starts it afresh.
        lastSkippedAt:
          type:
          - integer
          - 'null'
          minimum: 0
          description: The last time the binding came due (a schedule occurrence, an event, a webhook delivery) and started nothing — `lastSkipReason` says why; null until it has. With `paused_after_failures`, the moment the schedule paused itself.
        lastSkipReason:
          type:
          - string
          - 'null'
          enum:
          - not_deployed
          - unusable_cron
          - start_refused
          - paused_after_failures
          - null
          description: '`not_deployed`: the automation had no deployed version to run — deploy one. `unusable_cron`: the schedule’s expression or time zone could not be read; the scheduler leaves the binding alone until it is edited. `start_refused`: the deployed version’s `inputs` schema refused the run’s input (`{trigger, firedAt}` for a schedule). `paused_after_failures`: the schedule turned itself off (`enabled: false`) after 5 runs in a row failed for a reason the next occurrence would repeat — fix the automation, then save the trigger with `enabled: true`. Saving the trigger clears this reason, whatever `enabled` it sets.'
        consecutiveFailures:
          type: integer
          minimum: 0
          description: 'Runs in a row this binding started that failed for a reason the next occurrence would repeat — a `failureCode` of `node_error`, `connector_error`, `llm_output_invalid`, `auth_error`, `missing_api_key`, `credit_exhausted`, `model_not_found`. A success sets it back to 0, and so does saving the trigger; any other failure neither counts nor breaks the streak. A schedule pauses itself when it reaches 5 (`enabled: false`, `lastSkipReason: "paused_after_failures"`) and keeps that count while paused: a run still in flight at the pause that succeeds afterwards leaves it alone, and only saving the trigger clears it. Webhook and event bindings keep counting and are never paused.'
        lastFailedAt:
          type:
          - integer
          - 'null'
          minimum: 0
          description: When the last run counted in the streak finished; null until one has. Kept after the streak resets; cleared by a rebind to another kind.
        lastFailureCode:
          type:
          - string
          - 'null'
          enum:
          - node_error
          - connector_error
          - llm_output_invalid
          - auth_error
          - missing_api_key
          - credit_exhausted
          - model_not_found
          - null
          description: That run’s `failureCode`.
        lastFailedRunId:
          type:
          - string
          - 'null'
          description: That run — `GET …/runs/{runId}` has its failure sentence; null once the run is deleted.
  headers:
    RetryAfter:
      description: How long to wait before retrying, in whole seconds
      schema:
        type: integer
        minimum: 1
    WWWAuthenticate:
      description: 'The challenge RFC 9110 §11.6.1 requires of a 401: `Bearer`, or `Bearer error="invalid_token"` when a key was presented and refused'
      schema:
        type: string
    XTaleApiVersion:
      description: The version of this contract (`info.version`) the serving instance implements — semver for the wire
      schema:
        type: string
        example: 3.27.0
    ETag:
      description: 'A validator: over the answer’s bytes on a JSON read, the stored object’s tag on a download. Send it back as `If-None-Match` — as received; the weak and edge-suffixed forms match too — to be told 304 when nothing changed.'
      schema:
        type: string
    Allow:
      description: The methods this path serves, comma-separated
      schema:
        type: string
        example: GET, POST, HEAD, OPTIONS
    XRequestId:
      description: The request id the platform logged this call under — quote it when reporting a problem. Echoes a sane `X-Request-Id` the caller sent.
      schema:
        type: string
    CacheControl:
      description: '`private, no-cache` on a validated read and on a download: keep the answer, revalidate it before reuse, and let no shared cache keep it. Every other answer says `no-store`.'
      schema:
        type: string
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: An organization API key. Create one in Settings → API. Pasted into the explorer on /docs it stays in the page’s memory only and is forgotten on reload — it is never stored.
