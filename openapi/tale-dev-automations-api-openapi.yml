              additionalProperties: false
              properties:
                kind:
                  type: string
                  enum:
                  - schedule
                  - webhook
                  - event
                cron:
                  type: string
                  description: 'Only with `kind: schedule`: the five-field cron expression. One that can never fire — a field out of range, a day no named month has (`0 0 30 2 *`) — answers 400 `AUTOMATION_TRIGGER_INVALID`.'
                timezone:
                  type: string
                  description: 'Only with `kind: schedule`: the IANA zone the cron is read in (UTC when absent)'
                event:
