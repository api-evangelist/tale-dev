components:
  schemas:
    BrowserSessionImport:
      type: object
      required:
      - domain
      - cookiesJar
      additionalProperties: false
      properties:
        domain:
          type: string
          minLength: 1
          maxLength: 255
          description: The host the jar was warmed for — a hostname or an http(s) URL, normalized to its lower-cased hostname on import; private-network and metadata hosts are refused (400 `INVALID_SESSION`)
        cookiesJar:
          type: string
          minLength: 1
          maxLength: 1000000
          description: A Netscape-format cookie jar, at most 1 MB
        userAgent:
          type: string
          maxLength: 512
        visitorData:
          type: string
          maxLength: 2048
        poToken:
          type: string
          maxLength: 4096
        label:
          type: string
          maxLength: 120
        ttlMs:
          type: integer
          minimum: 1
          maximum: 15552000000
          description: Lifetime in milliseconds (default 1209600000, 14 days; at most 15552000000, 180 days)
    Error:
      type: object
      required:
      - error
      - code
      properties:
        error:
          type: string
          description: What went wrong
        code:
          type: string
          enum:
          - ACTOR_AMBIGUOUS
          - ACTOR_DISABLED
          - ACTOR_FORBIDDEN
          - ACTOR_NOT_FOUND
          - ACTOR_REBOUND
          - ACTOR_UNVERIFIED
          - API_KEY_SCOPE_FORBIDDEN
          - ATTACHMENT_NOT_FOUND
          - ATTACHMENT_NOT_OWNED
          - ATTACHMENT_NOT_STAGED
          - ATTACHMENT_SIZE_MISMATCH
          - AUTHOR_UNVERIFIED
          - AUTOMATION_DELIVERY_SCOPE_MISMATCH
          - AUTOMATION_HAS_ACTIVE_RUNS
          - AUTOMATION_INPUT_INVALID
          - AUTOMATION_NOT_DEPLOYED
          - AUTOMATION_NOT_FOUND
          - AUTOMATION_NOT_INSTALLED
          - AUTOMATION_PROJECT_FORBIDDEN
          - AUTOMATION_PROJECT_SCOPE_REQUIRED
          - AUTOMATION_TRIGGER_INVALID
          - AUTOMATION_VERSION_NOT_DEPLOYED
          - AUTOMATION_VERSION_UNKNOWN
          - BLOB_NOT_FOUND
          - BODY_CHUNK_MALFORMED
          - BODY_LENGTH_MISMATCH
          - BODY_TOO_LARGE
          - BROWSER_SESSION_NOT_FOUND
          - BUDGET_EXCEEDED
