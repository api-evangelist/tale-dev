    post:
      tags:
      - Knowledge
      summary: Search visible Hub knowledge and organization websites
      description: Read-only semantic search as the key holder. Document results come from the visible Knowledge Hub and teams — file-backed documents only; a document created with inline `content` and no `fileId` is never indexed and cannot match. Web results come from the organization’s registered websites. Every project and conversation attachment is excluded. Corpus defaults to all.
      operationId: searchKnowledge
      security:
      - bearerAuth: []
      parameters:
      - name: X-Organization-Slug
