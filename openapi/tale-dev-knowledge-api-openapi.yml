            Retry-After:
              $ref: '#/components/headers/RetryAfter'
    patch:
      tags:
      - Knowledge
      summary: Supersede a knowledge entry
      description: 'Entries are immutable: an update writes a NEW row and answers its id (with the `documentId` it re-indexes under); the old row becomes `superseded`, stamped with `supersededAt`. Both `topic` and `content` are required. A write that repeats the active row — the same `topic` and `content` after trimming — writes no version and answers the active row’s own id (the documents PATCH rule), so a retry or a replaying sync job never inflates the history; a case-only change of the topic is a change. Only the ACTIVE row of a topic takes an update — a superseded row answers 409 naming the topic’s ACTIVE row (`data.activeId`, beside `data.supersededBy`, its direct successor), an identical body included, so a stale id costs one round trip, never a chase down the chain. Requires the knowledge write grant (editor and up).'
      operationId: updateKnowledgeEntry
      security:
      - bearerAuth: []
      parameters:
      - name: X-Organization-Slug
        in: header
        required: false
        schema:
          type: string
        description: The organization to operate on. STRICTLY REQUIRED on every call, reads included, when the key holder belongs to more than one organization — without it such requests are refused with 400 `ORG_SLUG_REQUIRED` (the dashboard’s last-active organization never steers a machine call). A slug that names no organization answers 404 `ORG_SLUG_INVALID`, one the key holder is no member of 403 `ORG_FORBIDDEN`. Single-organization keys may omit it; a blank or whitespace-only value reads as the header absent. Each of the three refusals lists the slugs the key holder may send under `data.organizations`; `GET /api/v1/me` answers them too.
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: Entry ID
      - name: X-Request-Id
        in: header
        required: false
        description: 'Your own correlation id, echoed back on the response and written to the platform’s log: up to 255 characters of letters, digits, `_`, `-` and `=`. Any other value is replaced by a fresh UUID (the response carries the id that was used), and uniqueness of an id you choose is yours to keep.'
        schema:
          type: string
          pattern: ^[A-Za-z0-9_=-]{1,255}$
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - topic
              - content
              additionalProperties: false
              properties:
                topic:
                  type: string
                  minLength: 1
                  maxLength: 120
                content:
                  type: string
                  minLength: 1
                  maxLength: 8000
                  description: Markdown. Leading and trailing whitespace is removed before the length check and before storing; the cap counts UTF-16 code units, so an astral character (an emoji) costs two.
      responses:
        '200':
          description: The NEW row’s id and the document it re-indexes under — or, for a body that repeats the active row, that row’s id with nothing written
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgeEntryCreated'
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            X-Tale-Api-Version:
              $ref: '#/components/headers/XTaleApiVersion'
        '400':
