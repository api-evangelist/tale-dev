openapi: 3.2.0
info:
  title: Tale Dev MCP API
  version: 3.27.0
  contact:
    name: Tale
    url: https://tale.dev
  description: 'Operations tagged MCP across 2 of this provider''s published API definitions: tale-dev-openapi-original.json, tale-dev-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: '{origin}'
  description: The deployment this document describes — `GET /openapi.json` on a running instance fills it in
  variables:
    origin:
      default: https://your-host.example.com
      description: Scheme and host of the Tale deployment
security:
- bearerAuth: []
tags:
- name: MCP
  description: The platform MCP endpoint (JSON-RPC over HTTP).
paths:
  /api/v1/mcp:
    post:
      tags:
      - MCP
      summary: The platform MCP endpoint
      description: 'JSON-RPC over HTTP, both MCP protocol eras on one endpoint (JSON responses only, no SSE). On 2025-11-25, or 2025-06-18 or 2025-03-26 when the client proposes it, the client opens with `initialize`, which answers `instructions` and reports the API contract version as `serverInfo.version`; a request carries one message, or a JSON-RPC batch answered as an array. On 2026-07-28 there is no `initialize`: every request carries its revision and the client’s capabilities in `params._meta`, mirrored into the `MCP-Protocol-Version`, `Mcp-Method` and `Mcp-Name` headers; `server/discover` answers the revisions, capabilities and instructions; a request carries one message; and every result adds `resultType` and the server under `_meta`, with `ttlMs` and `cacheScope` where a client may cache it. Authenticate with the same Bearer org API key as the REST API. Call `tools/list` for the tool inventory — automation authoring, run and trigger management, and the organization’s capability surface — and the `get_docs` tool for the in-band authoring reference; `resources/list` and `prompts/list` name what a client reads by address (the references, automations, runs) and the ready-made prompts. Tool arguments are checked against the advertised input schema, and every problem comes back at once as a tool result (code INVALID_ARGUMENTS). GET answers 405. See the MCP endpoint page in the developer docs for the full tour.'
      operationId: mcp
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
              - type: object
                required:
                - jsonrpc
                - method
                properties:
                  jsonrpc:
                    type: string
                    enum:
                    - '2.0'
                  id:
                    oneOf:
                    - type: string
                    - type: integer
                    description: The request id — a string or an integer (a fraction is refused, -32600); omit it for a notification, which is acknowledged with 202 and never answered
                  method:
                    type: string
                  params:
                    type: object
                    additionalProperties: true
              - type: array
                minItems: 1
                maxItems: 20
                items:
                  type: object
                  required:
                  - jsonrpc
                  - method
                  properties:
                    jsonrpc:
                      type: string
                      enum:
                      - '2.0'
                    id:
                      oneOf:
                      - type: string
                      - type: integer
                      description: The request id — a string or an integer (a fraction is refused, -32600); omit it for a notification, which is acknowledged with 202 and never answered
                    method:
                      type: string
                    params:
                      type: object
                      additionalProperties: true
                description: A JSON-RPC batch, on the 2025 revisions only — at most 20 messages; every tool call, resource read or listing, or prompt beyond the first draws from the request budget like a request of its own
      responses:
        '200':
          description: The JSON-RPC reply — a result or an error envelope; an array of them for a batch. A tool call that failed is a result whose `isError` is true, never an error envelope.
          content:
            application/json:
              schema:
                oneOf:
                - oneOf:
                  - type: object
                    required:
                    - jsonrpc
                    - id
                    - result
                    properties:
                      jsonrpc:
                        type: string
                        enum:
                        - '2.0'
                      id:
                        oneOf:
                        - type: string
                        - type: integer
                        description: The request id — a string or an integer
                      result:
                        type: object
                        additionalProperties: true
                  - type: object
                    required:
                    - jsonrpc
                    - id
                    - error
                    properties:
                      jsonrpc:
                        type: string
                        enum:
                        - '2.0'
                      id:
                        anyOf:
                        - type:
                          - string
                          - 'null'
                        - type:
                          - integer
                          - 'null'
                        description: The request id, or null when the request could not be read (a parse error, an invalid envelope)
                      error:
                        type: object
                        required:
                        - code
                        - message
                        properties:
                          code:
                            type: integer
                            description: -32700 parse error, -32600 invalid request, -32601 unknown method, -32602 invalid params (an unknown tool, a `tools/call` without a name, a malformed resource address, an unknown prompt or its arguments; on 2026-07-28 also a missing or malformed `params._meta` envelope, `data.missing` / `data.malformed`, and a resource address that reads nothing), -32002 a resource address that reads nothing on the 2025 revisions (`data.code` names the refusal), -32603 a resource read that failed unexpectedly (`data.requestId`), -32020 a 2026-07-28 request whose `MCP-Protocol-Version`, `Mcp-Method` or `Mcp-Name` header is missing or does not say what its body says, -32022 unsupported protocol revision (`data.supported`), -32000 a tool call in a batch that exceeded the key holder’s request budget (`data.retryAfterMs` names the wait). Arguments that do not match a tool’s advertised input schema are a tool result flagged `isError` whose text names the tool-error code INVALID_ARGUMENTS (a tool code, not a REST one), never an error envelope
                          message:
                            type: string
                - type: array
                  items:
                    oneOf:
                    - type: object
                      required:
                      - jsonrpc
                      - id
                      - result
                      properties:
                        jsonrpc:
                          type: string
                          enum:
                          - '2.0'
                        id:
                          oneOf:
                          - type: string
                          - type: integer
                          description: The request id — a string or an integer
                        result:
                          type: object
                          additionalProperties: true
                    - type: object
                      required:
                      - jsonrpc
                      - id
                      - error
                      properties:
                        jsonrpc:
                          type: string
                          enum:
                          - '2.0'
                        id:
                          anyOf:
                          - type:
                            - string
                            - 'null'
                          - type:
                            - integer
                            - 'null'
                          description: The request id, or null when the request could not be read (a parse error, an invalid envelope)
                        error:
                          type: object
                          required:
                          - code
                          - message
                          properties:
                            code:
                              type: integer
                              description: -32700 parse error, -32600 invalid request, -32601 unknown method, -32602 invalid params (an unknown tool, a `tools/call` without a name, a malformed resource address, an unknown prompt or its arguments; on 2026-07-28 also a missing or malformed `params._meta` envelope, `data.missing` / `data.malformed`, and a resource address that reads nothing), -32002 a resource address that reads nothing on the 2025 revisions (`data.code` names the refusal), -32603 a resource read that failed unexpectedly (`data.requestId`), -32020 a 2026-07-28 request whose `MCP-Protocol-Version`, `Mcp-Method` or `Mcp-Name` header is missing or does not say what its body says, -32022 unsupported protocol revision (`data.supported`), -32000 a tool call in a batch that exceeded the key holder’s request budget (`data.retryAfterMs` names the wait). Arguments that do not match a tool’s advertised input schema are a tool result flagged `isError` whose text names the tool-error code INVALID_ARGUMENTS (a tool code, not a REST one), never an error envelope
                            message:
                              type: string
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            X-Tale-Api-Version:
              $ref: '#/components/headers/XTaleApiVersion'
        '202':
          description: A notification (a message without an id), or a batch of notifications alone — acknowledged, no body
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            X-Tale-Api-Version:
              $ref: '#/components/headers/XTaleApiVersion'
        '400':
          description: 'The body could not be acted on: not JSON (-32700); not a JSON-RPC 2.0 message, an id that is not a string or an integer, an empty batch, or a batch naming 2026-07-28 (-32600); an `MCP-Protocol-Version` header or a `_meta` revision the endpoint does not speak (-32022, with `data.supported` listing the ones it does and `data.requested`); or, on 2026-07-28, a missing or malformed `params._meta` envelope (-32602) or a header that is missing or does not say what the body says (-32020). Nothing runs'
          content:
            application/json:
              schema:
                type: object
                required:
                - jsonrpc
                - id
                - error
                properties:
                  jsonrpc:
                    type: string
                    enum:
                    - '2.0'
                  id:
                    anyOf:
                    - type:
                      - string
                      - 'null'
                    - type:
                      - integer
                      - 'null'
                    description: The request id, or null when the request could not be read (a parse error, an invalid envelope)
                  error:
                    type: object
                    required:
                    - code
                    - message
                    properties:
                      code:
                        type: integer
                        description: -32700 parse error, -32600 invalid request, -32601 unknown method, -32602 invalid params (an unknown tool, a `tools/call` without a name, a malformed resource address, an unknown prompt or its arguments; on 2026-07-28 also a missing or malformed `params._meta` envelope, `data.missing` / `data.malformed`, and a resource address that reads nothing), -32002 a resource address that reads nothing on the 2025 revisions (`data.code` names the refusal), -32603 a resource read that failed unexpectedly (`data.requestId`), -32020 a 2026-07-28 request whose `MCP-Protocol-Version`, `Mcp-Method` or `Mcp-Name` header is missing or does not say what its body says, -32022 unsupported protocol revision (`data.supported`), -32000 a tool call in a batch that exceeded the key holder’s request budget (`data.retryAfterMs` names the wait). Arguments that do not match a tool’s advertised input schema are a tool result flagged `isError` whose text names the tool-error code INVALID_ARGUMENTS (a tool code, not a REST one), never an error envelope
                      message:
                        type: string
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            X-Tale-Api-Version:
              $ref: '#/components/headers/XTaleApiVersion'
        '401':
          description: Missing or invalid API key (`UNAUTHORIZED`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            X-Tale-Api-Version:
              $ref: '#/components/headers/XTaleApiVersion'
            WWW-Authenticate:
              $ref: '#/components/headers/WWWAuthenticate'
        '403':
          description: Where the operator enforces the browser-origin rule, the request carries an `Origin` header the deployment does not accept (`ORIGIN_FORBIDDEN`) — a CLI or server client sends none; or `X-Organization-Slug` names an organization the key holder is no member of (`ORG_FORBIDDEN`, with the slugs the key holder may send under `data.organizations`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            X-Tale-Api-Version:
              $ref: '#/components/headers/XTaleApiVersion'
        '404':
          description: 'On 2026-07-28 only: a method that revision does not have — `initialize`, `ping` or one the endpoint does not serve (-32601), as a JSON-RPC error. The 2025 revisions answer an unknown method with 200; or `X-Organization-Slug` names no organization (`ORG_SLUG_INVALID`, with the slugs the key holder may send under `data.organizations`)'
          content:
            application/json:
              schema:
                oneOf:
                - type: object
                  required:
                  - jsonrpc
                  - id
                  - error
                  properties:
                    jsonrpc:
                      type: string
                      enum:
                      - '2.0'
                    id:
                      anyOf:
                      - type:
                        - string
                        - 'null'
                      - type:
                        - integer
                        - 'null'
                      description: The request id, or null when the request could not be read (a parse error, an invalid envelope)
                    error:
                      type: object
                      required:
                      - code
                      - message
                      properties:
                        code:
                          type: integer
                          description: -32700 parse error, -32600 invalid request, -32601 unknown method, -32602 invalid params (an unknown tool, a `tools/call` without a name, a malformed resource address, an unknown prompt or its arguments; on 2026-07-28 also a missing or malformed `params._meta` envelope, `data.missing` / `data.malformed`, and a resource address that reads nothing), -32002 a resource address that reads nothing on the 2025 revisions (`data.code` names the refusal), -32603 a resource read that failed unexpectedly (`data.requestId`), -32020 a 2026-07-28 request whose `MCP-Protocol-Version`, `Mcp-Method` or `Mcp-Name` header is missing or does not say what its body says, -32022 unsupported protocol revision (`data.supported`), -32000 a tool call in a batch that exceeded the key holder’s request budget (`data.retryAfterMs` names the wait). Arguments that do not match a tool’s advertised input schema are a tool result flagged `isError` whose text names the tool-error code INVALID_ARGUMENTS (a tool code, not a REST one), never an error envelope
                        message:
                          type: string
                - $ref: '#/components/schemas/Error'
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            X-Tale-Api-Version:
              $ref: '#/components/headers/XTaleApiVersion'
        '405':
          description: The path exists, but not for this method (`METHOD_NOT_ALLOWED`); `Allow` names the methods it serves
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            X-Tale-Api-Version:
              $ref: '#/components/headers/XTaleApiVersion'
            Allow:
              $ref: '#/components/headers/Allow'
        '413':
          description: The body exceeds this operation’s byte cap — 1 MiB unless the description says otherwise (`BODY_TOO_LARGE`); the envelope carries a `requestId`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            X-Tale-Api-Version:
              $ref: '#/components/headers/XTaleApiVersion'
        '429':
          description: 'The key holder’s request budget is spent (`RATE_LIMITED`): `Retry-After` names the wait in whole seconds and `data.retryAfterMs` in milliseconds; the envelope carries a `requestId`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            X-Tale-Api-Version:
              $ref: '#/components/headers/XTaleApiVersion'
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
        '500':
          description: Internal error (`INTERNAL_ERROR`); the envelope carries a `requestId` to quote when reporting it
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            X-Tale-Api-Version:
              $ref: '#/components/headers/XTaleApiVersion'
        '503':
          description: 'The platform’s database is restarting or cannot be reached (`DATABASE_UNAVAILABLE`): `Retry-After` names the wait in whole seconds — retry with backoff; the envelope carries a `requestId`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            X-Tale-Api-Version:
              $ref: '#/components/headers/XTaleApiVersion'
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
      parameters:
      - name: X-Organization-Slug
        in: header
        required: false
        schema:
          type: string
        description: The organization to operate on. STRICTLY REQUIRED on every call, reads included, when the key holder belongs to more than one organization — without it such requests are refused with 400 `ORG_SLUG_REQUIRED` (the dashboard’s last-active organization never steers a machine call). A slug that names no organization answers 404 `ORG_SLUG_INVALID`, one the key holder is no member of 403 `ORG_FORBIDDEN`. Single-organization keys may omit it; a blank or whitespace-only value reads as the header absent. Each of the three refusals lists the slugs the key holder may send under `data.organizations`; `GET /api/v1/me` answers them too.
      - name: X-Request-Id
        in: header
        required: false
        description: 'Your own correlation id, echoed back on the response and written to the platform’s log: up to 255 characters of letters, digits, `_`, `-` and `=`. Any other value is replaced by a fresh UUID (the response carries the id that was used), and uniqueness of an id you choose is yours to keep.'
        schema:
          type: string
          pattern: ^[A-Za-z0-9_=-]{1,255}$
    servers:
    - url: '{origin}'
      description: The deployment this document describes — `GET /openapi.json` on a running instance fills it in
      variables:
        origin:
          default: https://your-host.example.com
          description: Scheme and host of the Tale deployment
components:
  schemas:
    Error:
      type: object
      required:
      - error
      - code
      properties:
        error:
          type: string
          description: What went wrong
        code:
          type: string
          enum:
          - ACTOR_AMBIGUOUS
          - ACTOR_DISABLED
          - ACTOR_FORBIDDEN
          - ACTOR_NOT_FOUND
          - ACTOR_REBOUND
          - ACTOR_UNVERIFIED
          - API_KEY_SCOPE_FORBIDDEN
          - ATTACHMENT_NOT_FOUND
          - ATTACHMENT_NOT_OWNED
          - ATTACHMENT_NOT_STAGED
          - ATTACHMENT_SIZE_MISMATCH
          - AUTHOR_UNVERIFIED
          - AUTOMATION_DELIVERY_SCOPE_MISMATCH
          - AUTOMATION_HAS_ACTIVE_RUNS
          - AUTOMATION_INPUT_INVALID
          - AUTOMATION_NOT_DEPLOYED
          - AUTOMATION_NOT_FOUND
          - AUTOMATION_NOT_INSTALLED
          - AUTOMATION_PROJECT_FORBIDDEN
          - AUTOMATION_PROJECT_SCOPE_REQUIRED
